# One-command demo: `docker compose up`
#
# Runs in mock mode by default, so it needs no API key and no network. That is deliberate - a
# demo that only works with the author's credentials is a demo nobody can reproduce.
#
# To run against the live model instead:
#   AEGIS_MOCK=0 ANTHROPIC_API_KEY=sk-... docker compose up

services:
  aegis:
    build: .
    environment:
      AEGIS_MOCK: "${AEGIS_MOCK:-1}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AEGIS_PRICE_IN: "${AEGIS_PRICE_IN:-3.00}"
      AEGIS_PRICE_OUT: "${AEGIS_PRICE_OUT:-15.00}"
    command: ["demo", "--verbose"]
