# catalog-api's identity. EKS Pod Identity (terraform/fullstack/eks.tf, association shop/catalog-api)
# gives its pods role warden-dev-catalog-pod, whose one grant is rds-db:connect as database user
# catalog. No Kubernetes API token is mounted: the Pod Identity agent injects its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-api
  namespace: shop
  labels:
    project: warden
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: shop
  labels:
    app: catalog-api
    project: warden
    # Datadog's standard labels: its agent tags this workload's container logs and Kubernetes metrics env and service
    # from them (the monitors filter on both, scripts/datadog_setup.py).
    tags.datadoghq.com/service: catalog-api
spec:
  # No replicas here: the HorizontalPodAutoscaler below owns the count, and Argo CD is told so (k8s/argocd).
  selector:
    matchLabels:
      app: catalog-api
  # One pod at a time and no surge: a rollout that cannot become ready shows as 1 of 2 ready
  # instead of hiding behind the old pods.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      # ⛔ The amazon-cloudwatch-observability add-on auto-injects an OpenTelemetry agent into pods
      # behind a Service (Application Signals). Its container violates the namespace's `restricted`
      # Pod Security, so EVERY catalog-api pod was refused on the first real deploy - and
      # it injected the Java agent into a Python app. Opt out explicitly; metrics still come from the
      # add-on's node agent, which is what the alarms read.
      annotations:
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
      labels:
        app: catalog-api
        project: warden
        tags.datadoghq.com/service: catalog-api
    spec:
      serviceAccountName: catalog-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # The commit's image by digest, set by the shop Application: its kustomize image override replaces this
          # name and tag with <repository>@sha256:<digest>, so this tag is never pulled.
          image: shop-app:set-by-argocd
          ports:
            - name: https
              containerPort: 8080
          env:
            - name: APP_ROLE
              value: catalog-api
            - name: OTEL_SERVICE_NAME
              value: catalog-api
            # Required at start (scenarios/fullstack/app/app.py); fs-23 removes the key.
            - name: CATALOG_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: catalog-secret
                  key: CATALOG_SIGNING_KEY
          envFrom:
            - configMapRef:
                name: catalog-config
            - configMapRef:
                name: shop-infra
            - configMapRef:
                name: otel-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTPS  # the app's own certificate; the kubelet does not verify a probe's certificate
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTPS  # the app's own certificate; the kubelet does not verify a probe's certificate
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: shop
  labels:
    project: warden
spec:
  selector:
    app: catalog-api
  ports:
    - name: https  # the pods serve HTTPS only (Sonar python:S5332, owner row 25)
      port: 443
      targetPort: 8080
      appProtocol: https
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalog-api
  namespace: shop
  labels:
    project: warden
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog-api
  namespace: shop
  labels:
    project: warden
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: catalog-api
