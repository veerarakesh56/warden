# The alert template for Wave 4 (the full stack). fullstack_cli fills it per fault:
#   name        <- the CloudWatch alarm's name
#   summary     <- the alarm's DESCRIPTION, which names the symptom, never the cause
#   severity    <- the catalog's severity for the fault
#   started_at  <- now (passed as --started-at now)
# and the labels below are the SAME for every fault (contract A): the service map a team keeps in
# tags, naming every component of the application - so they never point at the broken one.
# A DLQ is found from its queue's RedrivePolicy, never labelled. `warden-__ENV__-ops` (harness-only)
# and `warden-__ENV__-traffic` (the load generator) are not part of the application and are absent.
#
# The summary below is the fallback when an alarm has no description.
# `environment: prod` is the policy environment the benchmark is judged under - the strictest - whatever stack it
# runs on (the stack is WARDEN_ENV's; its names are rewritten per run). A report from a dev run says prod for that
# reason, not by mistake (eighth review, 2026-10-01).

alert_id: bench
name: StackAlarm
severity: high
service: shop
environment: prod
summary: CloudWatch alarm fired for the shop application on AWS
started_at: "2026-01-01T00:00:00Z"
labels:
  app: shop
  lambda: warden-__ENV__-checkout,warden-__ENV__-order-processor,warden-__ENV__-notifier,warden-__ENV__-reconciler
  sqs: warden-__ENV__-orders,warden-__ENV__-notifications
  dynamodb_table: warden-__ENV__-carts
  elasticache: warden-__ENV__-redis
  aurora_cluster: warden-__ENV__-aurora
  alb_target_group: warden-__ENV__-orders
  apigw: warden-__ENV__-api
  ecs_cluster: warden-__ENV__-ecs
  ecs_service: warden-__ENV__-orders-api
  eks_cluster: warden-__ENV__-eks
  namespace: shop
  deployment: catalog-api,cart-worker
  secret: warden-__ENV__-db-app
  sns_topic: warden-__ENV__-order-events
  eventbridge_rule: warden-__ENV__-reconcile-5m
