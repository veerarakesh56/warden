# Wave 4 - the full stack (docs/WAVE4-FULLSTACK.md, section 7). 28 faults, one run each.
#
# Operator-driven, not a loop: `python -m scenarios.fullstack_cli inject|diagnose|fix|verify|revert
# fs-NN`, one step at a time (see that module). Every fault's inject/revert/verifier is in
# scenarios/ops_fullstack.py under the same fs-NN key.
#
# Per fault:
#   alarm             the CloudWatch alarm whose ALARM state is the alert. WARDEN gets its name and
#                     its DESCRIPTION (which names the symptom, never the cause), the catalog
#                     severity, and the SAME full service map for every fault (contract A).
#   expect_alarm      false only for the healthy control: nothing should fire.
#   settle_seconds    minimum wait after the inject before the alarm is polled (IAM propagation,
#                     a rollout starting, three SQS receives before the DLQ).
#   alarm_timeout_s   how long to wait for ALARM. If it never fires, the ground truth says
#                     `alarm_never_fired` and WARDEN is still run at the timeout - honestly.
#   recover_within    how long the verifier ("fixed when", section 7) is polled after a fix.
#   evidence_assertions  what WARDEN's context must contain, in contract B metric names and
#                     contract C line prefixes. Metric names carry the `__<short>` suffix because
#                     the service map names several functions / queues / Deployments.
#
# ⛔ Nothing here says what the answer is. Grading is scenarios/scoring.yaml, by fault class.

wave: 4
service: fullstack
target_service: shop

scenarios:
  - id: fs-00-healthy-control
    title: Nothing is broken
    fault_class: healthy_control
    fidelity: real
    signature_covered: false
    severity: medium
    alarm: warden-pg-fs-api-5xx
    expect_alarm: false
    settle_seconds: 0
    alarm_timeout_s: 0
    recover_within: 60
    inject: []
    revert: []
    evidence_assertions:
      - kind: metric_present
        name: lambda_invocations__checkout
      - kind: metric_equal
        left: dlq_visible__orders
        right_value: 0
    notes: >
      The negative control. The alert is the API 5xx alarm's description while the alarm is OK.
      Any mutating fix applied here is measured against the whole-stack baseline.

  - id: fs-01-lambda-code-regression
    title: checkout v(N+1) raises KeyError on a real payload field; alias live moved to it
    fault_class: lambda_code_regression
    fidelity: real
    signature_covered: false
    severity: high
    alarm: warden-pg-fs-api-5xx
    settle_seconds: 60
    alarm_timeout_s: 600
    recover_within: 600
    inject: [{op: fs_inject, fault: fs-01}]
    revert: [{op: fs_revert, fault: fs-01}]
    evidence_assertions:
      - {kind: log_contains, value: "CODE warden-pg-fs-checkout app.py:"}
      - {kind: log_contains, value: "KeyError"}
      - {kind: deploys_nonempty}
    notes: >
      The application flag CHECKOUT_PAYLOAD_SCHEMA (v1 at baseline) is set to v2 and published as a
      new version, so the traceback frame is real deployed code and the alias move is a real deploy.

  - id: fs-02-lambda-timeout-too-low
