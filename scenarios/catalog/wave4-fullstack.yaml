    fault_class: lambda_timeout_too_low
    fidelity: real
    signature_covered: false
    severity: high
    alarm: warden-pg-fs-checkout-errors
    settle_seconds: 60
    alarm_timeout_s: 600
    recover_within: 600
    inject: [{op: fs_inject, fault: fs-02}]
    revert: [{op: fs_revert, fault: fs-02}]
    evidence_assertions:
      - {kind: log_contains, value: "Task timed out after 1.00 seconds"}
      - {kind: metric_equal, left: lambda_timeout_s__checkout, right_value: 1}
    notes: >
      Published as a version and moved onto `live` (the API invokes the alias; a $LATEST-only
      change would reach no traffic), so it is also a deploy.

  - id: fs-03-lambda-throttled
