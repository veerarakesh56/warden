    revert: [{op: fs_revert, fault: fs-15}]
    evidence_assertions:
      - {kind: log_contains, value: "EVENT aurora warden-pg-fs-aurora"}
      - {kind: log_contains, value: "read-only transaction"}
    notes: The original writer is recorded; the revert fails back to it.

  - id: fs-16-aurora-slow-query
