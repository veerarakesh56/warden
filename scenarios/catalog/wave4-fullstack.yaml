    inject: [{op: fs_inject, fault: fs-12}]
    revert: [{op: fs_revert, fault: fs-12}]
    evidence_assertions:
      - {kind: metric_present, name: aurora_connections}
      - {kind: log_contains, any_of: ["too many clients", "remaining connection slots"]}
    notes: >
      Held by a detached holder process (application_name warden-bench-hold-fs-12), three slots
      given back so an operator can still connect; the apps' pools take them and hit the limit.

