  - id: fs-12-aurora-connection-exhaustion
    title: idle sessions opened until max_connections
    fault_class: aurora_connection_exhaustion
    fidelity: real
    signature_covered: false
    severity: critical
    alarm: warden-pg-fs-aurora-connections
    settle_seconds: 30
    alarm_timeout_s: 600
