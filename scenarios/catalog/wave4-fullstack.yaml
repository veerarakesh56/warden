    revert: [{op: fs_revert, fault: fs-16}]
    evidence_assertions:
      - {kind: metric_gte, left: reader_long_running_queries, right_value: 1}
    notes: >
      The index's definition is read from pg_indexes before the drop; the revert recreates it
      CONCURRENTLY from that text. RECONCILE_LOOKUP (by_id at baseline) selects the scanning path,
      which runs on the READER endpoint - so the evidence is the reader's session metrics.

