    fault_class: eventbridge_rule_disabled
    fidelity: real
    signature_covered: false
    severity: medium
    alarm: warden-pg-fs-reconciler-invocations-low
    settle_seconds: 300
    alarm_timeout_s: 1500
    recover_within: 900
    inject: [{op: fs_inject, fault: fs-27}]
    revert: [{op: fs_revert, fault: fs-27}]
    evidence_assertions:
      - {kind: metric_equal, left: rule_enabled, right_value: 0}
    notes: >
      The alarm needs 10 minutes without an invocation (treat missing data as breaching), and the
      rule only fires every 5, hence the long settle and timeout.
