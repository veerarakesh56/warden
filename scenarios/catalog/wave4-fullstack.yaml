    inject: [{op: fs_inject, fault: fs-03}]
    revert: [{op: fs_revert, fault: fs-03}]
    evidence_assertions:
      - {kind: metric_gte, left: lambda_throttles__checkout, right_value: 1}
      - {kind: metric_equal, left: lambda_reserved_concurrency__checkout, right_value: 0}
    notes: Function-level setting, not versioned - no deploy.

