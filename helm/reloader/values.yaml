# Stakater Reloader for the dev cluster (owner item B25): chart reloader 2.2.18 = Reloader v1.4.22 (chart published
# 2026-09-30, tag chart-v2.2.18 at 11144f95b629ea4c418619d8dfc5dd47d5d10eb1; package sha256
# 5eb4576ba75a0e165897e8a98a6ffef15d68939430da6eb8fe80796bba75cb17, the digest stakater's chart index lists, checked
# before install). Every key below is read from that chart's own values.yaml (2026-10-20). Its one job: restart
# catalog-api when catalog-secret changes (the Deployment's secret.reloader.stakater.com/reload annotation).

# The image by digest: ghcr.io/stakater/reloader:v1.4.22's index, read from ghcr.io on 2026-10-20.
image:
  repository: ghcr.io/stakater/reloader
  digest: "sha256:def2480040adc164b3a57340e77674eadfd88fb7f0593df25e93297f29c7fd7c"

reloader:
  # The shop namespace only: a Role there (and in its own namespace), no ClusterRole.
  watchGlobally: false
  namespaces: ["shop"]
  # Only Secrets, and only the workloads that name one in their annotation.
  autoReloadAll: false
  ignoreConfigMaps: true
  # A restart is an annotation on the pod template, which Argo CD is told to ignore (k8s/argocd/shop.yaml); the
  # default strategy adds an environment variable that self-heal would take back.
  reloadStrategy: annotations
  readOnlyRootFileSystem: true
  deployment:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
