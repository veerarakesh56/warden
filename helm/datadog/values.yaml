# Datadog's agent on the lab cluster (scripts/deploy_fullstack_apps.py deploy_datadog): what leaves for Datadog is
# masked AT THE AGENT first (owner, 2026-10-21). The apps' logs - read from their containers, and their OpenTelemetry
# logs, which the agent's OTLP receiver hands to the same Logs Agent pipeline - pass these global processing rules
# (DD_LOGS_CONFIG_PROCESSING_RULES, mask_sequences) before they are sent: every class WARDEN masks (redaction.py),
# written in RE2 (the agent's regex language: no lookaround, no backreference). tests/test_datadog_agent_masking.py
# holds them to the same corpus as WARDEN's own patterns. Not covered here, by design: `.local` and `.internal` host
# names - a Kubernetes service's and AWS's own, everywhere in these logs, and RE2 cannot leave them out selectively.
# Spans too: DD_APM_REPLACE_TAGS masks every tag's value with the same rules (Datadog's APM already obfuscates SQL);
# the collector before it hashes the attributes that name a person or a client (and a pod's or node's address) and
# drops URL queries. That hash is pseudonymous, not anonymous: it is unsalted, so a list of candidate values can be
# hashed and matched against it.
datadog:
  env:
  - name: DD_LOGS_CONFIG_PROCESSING_RULES
    value: '[{"type": "mask_sequences", "name": "private_keys", "replace_placeholder": "[masked:private-key]", "pattern": "-----BEGIN [A-Z ]*PRIVATE KEY-----[\\s\\S]*?(?:-----END [A-Z ]*PRIVATE KEY-----|$)"}, {"type": "mask_sequences", "name": "jwts", "replace_placeholder": "[masked:token]", "pattern": "eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]*\\.[A-Za-z0-9_\\-]+"}, {"type": "mask_sequences", "name": "vendor_keys", "replace_placeholder": "[masked:key]", "pattern": "\\b(?:sk-ant-|sk-|sk_live_|github_pat_|ghp_|gho_|ghs_|AKIA|ASIA|xox[baprs]-|glpat-|AIza|npm_|hf_)[A-Za-z0-9_\\-]{8,}"}, {"type": "mask_sequences", "name": "url_credentials", "replace_placeholder": "://[masked]@", "pattern": "://[^\\s:/@]+:[^\\s@/]+@"}, {"type": "mask_sequences", "name": "bearer_tokens", "replace_placeholder": "[masked:token]", "pattern": "(?i)\\b(?:bearer|basic)\\s+[A-Za-z0-9._~+/\\-]{8,}=*"}, {"type": "mask_sequences", "name": "credential_values", "replace_placeholder": "[masked:secret]", "pattern": "(?i)(?:password|passwd|pwd|secret|token|api[_\\-]?key|access[_\\-]?key|client[_\\-]?secret|session[_\\-]?id|cookie)[\\w.\\-]{0,20}[\\\"'']?\\s*[:=]\\s*[\\\"'']?[^\\s\\\"'',;&]+"}, {"type": "mask_sequences", "name": "emails", "replace_placeholder": "[masked:email]", "pattern": "[A-Za-z0-9._+\\-]+(?:@|%40)[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}"}, {"type": "mask_sequences", "name": "card_numbers", "replace_placeholder": "[masked:card]", "pattern": "\\b(?:\\d{4}[ \\-]){3}\\d{4}\\b"}, {"type": "mask_sequences", "name": "aadhaar", "replace_placeholder": "[masked:aadhaar]", "pattern": "\\b[2-9]\\d{3}[ \\-]\\d{4}[ \\-]\\d{4}\\b"}, {"type": "mask_sequences", "name": "ssn", "replace_placeholder": "[masked:ssn]", "pattern": "\\b\\d{3}-\\d{2}-\\d{4}\\b"}, {"type": "mask_sequences", "name": "pan", "replace_placeholder": "[masked:pan]", "pattern": "\\b[A-Z]{3}[ABCFGHJLPT][A-Z]\\d{4}[A-Z]\\b"}, {"type": "mask_sequences", "name": "ibans", "replace_placeholder": "[masked:iban]", "pattern": "\\b[A-Z]{2}\\d{2}[A-Za-z0-9]{11,30}\\b"}, {"type": "mask_sequences", "name": "ipv6", "replace_placeholder": "[masked:ipv6]", "pattern": "\\b(?:[A-Fa-f0-9]{1,4}:){7}[A-Fa-f0-9]{1,4}\\b|\\b(?:[A-Fa-f0-9]{1,4}:){1,7}:(?:[A-Fa-f0-9]{1,4}(?::[A-Fa-f0-9]{1,4}){0,6})?"}, {"type": "mask_sequences", "name": "mac_addresses", "replace_placeholder": "[masked:mac]", "pattern": "\\b(?:[0-9A-Fa-f]{2}[:\\-]){5}[0-9A-Fa-f]{2}\\b|\\b[0-9A-Fa-f]{4}\\.[0-9A-Fa-f]{4}\\.[0-9A-Fa-f]{4}\\b"}, {"type": "mask_sequences", "name": "ipv4_in_names", "replace_placeholder": "[masked:ipv4]", "pattern": "\\b(?:ip|ec2)-\\d{1,3}(?:-\\d{1,3}){3}\\b|\\b\\d{1,3}(?:-\\d{1,3}){3}\\.[\\w-]+\\.pod\\b"}, {"type": "mask_sequences", "name": "ipv4", "replace_placeholder": "[masked:ipv4]", "pattern": "\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b"}, {"type": "mask_sequences", "name": "account_ids", "replace_placeholder": "[masked:account]", "pattern": "\\b\\d{12}\\b"}, {"type": "mask_sequences", "name": "phones", "replace_placeholder": "[masked:phone]", "pattern": "\\+\\d[\\d \\-]{8,14}\\d|(?i:\\bphone\\w*[\\\"'']?\\s*[:=]\\s*[\\\"'']?\\+?[\\d \\-]{7,16}\\d)"}, {"type": "mask_sequences", "name": "tenant_ids", "replace_placeholder": "[masked:id]", "pattern": "(?i)\\b(?:tenant|org|organisation|organization|customer|account|user)[_\\-]?id\\b[\\\"'']?\\s*[:=]\\s*[\\\"'']?[A-Za-z0-9_\\-]{3,}"}, {"type": "mask_sequences", "name": "names", "replace_placeholder": "[masked:name]", "pattern": "(?i)\\b(?:full|first|last|given|family|middle|sur|display|customer|holder|cardholder|contact|recipient|patient|employee|person|user|login)[_\\- ]?name\\b[\\\"'']?\\s*[:=]\\s*[\\\"'']?[A-Za-z][A-Za-z.''\\-]*(?: [A-Za-z][A-Za-z.''\\-]*){0,3}"}, {"type": "mask_sequences", "name": "titled_names", "replace_placeholder": "[masked:name]", "pattern": "\\b(?:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Shri|Smt|Sri)\\.? [A-Z][a-z]+(?: [A-Z][a-z]+){0,2}|\\bDear [A-Z][a-z]+(?: [A-Z][a-z]+)?"}, {"type": "mask_sequences", "name": "addresses", "replace_placeholder": "[masked:address]", "pattern": "\\b\\d{1,5}[a-zA-Z]?,?(?: [A-Z][A-Za-z]+){1,4} (?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Way|Place|Pl|Terrace|Highway|Hwy|Marg|Nagar|Colony)\\b"}, {"type": "mask_sequences", "name": "internal_hosts", "replace_placeholder": "[masked:host]", "pattern": "(?i)\\b(?:[a-z0-9](?:[a-z0-9\\-]{0,61}[a-z0-9])?\\.){1,8}(?:corp|lan|intranet|intra|localdomain|home\\.arpa)\\b"}]'
  - name: DD_APM_REPLACE_TAGS
    value: '[{"name": "*", "pattern": "-----BEGIN [A-Z ]*PRIVATE KEY-----[\\s\\S]*?(?:-----END [A-Z ]*PRIVATE KEY-----|$)", "repl": "[masked:private-key]"}, {"name": "*", "pattern": "eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]*\\.[A-Za-z0-9_\\-]+", "repl": "[masked:token]"}, {"name": "*", "pattern": "\\b(?:sk-ant-|sk-|sk_live_|github_pat_|ghp_|gho_|ghs_|AKIA|ASIA|xox[baprs]-|glpat-|AIza|npm_|hf_)[A-Za-z0-9_\\-]{8,}", "repl": "[masked:key]"}, {"name": "*", "pattern": "://[^\\s:/@]+:[^\\s@/]+@", "repl": "://[masked]@"}, {"name": "*", "pattern": "(?i)\\b(?:bearer|basic)\\s+[A-Za-z0-9._~+/\\-]{8,}=*", "repl": "[masked:token]"}, {"name": "*", "pattern": "(?i)(?:password|passwd|pwd|secret|token|api[_\\-]?key|access[_\\-]?key|client[_\\-]?secret|session[_\\-]?id|cookie)[\\w.\\-]{0,20}[\\\"'']?\\s*[:=]\\s*[\\\"'']?[^\\s\\\"'',;&]+", "repl": "[masked:secret]"}, {"name": "*", "pattern": "[A-Za-z0-9._+\\-]+(?:@|%40)[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}", "repl": "[masked:email]"}, {"name": "*", "pattern": "\\b(?:\\d{4}[ \\-]){3}\\d{4}\\b", "repl": "[masked:card]"}, {"name": "*", "pattern": "\\b[2-9]\\d{3}[ \\-]\\d{4}[ \\-]\\d{4}\\b", "repl": "[masked:aadhaar]"}, {"name": "*", "pattern": "\\b\\d{3}-\\d{2}-\\d{4}\\b", "repl": "[masked:ssn]"}, {"name": "*", "pattern": "\\b[A-Z]{3}[ABCFGHJLPT][A-Z]\\d{4}[A-Z]\\b", "repl": "[masked:pan]"}, {"name": "*", "pattern": "\\b[A-Z]{2}\\d{2}[A-Za-z0-9]{11,30}\\b", "repl": "[masked:iban]"}, {"name": "*", "pattern": "\\b(?:[A-Fa-f0-9]{1,4}:){7}[A-Fa-f0-9]{1,4}\\b|\\b(?:[A-Fa-f0-9]{1,4}:){1,7}:(?:[A-Fa-f0-9]{1,4}(?::[A-Fa-f0-9]{1,4}){0,6})?", "repl": "[masked:ipv6]"}, {"name": "*", "pattern": "\\b(?:[0-9A-Fa-f]{2}[:\\-]){5}[0-9A-Fa-f]{2}\\b|\\b[0-9A-Fa-f]{4}\\.[0-9A-Fa-f]{4}\\.[0-9A-Fa-f]{4}\\b", "repl": "[masked:mac]"}, {"name": "*", "pattern": "\\b(?:ip|ec2)-\\d{1,3}(?:-\\d{1,3}){3}\\b|\\b\\d{1,3}(?:-\\d{1,3}){3}\\.[\\w-]+\\.pod\\b", "repl": "[masked:ipv4]"}, {"name": "*", "pattern": "\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b", "repl": "[masked:ipv4]"}, {"name": "*", "pattern": "\\b\\d{12}\\b", "repl": "[masked:account]"}, {"name": "*", "pattern": "\\+\\d[\\d \\-]{8,14}\\d|(?i:\\bphone\\w*[\\\"'']?\\s*[:=]\\s*[\\\"'']?\\+?[\\d \\-]{7,16}\\d)", "repl": "[masked:phone]"}, {"name": "*", "pattern": "(?i)\\b(?:tenant|org|organisation|organization|customer|account|user)[_\\-]?id\\b[\\\"'']?\\s*[:=]\\s*[\\\"'']?[A-Za-z0-9_\\-]{3,}", "repl": "[masked:id]"}, {"name": "*", "pattern": "(?i)\\b(?:full|first|last|given|family|middle|sur|display|customer|holder|cardholder|contact|recipient|patient|employee|person|user|login)[_\\- ]?name\\b[\\\"'']?\\s*[:=]\\s*[\\\"'']?[A-Za-z][A-Za-z.''\\-]*(?: [A-Za-z][A-Za-z.''\\-]*){0,3}", "repl": "[masked:name]"}, {"name": "*", "pattern": "\\b(?:Mr|Mrs|Ms|Miss|Mx|Dr|Prof|Shri|Smt|Sri)\\.? [A-Z][a-z]+(?: [A-Z][a-z]+){0,2}|\\bDear [A-Z][a-z]+(?: [A-Z][a-z]+)?", "repl": "[masked:name]"}, {"name": "*", "pattern": "\\b\\d{1,5}[a-zA-Z]?,?(?: [A-Z][A-Za-z]+){1,4} (?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Way|Place|Pl|Terrace|Highway|Hwy|Marg|Nagar|Colony)\\b", "repl": "[masked:address]"}, {"name": "*", "pattern": "(?i)\\b(?:[a-z0-9](?:[a-z0-9\\-]{0,61}[a-z0-9])?\\.){1,8}(?:corp|lan|intranet|intra|localdomain|home\\.arpa)\\b", "repl": "[masked:host]"}]'
