# SonarQube Cloud automatic analysis reads this file from the default branch (owner, 2026-10-21: the three analysis
# warnings on main). warden/tests/test_sonarcloud_properties.py keeps each value in step with the code it describes.

# Production code is everything in the repository except the test code below; the test code is analysed as tests, so
# the rules for tests run on it and the rules for production code do not. Helios (helios/, in this repository since
# 2026-10-21) brings its own test code and its fixtures: deliberately weak example infrastructure that its simulator
# and golden tests run against (its own .sonarcloud.properties excluded them; automatic analysis reads only this file).
sonar.sources=.
sonar.exclusions=warden/tests/**,warden/evals/**,warden/conftest.py,helios/helios-ai/tests/**,helios/scripts/test_action_gate.py,helios/scripts/test_action_pins.py,helios/scripts/test_fetch_z3.py,helios/scripts/test_publishable_guards.py,helios/scripts/test_readme_counts.py,helios/fixtures/**
sonar.tests=warden/tests,warden/evals,warden/conftest.py,helios/helios-ai/tests,helios/scripts/test_action_gate.py,helios/scripts/test_action_pins.py,helios/scripts/test_fetch_z3.py,helios/scripts/test_publishable_guards.py,helios/scripts/test_readme_counts.py

# The Python versions WARDEN runs on: warden/pyproject.toml requires 3.12 or later; CI and the runtime image use 3.13,
# the shop's app and Lambdas 3.12, and an install may take 3.14.
sonar.python.version=3.12, 3.13, 3.14

# The AWS provider's major version every stack locks (infra/terraform/*/.terraform.lock.hcl: 6.x). The old root stack
# (infra/terraform) still locks 5.100.0; one value covers the whole repository, so it is the one the deployed stacks use.
sonar.terraform.provider.aws.version=6
