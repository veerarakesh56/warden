# WARDEN per-environment policy
# ---------------------------------------------------------------------------
# WHICH environment may do WHAT, WHO is allowed to approve/apply it, and whether
# WARDEN may resolve an incident automatically (after approval) or must hand every
# fix to a human. This is DATA an operator edits — adding an environment, an
# allowlist entry or an authorised principal needs no code change.
#
# The environments (owner, 2026-10-16): dev and prod, each deployed only from the branch of its own name; main deploys
# nothing. They are listed in promotion order - main is promoted to dev, dev to prod (tests/test_ci_lanes.py holds each
# deploy workflow's `upstream` to this order).
#   - dev  : run as production (owner rule "dev is prod"), and the one environment faults are injected into
#            (fault_environments) - which is why its tier is nonprod. Its lists are explicit, never "*" (below).
#   - prod : never auto. Authorised responders only.
#
# What the code enforces with each key (read 2026-10-16):
#   - allow_actions / deny_actions: the verifier's policy P1 (verifier.py), on every path.
#   - authorized_principals and auto_remediate: read by no path since the CLI's dry-run gate (`warden run
#     --principal`, remediation.py) was removed (owner B27); kept so a policy file stays loadable. The one path
#     that changes anything, the Temporal RemediationWorkflow, reads neither: EVERY fix there needs a signed approval
#     of the exact plan, in every environment (audit 2026-09-28). auto_remediate never makes anything autonomous
#     (owner, 2026-10-16): only `autonomy` below does, and only through Eldane.
#   - autonomy (owner, 2026-10-16; autonomy.py): the highest level an action class may EARN here - L0 escalate only,
#     L1 shadow (WARDEN and Eldane, the AI critic, decide; a person still approves; the decision is scored), L2
#     autonomous (Eldane's signed approval is enough). A ceiling, not a level: a class starts at L1 and is promoted
#     only from its scored shadow record, demoted on any failed fix, rollback, model change or a missed catch trial.
#     The prod tier is never above L1 - refused at load, and capped in code: a person's passkey, always.
#   - require_human_approval: shown in the promotion report (reporting.py); nothing decides on it.
#
# An environment NOT listed here falls to `default`, which is deliberately the most
# restrictive: it can only do nothing or escalate, is never auto-remediable, and has
# no authorised principals. A typo'd or brand-new environment name therefore cannot
# inherit broad permissions by accident — it fails closed.
#
# G9-D (owner decision 2026-10-10): the reversible generic fix classes are allowed wherever a signed approval is
# required; a person approves every one of them.
# allow_actions / deny_actions values MUST be members of ActionKind (validated at
# load). `deny_actions` wins over `allow_actions`. no_action and escalate_to_human
# are ALWAYS permitted (the system must always be able to do nothing / hand off),
# so they need not be listed. "*" in allow_actions means "every ActionKind" (no shipped environment uses it).
#
# authorized_principals are opaque identity strings your caller supplies, by
# convention "<kind>:<name>" — e.g. role:oncall, svc:warden-dev, user:alice.
# "*" means any principal (no shipped environment uses it).
#
# credentials_ref is a POINTER to the IAM role that acts in this environment
# (warden-<env>-deploy, environments.names()). It is NEVER a secret; WARDEN never
# stores a credential. The promotion report tells a human which role to use.
# Every other per-environment name (prefix, SSM path, boundary, tags) is DERIVED from
# the environment name by environments.names(), so nothing here can drift from AWS.
# ---------------------------------------------------------------------------

version: 1

# The AWS region every environment runs in (owner requirement R17: Hyderabad). Code never names a region: it asks
# environments.region(), which honours AWS_REGION first, as every AWS tool does; Terraform and the IAM templates
# read this value too.
# Every time WARDEN shows - reports, Slack, the CLI - is stored in UTC and shown in UTC and in this IANA zone too
# (owner requirement R4). WARDEN_DISPLAY_ZONE overrides it per install.
display_zone: Asia/Kolkata
aws_region: ap-south-2
# AWS's own Region for its global services' alarms - CloudFront and Route 53 health checks publish their metrics,
# and so their alarms live, only there (G10-F1). AWS's fixed choice, named here once; WARDEN reads an alarm there
# only when the alarm's event came from there.
aws_global_region: us-east-1

# WARDEN's OWN environment: the runtime (runtime.yml in G6; names warden-ops-*, parameters under
# /warden/ops/, secrets in Secrets Manager under warden/ops/ - the W0-now Slack webhook is
# warden/ops/slack-webhook). NOT an application environment: no
# app pipeline deploys into it, no app IAM is rendered for it, and WARDEN never remediates it - it
# gets the restrictive default policy, so an alert about WARDEN itself can only be escalated to a
# person (P22 SELF-TARGET, planned). environments.names() and the account sweep's tag audit accept it.
runtime: ops

# Where faults may be injected - the benchmark harness and the undo lab. Only here does a fault-injection role exist
# (register R18, audit A-I-18); never an environment of the prod tier. Code and Terraform read this list; none names
# an environment of its own (owner, 2026-10-12: nothing in the repository is hardcoded).
fault_environments: [dev]

# This repository, as GitHub's OIDC token names it - what the deploy roles' trust policies accept: its name, and the
# immutable subject GitHub issues for it (owner@owner-id/repository@repository-id).
# runtime_branch (owner, 2026-10-16): the branch the runtime pipeline (runtime.yml, environment `ops`) runs from - an
# application environment's own branch, so the runtime runs code that has reached that environment: dev until prod
# exists. iam/ops/trust.json and runtime.yml's guards and signing identity name it (tests hold them equal).
github:
  repository: veerarakesh56/warden
  subject: veerarakesh56@171412850/warden@1341685493
  runtime_branch: dev

default:
  tier: unknown
  auto_remediate: false
  require_human_approval: true
  allow_actions: []          # only the always-on no_action / escalate_to_human
  deny_actions: []
  authorized_principals: []
  credentials_ref: null

environments:
# `approval_wait_hours` (default 72 - three days - and at most 168, a week) is how long a fix plan in that environment waits for its approval -
# and how long its approval link works. The target is read again before anything is applied, whatever the wait.
# `tripwire: off | on | required` (default off) sets the injection detector per environment; the stricter of it and
# WARDEN_TRIPWIRE applies. The runtime image carries Prompt Guard 2 (the pinned weights, checked at build:
# scripts/bake_tripwire.py; register R47, 2026-10-14), so every environment scans (`on`): a flagged text escalates.
# `required` also escalates an incident the detector could not scan; prod takes it once the MCP
# check and the replay tools run the scan instead of reusing a recorded result (they escalate everything until then).

  dev:
    tier: nonprod                # faults are injected here, and fault_environments refuses the prod tier
    # Owner rule "dev is prod" (2026-10-16; audit finding: dev allowed every action, to anyone, with no person in the
    # loop). The CLI path never applies here (auto_remediate), and its principal check accepts prod's responders only.
    # A live fix, as in every environment, waits for a signed approval of its exact plan by an approver on the list -
    # in dev that includes the labelled bench approver, for T1/T2 (owner, 2026-10-15).
    auto_remediate: false
    require_human_approval: true
    # Exactly the action classes that a catalogue entry carries out (catalog.FOR_ACTION), that prod allows, and that
    # WARDEN's own table classes reversible (models.ACTION_FACTS) - tests/test_environments.py derives the list from
    # those three and holds it equal. P2 keeps irreversible actions out of the prod tier only, so dev names the four
    # irreversible classes in deny_actions itself: no later edit of allow_actions can let one in. clear_cache is
    # reversible and prod allows it, but no catalogue entry carries it out (advice only). No dev-only class exists.
    allow_actions: [restart_pods, scale_up, rollback_deploy, terminate_connections, revert_config, pause_flow,
                    resume_flow, shift_traffic, raise_limit, freeze_changes, revert_change]
    deny_actions: [scale_down, failover_replica, redrive_messages, cancel_query]
    authorized_principals: [role:oncall, role:sre-lead, role:incident-commander]   # prod's
    credentials_ref: warden-dev-deploy
    tripwire: "on"
    autonomy: L2                 # earned per action class, through Eldane (owner, 2026-10-16); L1 until earned

  prod:
    tier: prod
    auto_remediate: false        # NEVER auto in production
    require_human_approval: true
    allow_actions: [restart_pods, scale_up, rollback_deploy, failover_replica, clear_cache, terminate_connections,
                    revert_config, pause_flow, resume_flow, shift_traffic, redrive_messages, cancel_query, raise_limit, freeze_changes,
                    revert_change]
    deny_actions: [scale_down]   # scaling prod down is a capacity decision a human owns
    authorized_principals: [role:oncall, role:sre-lead, role:incident-commander]
    credentials_ref: warden-prod-deploy
    tripwire: "on"
    autonomy: L1                 # shadow at most: Eldane advises and is scored; a person's passkey approves
