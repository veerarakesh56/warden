  # The narrowing change (G10-57, 2026-10-14): each other cause the model rules out comes with why and its citations,
  # checked like the hypothesis's, and the report's "How WARDEN narrowed it down" lays them out. Measured on the
  # local SDK (1.4.0, which scored 2 below 1.11.0 the last time both ran), $0.59: 22/30 (19 before), every incident
  # answered, 0 wrong-and-allowed, 22 escalated (the SLO's limit is 25), 0 acted wrongly.
  # REMOVED 2026-10-15 (retired): {"provider": "anthropic", "model": "claude-sonnet-5", "version": "anthropic 1.4.0", "measured": "2026-10-14T10:58Z", "prompt": "d435b59f7f1545c23af17b23125de453170a2180c8ab0f7ce7050e3891ba0084", "budget_usd": 5.0, "spent_usd": 0.591, "correct": 22, "runs": 30, "wrong_and_allowed": 0, "no_evidence_fixes_allowed": 1, "errors": 0, "unanswered": 0, "escalated": 22, "acted_right": 7, "escalated_a_right_fix": 9, "abstained_right": 6, "stopped_a_wrong_answer": 6, "acted_wrongly": 0, "ungraded": 2}
  # Claude Sonnet 5 on the Claude API, with the G9-D action vocabulary and each action's meaning in the schema
  # (2026-10-10, $0.75 with three unanswered incidents re-run): 19/30, every incident answered, 0 wrong-and-allowed.
  # The first measurement of the vocabulary (no meanings, $0.50) was NOT qualified: raise_limit for an OOM after a
  # config change lowered a memory limit, allowed - fixed by the meanings, the gate's OOM rule and P15's keys. Two
