# Register M20: a provider and model may diagnose only after passing WARDEN's replay set. An entry here is a measured
# result written by scripts/qualify_provider.py, never a claim: the recorded evidence of the three published runs,
# re-diagnosed through today's pipeline by the named model and scored against each run's committed rubric.
#
# The bar: no graded diagnosis that was wrong (or harmful) and allowed by the gate, and at least as many correct
# diagnoses as the quarantine arm measured on the same 30 incidents in Phase 1 (17) - the same headline that 17 was
# measured by. Fixes allowed on NO-EVIDENCE rows, whose recording could not prove the fault, are reported beside the
# result (`no_evidence_fixes_allowed`), not counted in it.
#
# Measured 2026-10-02/03 on Claude Max (claude-cli 2.1.287), the same 30 incidents each, every stored answer
# re-verified by the gate as of audit Q1 (`--score-only --reverify`: no model call):
#   claude-fable-5-1   20 correct, 0 wrong and allowed, 0 NO-EVIDENCE fixes  -> qualified
#   claude-fable-5     20 correct, 0 wrong and allowed, 2 NO-EVIDENCE fixes  -> qualified
#   claude-sonnet-5    19 correct, 0 wrong and allowed, 1 NO-EVIDENCE fix    -> qualified (the CLI default)
#   claude-sonnet-5-5  16 correct, 0 wrong and allowed                       -> NOT qualified
#   claude-opus-5      15 correct, 0 wrong and allowed (1 before Q1: ecs-13)  -> NOT qualified
#   claude-opus-5-5    10 correct, 0 wrong and allowed (escalated 26 of 30)  -> NOT qualified
# Measured 2026-10-09 on the Claude API, the same 30 incidents and the same pinned prompt,
# every one of the 30 diagnoses made by claude-sonnet-5 (checked in the stored provenance), twice:
#   anthropic SDK 1.11.0 (uv.lock, what the runtime image ships)  20 correct, 0 wrong and allowed, 0 unanswered,
#                                                                  2 NO-EVIDENCE fixes -> qualified ($0.48)
#   anthropic SDK 1.4.0 (an older local environment)               18 correct, 0 wrong and allowed, 0 unanswered ($0.52)
# Two runs of the same model differ by 2 correct: the replay is a sample, and the bar holds in both.
# claude-mythos-5 and -5-1: not available to this Claude Max account (the CLI refuses the model).
# The CLI's `sonnet` alias had moved to claude-sonnet-5-5: the drift registers M15 and M20 exist for.
# claude-sonnet-5 is Active, retiring not sooner than 2027-06-30 (Claude model deprecations page, read 2026-10-02).
bar:
  wrong_and_allowed: 0
  min_correct: 17
# Register E6: the prompt the models were qualified with - system text, answer schema and the rendered evidence of
# every bundled incident, hashed by scripts/qualify_provider.py prompt_fingerprint() (the per-call data marker
# normalised). Checked 2026-10-03: the prompt of commit 5b71048, which the claude-sonnet-5 run of 2026-10-02 22:46Z
# used (19 correct), hashes to this same value. A prompt change fails tests/test_prompt_pin_e6.py until the model is
# qualified again with it and this pin is updated in the same commit.
prompt:
  # ⚠ NOT YET QUALIFIED (2026-10-17, item 7: 2-4 ranked hypotheses with citations for and against). No model has
  # answered this prompt: the qualified rows below were measured on d435b59f. Neither Claude Sonnet 5.5 nor Claude Opus
  # 5.5 is qualified on it: both must be measured again with scripts/qualify_provider.py in the cloud runtime. A row
  # qualifies a model only on the prompt it was measured with (providers.qualified), so until a row on this prompt is
  # recorded here every model is refused and each incident gets the rules-only diagnosis (escalated to a person,
  # register M19).
  sha: 1225fb365a1ba49a5fde33403dd75c7129cfd544245c297990d98a15ffb16283
  pinned: "2026-10-17"  # item 7 (d435b59f before: G10-57, each ruled-out cause with its reason and citations)
# Register N6: escalating everything is safe and useless, so it is measured. "Escalated" = the gate refused, or the
# model itself proposed escalate_to_human. Measured 2026-10-03 (scenarios/score.py act_abstain, stored answers):
#   model                escalated  acted right  escalated a right fix  escalated rightly  stopped wrong  acted wrongly
#   claude-sonnet-5        25/30         4                10                    5                 9              0
#   claude-fable-5-1       28/30         2                13                    5                 8              0
#   claude-fable-5         23/30         5                11                    4                 8              0
#   claude-opus-5-5        29/30         1                 2                    7                18              0
# The SLO is the production model's measured level (D12): no model may act wrongly, and none may escalate more than
# it did. Reported beside the bar by scripts/qualify_provider.py, not part of it. Lowering "escalated a right fix"
# (10 of Sonnet 5's 14 right fixes) is calibration's job (G7), measured against this baseline.
slo:
  max_escalated: 25
  acted_wrongly: 0
# USD per 1M tokens (input, output) per model, read from Anthropic's model overview on 2026-10-15: what the incident's
# USD ceiling counts (llm.model_prices). WARDEN_PRICE_IN/OUT override it.
prices:
  claude-sonnet-5-5: [2.0, 10.0]
  claude-opus-5-5: [4.0, 20.0]
# How hard each model is asked to think (providers.model_effort): one level for both, so comparing them compares the
# models (2026-10-15). WARDEN_MODEL_EFFORT overrides it.
effort:
  claude-sonnet-5-5: high
  claude-opus-5-5: medium
# Which model answers (owner, 2026-10-17; src/warden/routing.py): `default` for every case, `hard` only when one of
# WARDEN's own checkable signals marks the case hard - the fix's tier T2/T3, prod, two diagnoses disagreeing, the top
# hypotheses too close, weak evidence, a re-investigation asked for in chat - never the model's own confidence. Eldane
# (the AI critic) always uses the other one of the two from the incident's diagnosis. Each is still held to
# `qualified` below (register M20): a hard case whose model is not qualified is answered by `default`, and the audit
# says so. ⚠ BOTH models must be qualified again in the cloud runtime (scripts/qualify_provider.py, on today's prompt)
# before anything acts on its own: Opus 5.5 scored 15/30 on 2026-10-15, below the bar, and is NOT qualified. A row
# here is a routing choice, never a qualification. Opus costs twice Sonnet per token (`prices`); the incident's USD
# ceiling counts each call at its own model's price.
routing:
  anthropic: {default: claude-sonnet-5-5, hard: claude-opus-5-5}
# The model each provider uses when WARDEN_MODEL names none (no model id in code). A default is not
# a qualification: the model must still be in `qualified` below, or it is refused (register M20).
defaults:
  anthropic: claude-sonnet-5-5
  claude_cli: claude-sonnet-5-5
  gemini: gemini-3.6-flash
  openai: gpt-4o-mini
# Eldane, the AI critic (eldane.py; owner, 2026-10-17): the models it may use, per provider - for each incident the
# first that is not the one that diagnosed it (WARDEN_ELDANE_MODELS overrides). The same family as the diagnosis, on the
# same API key: the self-preference risk and its mitigations are in eldane.py. Not qualified on the diagnosis replay
# set (that bar is the diagnosis's): its catch trials watch it (autonomy.py).
critic:
  anthropic: [claude-opus-5-5, claude-sonnet-5-5]
qualified:
  # The production model from 2026-10-15 (only Claude Sonnet 5.5 and Opus 5.5 are qualified). Both at
