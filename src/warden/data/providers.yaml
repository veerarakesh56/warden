  # 8 acted right (7 before).
  # G10-A (the alert's time in the prompt, when each fact group was logged, counts/ratios/scale-downs/exit codes/JSON
  # fields kept as facts; $0.56): 18/30, every incident answered, 0 wrong-and-allowed - within chance of 19 (two runs
  # of one prompt differ by 2). P4 fired more often (escalated 23, was 20): the model reported lower confidence with
  # the same diagnoses. The 30 recordings predate the reader fixes, so they cannot show those. On the 48 held-out
  # cases (docs/bench/heldout-g9-2026-10-10) the same prompt scored 35/48 (was 34), cited the cause 41 (39), novel
