  # 15/30 - below it (NOT qualified). On the 172 held-out G10 cases, re-scored under today's gate (no model call):
  # Sonnet 5.5 correct 160, harmful proposals 6 (every one stopped), right fix to a person 77, right outcome 137, harm
  # allowed 0, $3.15; Opus 5.5 correct 162, harmful 1, right fix 72, right outcome 136, harm allowed 0, $9.00.
