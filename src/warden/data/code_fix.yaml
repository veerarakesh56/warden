# The code gate's limits (code_gate.py, register B4): what a change WARDEN writes as a pull request may touch, and how
# big it may be. The gate's refusals (CODEOWNERS, workflows and CI configuration, IAM, secrets, dependency manifests,
# WARDEN's own code and this file) are code, not data: no edit here can let one in. Whether an environment gets code
# fixes at all is `code_fix: off | propose | auto` in environments.yaml (the prod tier never `auto`).
version: 1

# Lines added plus lines removed, over the whole change. A revert restores code that ran before, so it may be larger
# than a new fix; each at most 400 (validated at load).
max_changed_lines: 60
max_revert_lines: 200
# Files the change touches, test files included (at most 20).
max_files: 6

# The only paths a change may touch: the watched applications' code and their own tests (`*` stays inside one
# folder; `**/` crosses folders). Everything else - a path no glob names - is refused.
allowed_paths:
  - scenarios/fullstack/app/*.py
  - scenarios/fullstack/lambdas/**/*.py
  - scenarios/fullstack/tests/test_*.py

# Which allowed paths are tests. A fix must add one (rule CG8); a fix may not remove an assertion or a test from one.
# The applications' own tests, never WARDEN's (`tests/` is refused whatever this file says: a fix could otherwise
# weaken the tests that hold WARDEN's own rules).
test_paths:
  - scenarios/fullstack/tests/test_*.py

# Auto-merge (phase 4; only where `code_fix: auto`, never the prod tier): every check run on the pull request's head
# must have finished green, these ones must be there, CodeRabbit must have reviewed the head and left nothing open,
# and Eldane, the AI critic, must have approved it. autofix-regression and SonarCloud are required whatever this says.
auto_merge:
  required_checks:
    - autofix-regression
    - SonarCloud Code Analysis
    - check / validate
    - Analyze (python)
