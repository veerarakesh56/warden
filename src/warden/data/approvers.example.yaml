# Who may approve what (approvals.py). Copy to a private path and point WARDEN_APPROVERS at it.
# Create your key pair once:  warden audit keygen --private ~/.warden/owner.pem --public ~/.warden/owner.pub
# (set WARDEN_AUDIT_KEY_PASSPHRASE first so the private key is encrypted), then paste the PUBLIC key
# below. The private key never goes into this file, the repository, or the worker.
approvers:
  owner:
    tiers: [T1, T2, T3]
    public_key: |
      <paste the contents of owner.pub here>
# Approvals needed per tier from DIFFERENT approvers (a team would set T3: 2).
required: {T1: 1, T2: 1, T3: 1}
# A T3 plan (and a kill-switch reset) can only be approved this long after it was made.
cooling_off_minutes: {T3: 10}
