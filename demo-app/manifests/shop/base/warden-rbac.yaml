# WARDEN's Kubernetes identity for Wave 4: ServiceAccount `warden` in shop, bound by a namespaced
# RoleBinding to the six-read ClusterRole `warden-readonly` defined in infra/k8s/rbac.yaml (applied by the
# deploy tool from that file). No ClusterRoleBinding: the reads reach this namespace only.
# The harness mints a short-lived token (`kubectl create token warden -n shop`) for a token-only
# kubeconfig; nothing mounts one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warden
  namespace: shop
  labels:
    project: warden
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden-readonly
  namespace: shop
  labels:
    project: warden
subjects:
  - kind: ServiceAccount
    name: warden
    namespace: shop
roleRef:
  kind: ClusterRole
  name: warden-readonly
  apiGroup: rbac.authorization.k8s.io
---
# WARDEN's one write path on EKS: its actor role, for one approved plan, signs in through its access entry as group
# warden-remediators (infra/terraform/fullstack/eks.tf). Bound here, in shop only, to the remediator ClusterRole (get and
# patch Deployments, list HPAs) that the deploy tool applies from infra/k8s/remediation-rbac.yaml with its admission policy,
# which holds every patch to a restart or a bounded scale.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden-remediator
  namespace: shop
  labels:
    project: warden
subjects:
  - kind: Group
    name: warden-remediators
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: warden-remediator
  apiGroup: rbac.authorization.k8s.io
