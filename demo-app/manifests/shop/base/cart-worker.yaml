apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-worker
  namespace: shop
  labels:
    app: cart-worker
    project: warden
    # Datadog's standard labels: its agent tags this workload's container logs and Kubernetes metrics env and service
    # from them (the monitors filter on both, warden/scripts/datadog_setup.py).
    tags.datadoghq.com/service: cart-worker
spec:
  replicas: 2  # like production (owner, 2026-10-15); was 1
  selector:
    matchLabels:
      app: cart-worker
  # Recreate: a pod that cannot be scheduled (fs-25) leaves no old pod running to hide it.
  strategy:
    type: Recreate
  template:
    metadata:
      # ⛔ The amazon-cloudwatch-observability add-on auto-injects an OpenTelemetry agent into pods
      # behind a Service (Application Signals). Its container violates the namespace's `restricted`
      # Pod Security, so EVERY catalog-api pod was refused on the first real deploy (2026-09-26) - and
      # it injected the Java agent into a Python app. Opt out explicitly; metrics still come from the
      # add-on's node agent, which is what the alarms read.
      annotations:
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
      labels:
        app: cart-worker
        project: warden
        tags.datadoghq.com/service: cart-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # The commit's image by digest, set by the shop Application: its kustomize image override replaces this
          # name and tag with <repository>@sha256:<digest>, so this tag is never pulled.
          image: shop-app:set-by-argocd
          ports:
            - name: https
              containerPort: 8080
          env:
            - name: APP_ROLE
              value: cart-worker
            - name: OTEL_SERVICE_NAME
              value: cart-worker
          envFrom:
            - configMapRef:
                name: catalog-config
            - configMapRef:
                name: shop-infra
            - configMapRef:
                name: otel-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
              scheme: HTTPS  # the app's own certificate; the kubelet does not verify a probe's certificate
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
