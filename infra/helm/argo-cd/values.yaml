# Argo CD for the dev cluster: chart argo-cd 10.10.5 = Argo CD v3.5.5 (owner item B26, 2026-10-17). Chart published
# 2026-10-15, tag commit 3d4228871ef2f98cbcd22d9f54f8265213cf0870; package sha256
# ba6447eeed42bc41d1f0527721047b236304e97669a7b6286d02be4a1644ba7a, checked before install. Argo CD v3.5.5 (2026-10-12,
# tag a5038b0e2bbac1715754380ae0084df8e3d5b48c) lists bug fixes and dependency updates, no advisory; v3.5.4 (chart
# 10.9.7) stays the floor: it fixed the four Critical advisories of 2026-10-07 (repo-server command execution through
# Kustomize/Jsonnet, AppProject limits bypassed by PreDelete/PostDelete hooks). From 10.9.7 the chart changed (read
# from both packages, 2026-10-20): server.enabled (default true, for an Argo CD Core install), PodDisruptionBudgets keep
# a maxUnavailable of 0, dex v2.46.0 (disabled here), redis_exporter v1.94.0 (metrics off here); the CRDs are
# byte-identical. Under two weeks old when pinned: the owner chose this release (B26).
# Installed by the apps pipeline (scripts/deploy_fullstack_apps.py deploy_argocd), the way the Datadog agent is. Every
# key below is read from that chart's own values.yaml, 10.10.5 (checked again 2026-10-20).
#
# Nobody logs in to it: the Applications are Kubernetes objects the pipeline applies, and WARDEN acts on the workloads
# through the Kubernetes API with its own restricted service account (k8s/remediation-rbac.yaml) - restarts and the
# replicas an HPA owns, which the shop Application tells Argo CD to ignore. Anything else is a pull request to
# manifests/, which Argo CD syncs.

# Kept when the chart is removed: the lab's teardown deletes the Applications first (their resources finalizer cleans
# the shop objects up while the controller still runs), then the chart, then these CRDs.
crds:
  keep: true

# No SSO and no local login: there is no one to sign in.
dex:
  enabled: false
# Notifications go through WARDEN's own channels, not Argo CD's.
notifications:
  enabled: false

configs:
  cm:
    admin.enabled: false
    exec.enabled: false
    statusbadge.enabled: false
  rbac:
    # Deny by default: no account and no group may do anything through Argo CD's API.
    policy.default: ""

# Small, explicit requests on the lab's two 2-vCPU nodes (non-HA: one of each).
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
server:
  # Inside the cluster only: no load balancer, no ingress. A person who wants the UI port-forwards with their own access.
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
applicationSet:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 192Mi}
redis:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 128Mi}
