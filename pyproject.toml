[project]
name = "warden"
version = "0.5.1"
description = "AI incident-response orchestrator: the model proposes, a deterministic verifier decides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Veera Rakesh Kethari" }]
# Core deps carry NO vendor SDK. Which model answers is a deployment decision, so the provider
# packages are extras - install only the one you use. providers.py imports them lazily inside each
# class, so a missing SDK is a readable error from the provider you asked for, not an ImportError
# at startup for one you never wanted.
dependencies = [
    "langgraph>=1.0",
    "pydantic>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # Config parser, NOT a model SDK — the "no vendor SDK in core" rule above is about which model
    # answers, a deployment choice. The incident knowledge base and the per-environment policy are
    # human-edited YAML on purpose (operators add signatures / allowlist entries without touching
    # Python), so a YAML parser is a legitimate core dependency.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
anthropic = ["anthropic>=1.0"]
gemini = ["google-genai>=1.0"]          # free tier: aistudio.google.com
openai = ["openai>=1.0"]                # also Groq / OpenRouter / Ollama via WARDEN_BASE_URL
mcp = ["mcp>=2.0"]                      # expose the policy gate to any MCP client
k8s = ["kubernetes>=30"]                # read a live cluster: WARDEN_BACKEND=k8s
# Database backends (read health + terminate stuck connections): WARDEN_BACKEND=postgres|mysql|redis|mongo|mssql
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
redis = ["redis>=5.0"]
mongo = ["pymongo>=4.6"]
mssql = ["pymssql>=2.2"]
databases = ["psycopg[binary]>=3.1", "pymysql>=1.1", "redis>=5.0", "pymongo>=4.6", "pymssql>=2.2"]
all-providers = ["anthropic>=1.0", "google-genai>=1.0", "openai>=1.0"]

[project.scripts]
warden = "warden.cli:main"
warden-mcp = "warden.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The recorded incidents must travel with the package. Without this they are absent from an
# installed wheel and every context tool fails at runtime while the process still exits 0.
[tool.setuptools.package-data]
warden = ["fixtures/*.json", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
# C408: `dict(a=1)` over `{"a": 1}`. Kept deliberately — the demo fixtures and test helpers use the
# `base = dict(...); base.update(kw)` override pattern, which is unreadable with brace literals.
ignore = ["C408"]
