[project]
name = "warden"
version = "0.10.0"
description = "AI incident-response orchestrator: the model proposes, a deterministic verifier decides."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Veera Rakesh Kethari" }]
# Core deps carry NO vendor SDK. Which model answers is a deployment decision, so the provider
# packages are extras - install only the one you use. providers.py imports them lazily inside each
# class, so a missing SDK is a readable error from the provider you asked for, not an ImportError
# at startup for one you never wanted.
dependencies = [
    "pydantic>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # Config parser, NOT a model SDK — the "no vendor SDK in core" rule above is about which model
    # answers, a deployment choice. The incident knowledge base and the per-environment policy are
    # human-edited YAML on purpose (operators add signatures / allowlist entries without touching
    # Python), so a YAML parser is a legitimate core dependency.
    "pyyaml>=6.0",
    # Ed25519 signatures for the audit log's checkpoints (and, next, for approvals).
    "cryptography>=43",
    # Durable workflows: approvals as signals, timers, retries, replay (self-hosted OSS, MIT; never
    # Temporal Cloud). Tests use its time-skipping test server.
    "temporalio>=1.33,<2",
    # The outbound gate finds code regions the way CommonMark does (MIT, pure Python). A line-by-line
    # tracker could not follow fences inside lists and quotes (third review, 2026-09-30).
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.8", "ruff>=0.6"]
anthropic = ["anthropic>=1.0"]
gemini = ["google-genai>=1.0"]          # free tier: aistudio.google.com
openai = ["openai>=1.0"]                # also Groq / OpenRouter / Ollama via WARDEN_BASE_URL
mcp = ["mcp>=2.0"]                      # expose the policy gate to any MCP client
k8s = ["kubernetes>=30"]                # read a live cluster: WARDEN_BACKEND=k8s
aws = ["boto3>=1.34"]                   # read a live AWS account (CloudWatch + ECS): WARDEN_BACKEND=aws
# Database backends (read health + terminate stuck connections): WARDEN_BACKEND=postgres|mysql|redis|mongo|mssql
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
redis = ["redis>=5.0"]
mongo = ["pymongo>=4.6"]
mssql = ["pymssql>=2.2"]
databases = ["psycopg[binary]>=3.1", "pymysql>=1.1", "redis>=5.0", "pymongo>=4.6", "pymssql>=2.2"]
# Ship spans over OTLP/HTTP (OTEL_EXPORTER_OTLP_ENDPOINT). Without it WARDEN falls back to the console.
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.20"]
all-providers = ["anthropic>=1.0", "google-genai>=1.0", "openai>=1.0"]
# The injection tripwire (WARDEN_TRIPWIRE, policy P16). Install torch from the CPU index to keep it
# small: pip install torch --index-url https://download.pytorch.org/whl/cpu
guard = ["transformers>=4.50", "torch>=2.4", "huggingface_hub>=0.30"]

# CI-only tools and the apps pipeline's helpers. Locked with everything else in uv.lock - every
# version AND its hash (audit A-I-9: unpinned installs ran while a job held cloud credentials) - and
# never installed with the package.
[dependency-groups]
scan = ["pip-audit==2.10.1", "bandit==1.9.4", "zizmor==1.30.1"]
# pip too: scripts/deploy_fullstack_apps.py builds the Lambda zips with `pip install --platform`, and a uv
# environment has none (CI · apps failed on 83f65e6 without it).
apps-check = ["ruff>=0.6", "pytest>=8.0", "pyyaml>=6.0", "psycopg[binary]>=3.1", "redis>=5.0", "boto3>=1.34",
              "packaging>=24", "pip>=24"]
apps-deploy = ["pyyaml>=6.0", "psycopg[binary]>=3.1", "boto3>=1.34", "packaging>=24", "pip>=24"]
infra-deploy = ["boto3>=1.34"]   # terraform/fullstack/aurora_express.py: stdlib + boto3 only

[tool.uv.build-backend]
# uv_build packs everything under src/warden; a local .env or log file must never ship (fifth review E,
# 2026-10-01: a planted src/warden/.env reached the wheel).
# Secret-bearing files that .gitignore keeps out of git, kept out of the sdist and wheel too (sixth review).
source-exclude = [
    "**/.env",
    "**/.env.*",
    "**/*.log",
    "**/*.log.*",
    "**/*.pem",
    "**/*.key",
    "**/*.p12",
    "**/*.pfx",
    "**/*.jks",
    "**/*.tfstate",
    "**/*.tfstate.*",
    "**/*.tfvars",
    "**/tfplan*",
    "**/*.tfplan*",
    "**/*.db",
    "**/*.sqlite*",
    "**/*credentials*",
    "**/id_rsa*",
    "**/id_ed25519*",
    "**/plan.out",
    "**/*.local.json",
    "**/*.tfvars.json",
    "**/*.auto.tfvars*",
    "**/.envrc",
    "**/.env?",
    "**/.netrc",
    "**/.pypirc",
    "**/.npmrc",
    "**/kubeconfig*",
    "**/*.kubeconfig",
    "**/*.bak",
    "**/*-wal",
    "**/*-journal",
    "**/*-shm",
    "**/id_ecdsa*",
    "**/id_dsa*",
    "**/*.ppk",
    "**/service-account*.json",
    "**/*.keystore",
    "**/*.kdbx",
]
wheel-exclude = [
    "**/.env",
    "**/.env.*",
    "**/*.log",
    "**/*.log.*",
    "**/*.pem",
    "**/*.key",
    "**/*.p12",
    "**/*.pfx",
    "**/*.jks",
    "**/*.tfstate",
    "**/*.tfstate.*",
    "**/*.tfvars",
    "**/tfplan*",
    "**/*.tfplan*",
    "**/*.db",
    "**/*.sqlite*",
    "**/*credentials*",
    "**/id_rsa*",
    "**/id_ed25519*",
    "**/plan.out",
    "**/*.local.json",
    "**/*.tfvars.json",
    "**/*.auto.tfvars*",
    "**/.envrc",
    "**/.env?",
    "**/.netrc",
    "**/.pypirc",
    "**/.npmrc",
    "**/kubeconfig*",
    "**/*.kubeconfig",
    "**/*.bak",
    "**/*-wal",
    "**/*-journal",
    "**/*-shm",
    "**/id_ecdsa*",
    "**/id_dsa*",
    "**/*.ppk",
    "**/service-account*.json",
    "**/*.keystore",
    "**/*.kdbx",
]

[tool.uv]
# A range, not one version: Dependabot runs its own uv (0.12.18 on 2026-10-01) and refused "==0.12.21",
# so no uv.lock update ran. CI pins the exact uv in setup-uv (0.12.21, released 2026-09-29), and
# tests/test_supply_chain.py checks that pin lies in this range. CI installs only what
# `uv sync --locked` reads from uv.lock, hashes verified.
required-version = ">=0.12.18,<0.13"
default-groups = []

[project.scripts]
warden = "warden.cli:main"
warden-mcp = "warden.mcp_server:main"

# uv's own build backend: uv builds with the copy bundled in its executable, so a locked install
# downloads no unpinned build tool (with setuptools, `uv sync` fetched it outside uv.lock's hashes).
# It packs everything under src/warden - the recorded incidents (fixtures/*.json) and data/*.yaml
# included; without them every context tool fails at runtime while the process still exits 0.
[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
# "." is load-bearing and was learned the hard way: `python -m pytest` puts the working
# directory on sys.path, bare `pytest` does not. CI runs the bare form, so tests importing the
# `scenarios` harness collected fine locally and failed in CI with ModuleNotFoundError.
# Verifying with a command shape CI does not use is not verifying.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals", "scenarios"]

[tool.ruff.lint]
# C408: `dict(a=1)` over `{"a": 1}`. Kept deliberately — the demo fixtures and test helpers use the
# `base = dict(...); base.update(kw)` override pattern, which is unreadable with brace literals.
ignore = ["C408"]
