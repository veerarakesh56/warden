name: ci

on:
  push:
    branches: [main]
  pull_request:

# Mock mode everywhere: CI must never need a key, and the eval gate must be deterministic.
env:
  AEGIS_MOCK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all-providers,mcp,k8s]"

      # The core package must import with NO vendor SDK present. providers.py imports them lazily,
      # and this proves it - otherwise a missing extra becomes an ImportError at startup for a
      # provider the user never asked for.
      - name: Core imports without any provider SDK
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install -q -e .
          /tmp/bare/bin/python -c "import aegis; from aegis.llm import LLMClient; LLMClient(mock=True); print('core imports clean')"

      - name: Lint
        run: ruff check src tests evals

      - name: Unit tests
        run: pytest tests -q

      - name: Eval gate
        run: pytest evals -q

      # ⛔ This used to be `run: aegis demo` and nothing more. That asserts the process exited 0 -
      # not that it produced correct answers. A packaging bug once made every incident return
      # AUTO_SAFE inside the container and this step stayed green. Assert the OUTPUT.
      - name: Demo must produce the expected verdicts
        run: |
          out=$(aegis demo)
          echo "$out"
          echo "$out" | grep -q "APPROVED_FOR_HUMAN" || { echo "::error::no APPROVED_FOR_HUMAN verdict"; exit 1; }
          echo "$out" | grep -q "ESCALATED"          || { echo "::error::no ESCALATED verdict"; exit 1; }
          echo "$out" | grep -q "P6-BLAST-RADIUS"    || { echo "::error::P6 did not fire on inc-003"; exit 1; }
          test "$(echo "$out" | grep -c 'AUTO_SAFE')" -eq 1 || { echo "::error::expected exactly one AUTO_SAFE - fixtures probably missing"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same rule as above: the container must produce CORRECT output, not merely exit 0. This is
      # the job that missed a packaging bug where the installed wheel shipped no fixtures, so every
      # tool failed, context came back empty and all four incidents returned AUTO_SAFE.
      - name: Build the container and assert its output
        run: |
          docker build -t aegis:ci .
          out=$(docker run --rm -e AEGIS_MOCK=1 -e AEGIS_TRACE=0 aegis:ci demo)
          echo "$out"
          echo "$out" | grep -q "APPROVED_FOR_HUMAN" || { echo "::error::container produced no APPROVED_FOR_HUMAN"; exit 1; }
          echo "$out" | grep -q "ESCALATED"          || { echo "::error::container produced no ESCALATED"; exit 1; }
          test "$(echo "$out" | grep -c 'AUTO_SAFE')" -eq 1 || { echo "::error::container: expected exactly one AUTO_SAFE - fixtures missing from the wheel?"; exit 1; }

  # Against a REAL cluster. Every step here was first done by hand and read by eye; this job
  # replays it so it cannot regress. Assertions are on OUTPUT and on the API server's own answers,
  # never on exit codes alone. An adversarial review of the first version of this job found five
  # ways it could go green while a README claim was false; each has a named assertion below.
  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install k3d
        run: |
          set -o pipefail
          curl -fsS https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Create cluster
        run: |
          k3d cluster create aegis-ci --no-lb --wait --timeout 300s
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Validate manifests against the live API server - including the documented entry point
        run: |
          kubectl apply -f k8s/namespace.yaml
          # The command the README tells users to run. A broken kustomization.yaml used to ship green.
          kubectl kustomize k8s/ | kubectl apply --dry-run=server -f -
          kubectl apply --dry-run=server -f k8s/job.yaml -f k8s/test/oom-workload.yaml -f k8s/test/posture-probe.yaml
          kubectl apply -k k8s/
          # Idempotent: the second apply must change nothing.
          kubectl apply -k k8s/ | tee /dev/stderr | grep -vq -E 'configured|created' || { echo "::error::second apply -k was not a no-op"; exit 1; }

      - name: Pod Security must REJECT a privileged pod in the aegis namespace
        run: |
          # A positive test (the Job is admitted) cannot tell 'restricted is enforced' from 'the
          # label is mistyped'. This can.
          if kubectl apply --dry-run=server -f k8s/test/privileged-must-fail.yaml 2>err.txt; then
            echo "::error::a privileged pod was ACCEPTED - Pod Security is not enforced"; exit 1
          fi
          grep -qi "forbidden\|violates PodSecurity" err.txt || { echo "::error::rejected for the wrong reason:"; cat err.txt; exit 1; }
          echo "rejected as expected:"; cat err.txt

      # RBAC from the API server's point of view, BOTH directions, MINIMAL not just read-only.
      - name: RBAC must allow exactly the five reads the code makes
        run: |
          SA=system:serviceaccount:aegis:aegis
          allow() { r=$(kubectl auth can-i "$@" --as=$SA 2>/dev/null || true); echo "$* -> $r"; [ "$r" = "yes" ] || { echo "::error::$* should be allowed"; exit 1; }; }
          allow list pods -n default
          # ⛔ NOT `get pods/log`: in kubectl's grammar TYPE/NAME means "a pod NAMED log", so that
          # form passed under the old over-broad role (which had `get pods`) for the WRONG reason
          # and fails under the minimal one. --subresource is the real question. Found by hand.
          allow get pods --subresource=log -n default
          allow list events -n default
          allow get deployments.apps -n default
          allow list replicasets.apps -n default

      - name: RBAC must deny writes, unused read verbs, secrets, other namespaces and cluster scope
        run: |
          SA=system:serviceaccount:aegis:aegis
          deny() { r=$(kubectl auth can-i "$@" --as=$SA 2>/dev/null || true); echo "$* -> $r"; [ "$r" = "no" ] || { echo "::error::$* must be denied"; exit 1; }; }
          # writes
          deny delete pods -n default
          deny create pods -n default
          deny deletecollection pods -n default
          deny create pods/exec -n default
          deny create pods/eviction -n default
          deny patch deployments.apps -n default
          deny update deployments.apps -n default
          deny delete deployments.apps -n default
          deny create secrets -n default
          # "minimal": reads the code does not make must ALSO be denied
          deny watch pods -n default
          deny get pods -n default
          deny watch events -n default
          deny list deployments.apps -n default
          deny get replicasets.apps -n default
          deny list events.events.k8s.io -n default
          # secrets, other namespaces, cluster scope
          deny get secrets -n default
          deny list secrets -n default
          deny list pods -n kube-system
          deny list pods -n aegis
          deny get nodes
          deny list namespaces

      - name: Deploy the synthetic OOM workload and wait until it is GENUINELY crash-looping
        run: |
          kubectl apply -f k8s/test/oom-workload.yaml
          # The scenario is "a pod stuck in CrashLoopBackOff from OOM", not "a pod that died once".
          # One kill gives a fresh pod with thin evidence and the verifier correctly escalates it;
          # the proof of the APPROVED path needs the state an on-call engineer would actually see:
          # repeated OOMKilled, restarts >= 2, and a BackOff event on the record.
          reason=""; restarts=0
          for i in $(seq 1 48); do
            reason=$(kubectl get pod -l app=checkout -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}' 2>/dev/null || true)
            restarts=$(kubectl get pod -l app=checkout -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}' 2>/dev/null || echo 0)
            echo "[$i] lastState.terminated.reason='$reason' restarts=$restarts"
            [ "$reason" = "OOMKilled" ] && [ "${restarts:-0}" -ge 2 ] && break
            sleep 5
          done
          [ "$reason" = "OOMKilled" ] && [ "${restarts:-0}" -ge 2 ] || { echo "::error::pod never reached OOMKilled with >=2 restarts"; kubectl describe pod -l app=checkout; exit 1; }
          kubectl get events -n default --field-selector reason=BackOff 2>/dev/null | grep -q checkout || { echo "::error::no BackOff event recorded for the workload"; exit 1; }
          kubectl get pods -l app=checkout
          # The kubelet's own record above is the proof. The log is shown for the reader, not asserted -
          # a non-interactive shell does not reliably print 'Killed'.
          kubectl logs -l app=checkout --tail=5 --previous 2>/dev/null || kubectl logs -l app=checkout --tail=5 || true

      - name: Install with the k8s extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,k8s]"

      - name: Integration tests against the live cluster - and they must have RUN, not skipped
        env:
          AEGIS_K8S_INTEGRATION: "1"
          AEGIS_TRACE: "0"
        run: |
          set -o pipefail
          pytest tests/integration -q -rs | tee it.txt
          grep -qE '^[0-9]+ passed' it.txt || { echo "::error::no integration test actually passed"; exit 1; }
          grep -qE ' skipped' it.txt && { echo "::error::integration tests skipped with the opt-in set"; exit 1; }
          echo "integration tests ran for real"

      - name: AEGIS from OUTSIDE the cluster must reach scale_up / APPROVED_FOR_HUMAN
        env:
          AEGIS_BACKEND: k8s
          AEGIS_MOCK: "1"
          AEGIS_TRACE: "0"
        run: |
          out=$(aegis run --incident inc-002 --verbose)
          echo "$out"
          echo "$out" | grep -q '"backend": "kubernetes"'   || { echo "::error::evidence did not come from the cluster"; exit 1; }
          echo "$out" | grep -q 'scale_up'                   || { echo "::error::expected scale_up"; exit 1; }
          echo "$out" | grep -q 'APPROVED_FOR_HUMAN'         || { echo "::error::expected APPROVED_FOR_HUMAN"; exit 1; }
          echo "$out" | grep -q '"tool_errors": \[\]'        || { echo "::error::a context tool failed or partially failed"; exit 1; }
          echo "$out" | grep -q 'TOOL-PARTIAL' && { echo "::error::a partial failure leaked into the output"; exit 1; } || true

      - name: Build the image and load it into the cluster
        run: |
          docker build -t aegis:local .
          k3d image import aegis:local -c aegis-ci

      - name: Runtime posture probe - what uid does the PROCESS run as, and can it write?
        run: |
          kubectl apply -f k8s/test/posture-probe.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/aegis-posture-probe -n aegis --timeout=120s || { kubectl describe pod aegis-posture-probe -n aegis; exit 1; }
          out=$(kubectl logs pod/aegis-posture-probe -n aegis)
          echo "$out"
          echo "$out" | grep -q '^uid=10001$'      || { echo "::error::process is not uid 10001"; exit 1; }
          echo "$out" | grep -q '^rootfs=READONLY$' || { echo "::error::root filesystem is writable"; exit 1; }

      - name: AEGIS from INSIDE the cluster, under the read-only ServiceAccount
        run: |
          # `create`, not `apply`: the Job uses generateName and is immutable once made.
          job=$(kubectl create -f k8s/job.yaml -o jsonpath='{.metadata.name}')
          echo "created job/$job"
          kubectl wait --for=condition=complete "job/$job" -n aegis --timeout=180s || { kubectl describe "job/$job" -n aegis; kubectl logs "job/$job" -n aegis || true; exit 1; }
          out=$(kubectl logs "job/$job" -n aegis)
          echo "$out"
          echo "$out" | grep -q '"backend": "kubernetes"' || { echo "::error::in-cluster run did not use the cluster backend"; exit 1; }
          echo "$out" | grep -q 'scale_up'                 || { echo "::error::in-cluster run did not propose scale_up"; exit 1; }
          echo "$out" | grep -q 'APPROVED_FOR_HUMAN'       || { echo "::error::in-cluster verdict wrong"; exit 1; }
          echo "$out" | grep -q '"tool_errors": \[\]'      || { echo "::error::in-cluster run had tool errors"; exit 1; }
          # A second diagnosis must be creatable without deleting the first (the immutability finding).
          job2=$(kubectl create -f k8s/job.yaml -o jsonpath='{.metadata.name}')
          [ "$job2" != "$job" ] || { echo "::error::generateName did not mint a new Job"; exit 1; }
          echo "second diagnosis job/$job2 created alongside job/$job"

      - name: Tear down
        if: always()
        run: k3d cluster delete aegis-ci || true

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      # -backend=false: validate the configuration without needing AWS credentials or state.
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
