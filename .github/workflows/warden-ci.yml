name: "CI · tool"

# WARDEN itself (warden/): lint, tests, evals, the container, a real k3d cluster, real databases. No credentials.
# The steps are warden/'s own composite actions (warden/.github/actions/*), and infra/'s for the root stack's
# terraform job; this file holds what GitHub needs at the root - triggers, jobs, permissions, services.
# The pipelines, one job each:
#   CI · tool (this)   CI · infra (infra-ci.yml)   CI · apps (demo-app-ci.yml)   CI · fault-lab (fault-lab-ci.yml)
#   CI · helios (helios-ci.yml)   Scan · workflows
#   Deploy · <env> (deploy-<env>.yml by hand, on-merge-<env>.yml on a push to the branch <env>; one file each per
#   environment; shared steps in infra-validate.yml, infra-deploy.yml, demo-app-check.yml, demo-app-deploy.yml)
# Branches (owner, 2026-10-16): CI runs on main and on pull requests into main. dev and prod receive only commits main
# has already checked (a fast-forward, or a merge of dev that changes nothing), so a pull request into prod does not
# run this suite again.
# Paths: everything but what other pipelines own (the same set as before the split into components). WARDEN's tests
# also hold infra/ and fault-lab/ to their rules, so a change there runs this suite too.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!infra/terraform/fullstack/**"
      - "!demo-app/app/**"
      - "!demo-app/lambdas/**"
      - "!demo-app/sql/**"
      - "!demo-app/manifests/**"
      - "!demo-app/k8s/**"
      - "!demo-app/scripts/deploy_fullstack_apps.py"
      - "!demo-app/.github/**"
      - "!infra/helm/**"
      - "!infra/.github/**"
      - "infra/.github/actions/terraform-root/**"  # this pipeline's terraform job runs it
      - "!fault-lab/.github/**"
      - "!helios/**"
      - "!.github/workflows/infra-*.yml"
      - "!.github/workflows/demo-app-*.yml"
      - "!.github/workflows/helios-*.yml"
      - "!.github/workflows/fault-lab-*.yml"
      - "!.github/workflows/deploy-*.yml"
      - "!.github/workflows/on-merge-*.yml"
      - "!.github/workflows/scan-workflows.yml"
  # Weekly, so pip-audit sees a newly published vulnerability in a dependency nothing changed.
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    # A draft pull request runs no CI (owner, 2026-10-21: the Actions queue was the bottleneck); it runs when it is
    # marked ready for review, and on every push after that.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "**"
      - "!infra/terraform/fullstack/**"
      - "!demo-app/app/**"
      - "!demo-app/lambdas/**"
      - "!demo-app/sql/**"
      - "!demo-app/manifests/**"
      - "!demo-app/k8s/**"
      - "!demo-app/scripts/deploy_fullstack_apps.py"
      - "!demo-app/.github/**"
      - "!infra/helm/**"
      - "!infra/.github/**"
      - "infra/.github/actions/terraform-root/**"  # this pipeline's terraform job runs it
      - "!fault-lab/.github/**"
      - "!helios/**"
      - "!.github/workflows/infra-*.yml"
      - "!.github/workflows/demo-app-*.yml"
      - "!.github/workflows/helios-*.yml"
      - "!.github/workflows/fault-lab-*.yml"
      - "!.github/workflows/deploy-*.yml"
      - "!.github/workflows/on-merge-*.yml"
      - "!.github/workflows/scan-workflows.yml"

# Mock mode everywhere: CI must never need a key, and the eval gate must be deterministic.
env:
  WARDEN_MOCK: "1"

# Least privilege for every job's GITHUB_TOKEN (zizmor, 2026-09-27).
permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes. On main each commit is its own
# group, so none is dropped or cancelled: a red main must be traceable to one commit (a shared group
# cancels the PENDING run when a third commit arrives - fourth review, 2026-09-30).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Free scanners (2026-09-27 security audit), each pinned. pip-audit: known-vulnerable dependencies.
  # bandit: Python security smells at medium severity and up (reviewed false positives carry a
  # `# nosec <id>`). zizmor: workflow injection, unpinned actions, token persistence, permissions.
  security:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/warden/.github/actions/security

  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/warden/.github/actions/check

  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/warden/.github/actions/docker

  # Against a REAL cluster. Every step here was first done by hand and read by eye; this job
  # replays it so it cannot regress. Assertions are on OUTPUT and on the API server's own answers,
  # never on exit codes alone. An adversarial review of the first version of this job found five
  # ways it could go green while a README claim was false; each has a named assertion below.
  #
  # ⚠ WHY k3d AND NOT EKS. This is the per-commit REGRESSION check, not the measurement. The
  # measurement is on managed EKS (EC2 node group, read-only ServiceAccount): Wave 2, 30 runs,
  # warden/tests/fixtures/bench/wave2-2026-09-24T115746Z. EKS on every push would cost money and ~25 minutes per
  # commit and put AWS credentials in a public repo's CI. k3d is a real API server - RBAC is really
  # enforced, the kubelet really OOM-kills - so what this job proves holds on any conformant cluster.
  k8s:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: k8s-regression (k3d, every push; measured on EKS in tests/fixtures/bench)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # k3d's own images by digest, as every other image here (fifth review E): the node image is k3d 5.9.0's
    # default k3s, and k3d uses K3D_IMAGE_TOOLS as written for `k3d image import`.
    env:
      K3S_IMAGE: ghcr.io/veerarakesh56/warden-mirror/rancher/k3s:v1.35.5-k3s1@sha256:2074403abe1bded11ef3dde09d457e13be8e0b64c218b1c4f8269b4565cfbc65
      K3D_IMAGE_TOOLS: ghcr.io/k3d-io/k3d-tools:5.9.0@sha256:c57abce697e66feeb826922718738fe186b47779312d49d4e51e6fb9b8a6f34d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/warden/.github/actions/k8s-regression
      # No teardown: the runner and its cluster are thrown away with the job.

  # Real databases, not stubs. Service containers give every push a PostgreSQL, MySQL, Redis,
  # MongoDB and SQL Server to run against, so "it terminates a stuck connection" is proven against the servers'
  # actual grammar and catalog views rather than against a recorded string.
  # Service images by digest (audit A-I-24), read 2026-10-01 from the registries. A tag can be moved to
  # other content; a digest cannot.
  db:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The databases' password, made per run (2026-10-16, naming audit item 17). A fixed one in this file
    # read as a real credential to every secret scanner and reader. It is not a secret: run_id is public,
    # and the containers live only on this runner VM, which is destroyed with the job. It is just never the
    # same twice, and no fixed credential exists anywhere. Upper- and lower-case letters, digits and well
    # over eight characters meet SQL Server's sa password policy; with no URL-special character it goes
    # into a DSN unencoded. The health checks read it from each container's own environment
    # ($MYSQL_ROOT_PASSWORD, $MSSQL_SA_PASSWORD), because a service's `options` cannot read the env context.
    env:
      DB_TEST_PASSWORD: Run${{ github.run_id }}x${{ github.run_attempt }}
    services:
      postgres:
        image: ghcr.io/veerarakesh56/warden-mirror/postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: ${{ env.DB_TEST_PASSWORD }}
          POSTGRES_DB: warden
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warden" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: ghcr.io/veerarakesh56/warden-mirror/mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_TEST_PASSWORD }}
          MYSQL_DATABASE: warden
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD" --health-interval 5s
          --health-timeout 5s --health-retries 30
      redis:
        image: ghcr.io/veerarakesh56/warden-mirror/redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mongo:
        image: ghcr.io/veerarakesh56/warden-mirror/mongo:7@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.DB_TEST_PASSWORD }}
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        # SQL Server takes ~30s to come up: the health check runs sqlcmd from /opt/mssql-tools18 with a
        # 30s start period and 30 retries, and the tests themselves FAIL (never skip) if it is not
        # answering by then.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30 --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/warden/.github/actions/db

  # The root stack (infra/terraform) and the proving ground: infra's steps, run here as before the split.
  terraform:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/infra/.github/actions/terraform-root
