name: "_ apps · check"

# Shared by CI · apps and every Deploy · <env>: lint, tests, every artifact built. No credentials. The steps are
# demo-app/'s composite action (demo-app/.github/actions/check).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/demo-app/.github/actions/check
