name: "Deploy · dev"
# Each run says what it does - WARDEN finds its own apply-plan run by this title (platforms/infra.py, healthy). Inputs in
# run-name are only shown, never executed.
run-name: "Deploy · dev · ${{ inputs.part == 'infra' && format('infra {0} {1} {2} {3}', inputs.infra_action, inputs.infra_stack, inputs.plan_run_id, inputs.dispatch_id) || format('apps {0}', inputs.apps_target) }}"

# The dev environment, by hand, from the branch dev only (Use workflow from: dev; owner, 2026-10-16). infra: plan,
# apply or destroy the full stack. apps: deploy the code that runs on it. The steps are shared (_infra-*.yml,
# _apps-*.yml); this file only names the environment and the branch it is promoted from (`upstream`) -
# tests/test_ci_lanes.py keeps the deploy files identical apart from those two names.
on:
  workflow_dispatch:
    inputs:
      part:
        description: "infra (the stack) or apps (the code that runs on it)"
        type: choice
        options: [infra, apps]
        default: infra
      infra_action:
        description: "infra only: plan, apply, apply-plan (a plan already reviewed), destroy, pause / resume (keeps the data), or eldane-apply (Eldane, the AI critic, reviews the saved plan and applies exactly it if it approves; refused wherever a person must approve)"
        type: choice
        options: [plan, apply, apply-plan, destroy, pause, resume, eldane-apply]
        default: plan
      infra_stack:
        description: "infra only: the full stack, or the small undo lab (terraform/undo-lab)"
        type: choice
        options: [fullstack, undo-lab]
        default: fullstack
      plan_run_id:
        description: "apply-plan only: the run id of the reviewed plan"
        type: string
        default: ""
      plan_sha256:
        description: "apply-plan only: the sha256 of the reviewed plan file"
        type: string
        default: ""
      dispatch_id:
        description: "apply-plan by WARDEN only: its run's id, shown in the run's name so WARDEN finds this run (never executed)"
        type: string
        default: ""
      apps_target:
        description: "apps only: what to deploy"
        type: choice
        options: [all, lambdas, ecs, k8s]
        default: all

permissions:
  contents: read

# One change at a time per environment, infra and apps together; never cancelled half-way.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  infra-validate:
    if: inputs.part == 'infra'
    uses: $/.github/workflows/_infra-validate.yml
  infra:
    if: inputs.part == 'infra'
    needs: infra-validate
    uses: $/.github/workflows/_infra-deploy.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EKS_ADMIN_ROLE_ARNS: ${{ secrets.EKS_ADMIN_ROLE_ARNS }}
      ELDANE_ANTHROPIC_API_KEY: ${{ secrets.ELDANE_ANTHROPIC_API_KEY }}
    with:
      environment: dev
      upstream: main
      action: ${{ inputs.infra_action }}
      stack: ${{ inputs.infra_stack }}
      plan_run_id: ${{ inputs.plan_run_id }}
      plan_sha256: ${{ inputs.plan_sha256 }}
    permissions:
      contents: read
      id-token: write

  apps-check:
    if: inputs.part == 'apps' || inputs.infra_action == 'resume'
    uses: $/.github/workflows/_apps-check.yml
  apps:
    if: inputs.part == 'apps'
    needs: apps-check
    uses: $/.github/workflows/_apps-deploy.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    with:
      environment: dev
      upstream: main
      target: ${{ inputs.apps_target }}
    permissions:
      contents: read
      id-token: write

  # resume, in the same run: the infrastructure is back, so everything that runs on it goes back too - the Lambdas, ECS
  # and the cluster's add-ons (Argo CD, the Datadog agent, the shop), each waited for until healthy.
  apps-after-resume:
    if: inputs.part == 'infra' && inputs.infra_action == 'resume'
    needs: [infra, apps-check]
    uses: $/.github/workflows/_apps-deploy.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    with:
      environment: dev
      upstream: main
      target: all
    permissions:
      contents: read
      id-token: write
