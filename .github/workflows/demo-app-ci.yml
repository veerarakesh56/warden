name: "CI · apps"

# demo-app/: the code that runs ON the full stack (Lambdas, the container image, the shop's manifests), checked on every
# change to it: lint, tests, every artifact built. No credentials. Deploying it: Deploy · <env>, which runs this same
# check first. The steps are demo-app/'s composite action (demo-app/.github/actions/check).
on:
  push:
    branches: [main]
    paths:
      - "demo-app/**"
      - "infra/helm/**"  # Argo CD's values: the apps pipeline installs it
      - ".github/workflows/demo-app-ci.yml"
      - ".github/workflows/demo-app-check.yml"
      - "warden/src/warden/paths.py"  # deploy_fullstack_apps.py imports it
      # Its jobs install from these: a stale lock must run them (2026-10-01: it did not, so a lock
      # older than pyproject.toml stayed hidden until an apps or infra path changed).
      - "warden/uv.lock"
      - "warden/pyproject.toml"
      # The tests of the apps live with WARDEN's (warden/tests); each one the check runs is a trigger here.
      - "warden/tests/test_deploy_fullstack_apps.py"
      - "warden/tests/test_fullstack_infra.py"
      - "warden/tests/test_supply_chain.py"
      - "warden/tests/test_k8s_tokens.py"
      - "warden/tests/test_redis_tls_r8.py"
      - "warden/tests/test_api_auth_ai13.py"
      - "warden/tests/test_shop_app_log_s5145.py"
      - "warden/tests/test_traffic_alb_tls.py"
      - "warden/tests/test_load_rng_s2245.py"
      - "warden/tests/test_fullstack_ops_lambda.py"
      - "warden/tests/test_stack_paths_s2083.py"
      - "warden/tests/test_shop_https_s5332.py"
      - "warden/tests/test_deploy_env_isolation.py"
  # Pull requests into main only (2026-10-16): dev and prod receive commits main has already checked.
  pull_request:
    # A draft pull request runs no CI (owner, 2026-10-21: the Actions queue was the bottleneck); it runs when it is
    # marked ready for review, and on every push after that.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "demo-app/**"
      - "infra/helm/**"  # Argo CD's values: the apps pipeline installs it
      - ".github/workflows/demo-app-ci.yml"
      - ".github/workflows/demo-app-check.yml"
      - "warden/src/warden/paths.py"  # deploy_fullstack_apps.py imports it
      # Its jobs install from these: a stale lock must run them (2026-10-01: it did not, so a lock
      # older than pyproject.toml stayed hidden until an apps or infra path changed).
      - "warden/uv.lock"
      - "warden/pyproject.toml"
      # The tests of the apps live with WARDEN's (warden/tests); each one the check runs is a trigger here.
      - "warden/tests/test_deploy_fullstack_apps.py"
      - "warden/tests/test_fullstack_infra.py"
      - "warden/tests/test_supply_chain.py"
      - "warden/tests/test_k8s_tokens.py"
      - "warden/tests/test_redis_tls_r8.py"
      - "warden/tests/test_api_auth_ai13.py"
      - "warden/tests/test_shop_app_log_s5145.py"
      - "warden/tests/test_traffic_alb_tls.py"
      - "warden/tests/test_load_rng_s2245.py"
      - "warden/tests/test_fullstack_ops_lambda.py"
      - "warden/tests/test_stack_paths_s2083.py"
      - "warden/tests/test_shop_https_s5332.py"
      - "warden/tests/test_deploy_env_isolation.py"
  # Weekly too: the deployed requirements are audited (pip-audit) even when nothing here changes - a new CVE
  # in a pinned redis or psycopg was noticed only at the next change or deploy (sixth review, 2026-10-01).
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-apps-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: $/.github/workflows/demo-app-check.yml
