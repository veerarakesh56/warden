name: "_ infra · deploy"

# The steps are infra/'s composite actions (infra/.github/actions/deploy-prepare, deploy-run); this file keeps what
# must stay at the root: the inputs, the environment, the guards that run before the checkout, and the steps that
# read the environment's secrets and variables (a composite action cannot).
# plan | apply | destroy ONE stack in ONE environment, through GitHub OIDC: the full stack (infra/terraform/fullstack),
# or the undo lab (infra/terraform/undo-lab - a table, a queue, two functions and a schedule; it refuses any environment but
# the one its fault-injection role exists in). Called only by
# Deploy · <env> and Deploy · <env> · on merge. NO AWS KEYS ARE STORED ANYWHERE. Per environment the owner creates once
# (docs/SETUP.md): the role warden-<env>-deploy (its trust accepts only this repository's
# GitHub Environment of the same name, on the branch of the same name), the SSM parameters /warden/<env>/tf/*, a state
# bucket, and a GitHub Environment <env> (deployment branch: <env> only) with the secret AWS_ROLE_ARN (it holds the
# account id: a variable is printed unmasked in a step's inputs, 2026-10-16), the variables AWS_REGION and
# TF_STATE_BUCKET (optional EKS_PUBLIC_CIDRS, EKS_ADMIN_ROLE_ARNS) and, for prod, the owner as required reviewer.
# Branches (owner, 2026-10-16): main deploys nothing; dev is main fast-forwarded; prod is dev merged by pull request.
# Aurora is created and destroyed by infra/terraform/fullstack/aurora_express.py, not by terraform (the
# provider cannot create an express cluster): `create` after apply, `destroy` before destroy.
# pause / resume (owner update 5, 2026-10-17; the full stack only): pause stops every writer, then copies every data
# store (infra/scripts/pause_resume.py snapshot - each copy AVAILABLE before anything goes) and then destroys the stack as `destroy` does; resume restores
# the tables from their newest pause backups and imports them, applies as `apply` does, and brings Aurora back from its
# newest pause snapshot. With no copy (a first install) resume is an apply. No copy is ever deleted.
on:
  workflow_call:
    # Passed by name by every caller: an environment secret a caller does not pass is an empty string here,
    # with no error (GitHub docs, 2026-10-16) - the role it names must never be silently empty.
    secrets:
      AWS_ROLE_ARN:
        required: true
      EKS_ADMIN_ROLE_ARNS:
        required: false
    inputs:
      environment:
        type: string
        required: true
      # The branch this environment's commits are promoted from: main for dev, dev for prod (2026-10-16).
      upstream:
        type: string
        required: true
      action:
        type: string
        required: true
      stack:
        type: string
        default: fullstack
      # apply-plan only (owner, 2026-10-16: infra applies only a plan someone reviewed): the plan run's id and the
      # SHA-256 of the plan file the reviewer read. The plan is applied only if both match, and only at the commit it
      # was made from.
      plan_run_id:
        type: string
        default: ""
      plan_sha256:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      STACK: ${{ inputs.stack }}
      WARDEN_ENV: ${{ inputs.environment }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: "1"
    steps:
      # Owner, 2026-10-16: an environment deploys only from the branch of the same name, so main deploys nothing. The
      # GitHub Environment's deployment-branch rule and the role's trust (`ref`, infra/iam/templates/trust.json) say the same.
      - name: Deploys run from their environment's own branch
        if: github.ref != format('refs/heads/{0}', inputs.environment)
        run: |
          echo "::error::$WARDEN_ENV deploys from the branch $WARDEN_ENV only, not $GITHUB_REF (audit A-I-10)"
          exit 1
      - name: A known action
        run: |
          case "$ACTION" in plan|apply|apply-plan|destroy|pause|resume) ;; *) echo "::error::unknown action: $ACTION"; exit 1 ;; esac
          case "$ACTION/$STACK" in pause/undo-lab|resume/undo-lab) echo "::error::pause and resume are for the full stack"; exit 1 ;; esac
          case "$STACK" in fullstack|undo-lab) ;; *) echo "::error::unknown stack: $STACK"; exit 1 ;; esac
      - name: The environment names its region
        run: |
          test -n "$AWS_REGION" || { echo "::error::set the variable AWS_REGION on this GitHub Environment"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # every branch: the promotion check reads the upstream one
      # The promotion check, the locked tools and Helios built from helios/ - all before the job holds a credential.
      - uses: $/infra/.github/actions/deploy-prepare
        with:
          upstream: ${{ inputs.upstream }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: optional variables
        env:
          CIDRS: ${{ vars.EKS_PUBLIC_CIDRS }}
          # The ARNs of the IAM roles given admin access to the cluster - names, not credentials. A secret only
          # because an ARN holds the account id (2026-10-16).
          ADMIN_ROLE_ARNS: ${{ secrets.EKS_ADMIN_ROLE_ARNS }}
        run: |
          if [ -n "$CIDRS" ]; then echo "TF_VAR_eks_public_access_cidrs=$CIDRS" >> "$GITHUB_ENV"; fi
          if [ -n "$ADMIN_ROLE_ARNS" ]; then echo "TF_VAR_eks_admin_principal_arns=$ADMIN_ROLE_ARNS" >> "$GITHUB_ENV"; fi
      - uses: $/infra/.github/actions/deploy-run
        with:
          action: ${{ inputs.action }}
          plan_run_id: ${{ inputs.plan_run_id }}
          plan_sha256: ${{ inputs.plan_sha256 }}
          keep_snapshots: ${{ vars.PAUSE_KEEP_SNAPSHOTS || '3' }}
