name: "_ infra · deploy"

# plan | apply | destroy the full stack in ONE environment, through GitHub OIDC. Called only by
# Deploy · <env>. NO AWS KEYS ARE STORED ANYWHERE. Per environment the owner creates once
# (docs/OWNER-CONSOLE-STEPS.md): the role warden-<env>-deploy (its trust accepts only this repository's
# GitHub Environment of the same name), the SSM parameters /warden/<env>/tf/*, a state bucket, and a
# GitHub Environment <env> with the variables AWS_ROLE_ARN, AWS_REGION and TF_STATE_BUCKET (optional
# EKS_PUBLIC_CIDRS, EKS_ADMINS) and required reviewers for pre-prod, qa-prod and prod.
# Aurora is created and destroyed by terraform/fullstack/aurora_express.py, not by terraform (the
# provider cannot create an express cluster): `create` after apply, `destroy` before destroy.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      action:
        type: string
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      WARDEN_ENV: ${{ inputs.environment }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Deploys run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploys run from main only (audit A-I-10)"
          exit 1
      - name: A known action
        run: |
          case "$ACTION" in plan|apply|destroy) ;; *) echo "::error::unknown action: $ACTION"; exit 1 ;; esac
      - name: The environment names its region
        run: |
          test -n "$AWS_REGION" || { echo "::error::set the variable AWS_REGION on this GitHub Environment"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # uv, pinned and checksum-verified, installs only what uv.lock lists - every version and hash
      # (audit A-I-9: unpinned pip installs ran while jobs held cloud credentials) - and before
      # the job holds any.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          python-version: "3.13"
          activate-environment: true
          # No cache in a job that holds credentials: uv does not re-verify unpacked cache entries, so a
          # poisoned cache would install unchecked (fifth review E, 2026-10-01).
          enable-cache: false
      - run: uv sync --locked --only-group infra-deploy   # aurora_express.py: stdlib + boto3 only
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: optional variables
        env:
          CIDRS: ${{ vars.EKS_PUBLIC_CIDRS }}
          ADMINS: ${{ vars.EKS_ADMINS }}
        run: |
          if [ -n "$CIDRS" ]; then echo "TF_VAR_eks_public_access_cidrs=$CIDRS" >> "$GITHUB_ENV"; fi
          if [ -n "$ADMINS" ]; then echo "TF_VAR_eks_admin_principal_arns=$ADMINS" >> "$GITHUB_ENV"; fi
      - name: init with the S3 backend
        # backend_override.tf exists only on the runner: a local apply keeps local state.
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > terraform/fullstack/backend_override.tf
          terraform -chdir=terraform/fullstack init -input=false \
            -backend-config="bucket=$BUCKET" -backend-config="key=fullstack/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          # The environment IS the workspace; terraform refuses any other (main.tf precondition).
          terraform -chdir=terraform/fullstack workspace select -or-create "$WARDEN_ENV"
      - name: plan
        if: env.ACTION == 'plan'
        run: terraform -chdir=terraform/fullstack plan -input=false -no-color
      - name: apply and publish stack.json
        if: env.ACTION == 'apply'
        run: |
          terraform -chdir=terraform/fullstack apply -input=false -auto-approve -no-color
          # stack.json: every output EXCEPT the sensitive ones.
          terraform -chdir=terraform/fullstack output -json \
            | jq 'with_entries(select(.value.sensitive | not))' > "$RUNNER_TEMP/stack.json"
          # Aurora (express configuration) after the VPC exists; it merges its keys into stack.json.
          python terraform/fullstack/aurora_express.py create --stack "$RUNNER_TEMP/stack.json"
          aws s3 cp "$RUNNER_TEMP/stack.json" "s3://$BUCKET/fullstack/stack.json" --only-show-errors
      - name: destroy
        if: env.ACTION == 'destroy'
        run: |
          # Aurora first: terraform does not know it exists.
          python terraform/fullstack/aurora_express.py destroy
          terraform -chdir=terraform/fullstack destroy -input=false -auto-approve -no-color
          aws s3 rm "s3://$BUCKET/fullstack/stack.json" --only-show-errors || true
          aws resourcegroupstaggingapi get-resources --region "$AWS_REGION" \
            --tag-filters Key=Project,Values=warden "Key=Environment,Values=$WARDEN_ENV" --query 'length(ResourceTagMappingList)'
