name: "Deploy · prod"

# The prod environment, by hand, from the branch prod only (Use workflow from: prod; owner, 2026-10-16). infra: plan,
# apply or destroy the full stack. apps: deploy the code that runs on it. The steps are shared (infra-validate.yml,
# infra-deploy.yml, demo-app-check.yml, demo-app-deploy.yml, and the components' composite actions they call); this file
# only names the environment and the branch it is promoted from (`upstream`) - warden/tests/test_ci_lanes.py keeps the
# deploy files identical apart from those two names.
# CI first (owner, 2026-10-21): each deploy job `needs` its pipeline's own check in the same run, on the same commit -
# infra: infra-validate (fmt, validate, the infra tests); apps: demo-app-check (lint, scans, tests, every artifact
# built). A failed check deploys nothing. There is no deploy path that skips it.
on:
  workflow_dispatch:
    inputs:
      part:
        description: "infra (the stack) or apps (the code that runs on it)"
        type: choice
        options: [infra, apps]
        default: infra
      infra_action:
        description: "infra only: plan, apply, apply-plan (a plan already reviewed), destroy, or pause / resume (keeps the data)"
        type: choice
        options: [plan, apply, apply-plan, destroy, pause, resume]
        default: plan
      infra_stack:
        description: "infra only: the full stack, or the small undo lab (infra/terraform/undo-lab)"
        type: choice
        options: [fullstack, undo-lab]
        default: fullstack
      plan_run_id:
        description: "apply-plan only: the run id of the reviewed plan"
        type: string
        default: ""
      plan_sha256:
        description: "apply-plan only: the sha256 of the reviewed plan file"
        type: string
        default: ""
      apps_target:
        description: "apps only: what to deploy"
        type: choice
        options: [all, lambdas, ecs, k8s]
        default: all

permissions:
  contents: read

# One change at a time per environment, infra and apps together; never cancelled half-way.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  infra-validate:
    if: inputs.part == 'infra'
    uses: $/.github/workflows/infra-validate.yml
  infra:
    if: inputs.part == 'infra'
    needs: infra-validate
    uses: $/.github/workflows/infra-deploy.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EKS_ADMIN_ROLE_ARNS: ${{ secrets.EKS_ADMIN_ROLE_ARNS }}
    with:
      environment: prod
      upstream: dev
      action: ${{ inputs.infra_action }}
      stack: ${{ inputs.infra_stack }}
      plan_run_id: ${{ inputs.plan_run_id }}
      plan_sha256: ${{ inputs.plan_sha256 }}
    permissions:
      contents: read
      id-token: write

  apps-check:
    if: inputs.part == 'apps' || inputs.infra_action == 'resume'
    uses: $/.github/workflows/demo-app-check.yml
  apps:
    if: inputs.part == 'apps'
    needs: apps-check
    uses: $/.github/workflows/demo-app-deploy.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    with:
      environment: prod
      upstream: dev
      target: ${{ inputs.apps_target }}
    permissions:
      contents: read
      id-token: write

  # resume, in the same run: the infrastructure is back, so everything that runs on it goes back too - the Lambdas, ECS
  # and the cluster's add-ons (Argo CD, the Datadog agent, the shop), each waited for until healthy.
  apps-after-resume:
    if: inputs.part == 'infra' && inputs.infra_action == 'resume'
    needs: [infra, apps-check]
    uses: $/.github/workflows/demo-app-deploy.yml
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    with:
      environment: prod
      upstream: dev
      target: all
    permissions:
      contents: read
      id-token: write
