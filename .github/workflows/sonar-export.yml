name: "Temp · Sonar export (never merged)"

# Throwaway (cloud session, 2026-10-17): sonarcloud.io is unreachable from the cloud sandbox, so this prints the open
# SonarCloud issues of main from Sonar's public API into the job log. No checkout, no secrets, no third-party action.
# This pull request is closed without merging once the list is read.
on:
  push:
    branches: [sonar-export]
    paths: [".github/workflows/sonar-export.yml"]

# Read-only: the code-scanning alerts of main, counted per tool.
permissions:
  security-events: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open code-scanning alerts on main, per tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=refs/heads/main&state=open&per_page=100" \
            --jq '.[] | "CS|\(.tool.name)|\(.rule.id)|\(.rule.security_severity_level // .rule.severity)|\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)|\(.number)"' \
            > alerts.txt || echo "CS-ERROR could not list alerts"
          echo "=== CODE-SCANNING open on main: $(wc -l < alerts.txt)"
          cut -d'|' -f2 alerts.txt | sort | uniq -c
          cat alerts.txt
      - name: Open issues on main, one per line
        shell: python
        run: |
          import json, time, urllib.request
          base = "https://sonarcloud.io/api/issues/search?componentKeys=veerarakesh56_warden&issueStatuses=OPEN,CONFIRMED,ACCEPTED,FALSE_POSITIVE&ps=500"
          def get(url):
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          return json.load(r)
                  except Exception as e:
                      print("retry", attempt, e); time.sleep(5)
              raise SystemExit("sonar api unreachable")
          an = get("https://sonarcloud.io/api/project_analyses/search?project=veerarakesh56_warden&branch=main&ps=3")
          for x in an.get("analyses", []):
              print(f"=== ANALYSIS {x.get('date')} revision={x.get('revision')}")
          try:
              ce = get("https://sonarcloud.io/api/ce/activity?component=veerarakesh56_warden&ps=5")
              for t in ce.get("tasks", []):
                  print(f"=== TASK {t.get('id')} branch={t.get('branch')} {t.get('branchType')} {t.get('status')} {t.get('executedAt')} warnings={t.get('warningCount')}")
              main = [t for t in ce.get("tasks", []) if t.get("branchType") == "BRANCH"][:1]
              for t in main:
                  w = get(f"https://sonarcloud.io/api/ce/task?id={t['id']}&additionalFields=warnings")
                  for msg in w.get("task", {}).get("warnings", []):
                      print(f"W|{msg}")
          except SystemExit as e:
              print("=== WARNINGS unreadable:", e)
          # export run: main's open maintainability issues with their secondary locations, after PR 113 (2026-10-22 ~01:00 UTC)
          page, seen = 1, 0
          while True:
              d = get(f"https://sonarcloud.io/api/issues/search?componentKeys=veerarakesh56_warden&branch=main&issueStatuses=OPEN,CONFIRMED&impactSoftwareQualities=MAINTAINABILITY&ps=500&p={page}")
              if page == 1:
                  print(f"=== MAIN MAINTAINABILITY open total={d['total']}")
              for i in d["issues"]:
                  comp = i["component"].split(":", 1)[-1]
                  print(f"M|{i['rule']}|{comp}|{i.get('line', '')}|{i['key']}|{i['message'][:120]}")
                  for flow in i.get("flows", []):
                      for loc in flow.get("locations", []):
                          r = loc.get("textRange", {})
                          print(f"  FLOW|{loc.get('component', '').split(':', 1)[-1]}|{r.get('startLine')}-{r.get('endLine')}|{loc.get('msg', '')}")
              seen += len(d["issues"])
              if seen >= d["total"] or not d["issues"]:
                  break
              page += 1
