name: "CI · apps"

# The code that runs ON the full stack (Lambdas, the container image, the shop's manifests), checked on every
# change to it: lint, tests, every artifact built. No credentials. Deploying it: Deploy · <env>.
on:
  push:
    branches: [main]
    paths:
      - "scenarios/fullstack/**"
      - "manifests/**"
      - "k8s/shop-pipeline/**"
      - "k8s/argocd/**"
      - "helm/**"
      - "scripts/deploy_fullstack_apps.py"
      - "tests/test_deploy_fullstack_apps.py"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/_apps-check.yml"
      # Its jobs install from these: a stale lock must run them (2026-10-01: it did not, so a lock
      # older than pyproject.toml stayed hidden until an apps or infra path changed).
      - "uv.lock"
      - "pyproject.toml"
      - "tests/test_supply_chain.py"
      - "tests/test_k8s_tokens.py"
      - "tests/test_redis_tls_r8.py"
      - "tests/test_api_auth_ai13.py"
      - "tests/test_shop_app_log_s5145.py"
      - "tests/test_shop_app_http_s5332.py"
      - "tests/test_load_generator_random_s2245.py"
      - "tests/test_stack_paths_s2083.py"
  # Pull requests into main only (2026-10-16): dev and prod receive commits main has already checked.
  pull_request:
    # A draft pull request runs no CI (owner, 2026-10-21: the Actions queue was the bottleneck); it runs when it is
    # marked ready for review, and on every push after that.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "scenarios/fullstack/**"
      - "manifests/**"
      - "k8s/shop-pipeline/**"
      - "k8s/argocd/**"
      - "helm/**"
      - "scripts/deploy_fullstack_apps.py"
      - "tests/test_deploy_fullstack_apps.py"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/_apps-check.yml"
      # Its jobs install from these: a stale lock must run them (2026-10-01: it did not, so a lock
      # older than pyproject.toml stayed hidden until an apps or infra path changed).
      - "uv.lock"
      - "pyproject.toml"
      - "tests/test_supply_chain.py"
      - "tests/test_k8s_tokens.py"
      - "tests/test_redis_tls_r8.py"
      - "tests/test_api_auth_ai13.py"
      - "tests/test_shop_app_log_s5145.py"
      - "tests/test_shop_app_http_s5332.py"
      - "tests/test_load_generator_random_s2245.py"
      - "tests/test_stack_paths_s2083.py"
  # Weekly too: the deployed requirements are audited (pip-audit) even when nothing here changes - a new CVE
  # in a pinned redis or psycopg was noticed only at the next change or deploy (sixth review, 2026-10-01).
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-apps-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: $/.github/workflows/_apps-check.yml
