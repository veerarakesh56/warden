name: "CI · tool"

# WARDEN itself: lint, tests, evals, the container, a real k3d cluster, real databases. No credentials.
# The pipelines, one job each:
#   CI · tool (this)   CI · infra (ci-infra.yml)   CI · apps (ci-apps.yml)   Scan · workflows
#   Deploy · <env> (deploy-<env>.yml, by hand, one file per environment; shared steps in _*.yml)
on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/fullstack/**"
      - "scenarios/fullstack/**"
      - "k8s/fullstack/**"
      - "scripts/deploy_fullstack_apps.py"
      - ".github/workflows/ci-infra.yml"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/deploy-*.yml"
      - ".github/workflows/_*.yml"
      - ".github/workflows/scan-workflows.yml"
  # Weekly, so pip-audit sees a newly published vulnerability in a dependency nothing changed.
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths-ignore:
      - "terraform/fullstack/**"
      - "scenarios/fullstack/**"
      - "k8s/fullstack/**"
      - "scripts/deploy_fullstack_apps.py"
      - ".github/workflows/ci-infra.yml"
      - ".github/workflows/ci-apps.yml"
      - ".github/workflows/deploy-*.yml"
      - ".github/workflows/_*.yml"
      - ".github/workflows/scan-workflows.yml"

# Mock mode everywhere: CI must never need a key, and the eval gate must be deterministic.
env:
  WARDEN_MOCK: "1"

# Least privilege for every job's GITHUB_TOKEN (zizmor, 2026-09-27).
permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes. On main each commit is its own
# group, so none is dropped or cancelled: a red main must be traceable to one commit (a shared group
# cancels the PENDING run when a third commit arrives - fourth review, 2026-09-30).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Free scanners (2026-09-27 security audit), each pinned. pip-audit: known-vulnerable dependencies.
  # bandit: Python security smells at medium severity and up (reviewed false positives carry a
  # `# nosec <id>`). zizmor: workflow injection, unpinned actions, token persistence, permissions.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # uv, pinned and checksum-verified, installs only what uv.lock lists - every version and hash
      # (audit A-I-9: unpinned pip installs ran while jobs held cloud credentials).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          python-version: "3.13"
          activate-environment: true
      - name: Install the scanners (locked)
        run: uv sync --locked --group scan
      # Every locked package - every extra and group, not only what this job installs - audited from the
      # lock itself, hashes required.
      - name: Dependencies with known vulnerabilities
        run: |
          uv export --locked --all-extras --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/locked.txt"
          pip-audit -r "$RUNNER_TEMP/locked.txt" --require-hashes --disable-pip
      - name: Python security lint
        run: bandit -q -r src scenarios scripts -ll
      - name: Workflow audit
        run: zizmor --offline --format plain .github

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # uv, pinned and checksum-verified, installs only what uv.lock lists - every version and hash
      # (audit A-I-9: unpinned pip installs ran while jobs held cloud credentials).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          python-version: "3.13"
          activate-environment: true

      - name: Install (locked)
        run: uv sync --locked --extra dev --extra all-providers --extra mcp --extra k8s --extra aws

      # The core package must import with NO vendor SDK present. providers.py imports them lazily,
      # and this proves it - otherwise a missing extra becomes an ImportError at startup for a
      # provider the user never asked for.
      - name: Core imports without any provider SDK
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/bare uv sync --locked
          /tmp/bare/bin/python -c "import warden; from warden.llm import LLMClient; LLMClient(mock=True); print('core imports clean')"

      - name: Lint
        run: ruff check src tests evals scripts scenarios

      # Runs against what git ACTUALLY tracks, so it answers "what is really on GitHub" rather
      # than "what did anyone mean to put there". Fails the build on a credential, an account id,
      # or a .env / .tfvars / .tfstate being tracked at all.
      - name: Nothing unpublishable is committed
        run: python scripts/check_publishable.py

      # In parallel across the runner's cores (pytest-xdist): 100 s on one core. Every test must stay
      # independent of the others - a test that needs another's state fails here first.
      - name: Unit tests
        run: pytest tests -q -n auto -rs

      - name: Eval gate
        run: pytest evals -q

      # ⛔ This used to be `run: warden demo` and nothing more. That asserts the process exited 0 -
      # not that it produced correct answers. A packaging bug once made every incident return
      # AUTO_SAFE inside the container and this step stayed green. Assert the OUTPUT.
      - name: Demo must produce the expected verdicts
        run: |
          out=$(warden demo)
          echo "$out"
          echo "$out" | grep -q "APPROVED_FOR_HUMAN" || { echo "::error::no APPROVED_FOR_HUMAN verdict"; exit 1; }
          # inc-003 is REJECTED since 2026-09-12: WARDEN's action table classifies a promoted
          # replica irreversible whatever the proposal claims, so P2 fires in prod. Stronger than
          # the escalation this replaces - the demo now shows a hard no.
          echo "$out" | grep -q "REJECTED"           || { echo "::error::no REJECTED verdict"; exit 1; }
          echo "$out" | grep -q "P6-BLAST-RADIUS"    || { echo "::error::P6 did not fire on inc-003"; exit 1; }
          test "$(echo "$out" | grep -c 'AUTO_SAFE')" -eq 1 || { echo "::error::expected exactly one AUTO_SAFE - fixtures probably missing"; exit 1; }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Same rule as above: the container must produce CORRECT output, not merely exit 0. This is
      # the job that missed a packaging bug where the installed wheel shipped no fixtures, so every
      # tool failed, context came back empty and all four incidents returned AUTO_SAFE.
      - name: Build the container and assert its output
        run: |
          # The host's network, not Docker's bridge: package downloads inside the build crawled at
          # ~20-60 KB/s on some runners (fifth review E, 2026-10-01) while the host fetched the same in seconds.
          docker build --network=host -t warden:ci .
          out=$(docker run --rm -e WARDEN_MOCK=1 -e WARDEN_TRACE=0 warden:ci demo)
          echo "$out"
          echo "$out" | grep -q "APPROVED_FOR_HUMAN" || { echo "::error::container produced no APPROVED_FOR_HUMAN"; exit 1; }
          echo "$out" | grep -q "REJECTED"           || { echo "::error::container produced no REJECTED"; exit 1; }
          test "$(echo "$out" | grep -c 'AUTO_SAFE')" -eq 1 || { echo "::error::container: expected exactly one AUTO_SAFE - fixtures missing from the wheel?"; exit 1; }

  # Against a REAL cluster. Every step here was first done by hand and read by eye; this job
  # replays it so it cannot regress. Assertions are on OUTPUT and on the API server's own answers,
  # never on exit codes alone. An adversarial review of the first version of this job found five
  # ways it could go green while a README claim was false; each has a named assertion below.
  #
  # ⚠ WHY k3d AND NOT EKS. This is the per-commit REGRESSION check, not the measurement. The
  # measurement is on managed EKS (EC2 node group, read-only ServiceAccount): Wave 2, 30 runs,
  # docs/bench/wave2-2026-09-24T115746Z. EKS on every push would cost money and ~25 minutes per
  # commit and put AWS credentials in a public repo's CI. k3d is a real API server - RBAC is really
  # enforced, the kubelet really OOM-kills - so what this job proves holds on any conformant cluster.
  k8s:
    name: k8s-regression (k3d, every push; measured on EKS in docs/bench)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # k3d's own images by digest, as every other image here (fifth review E): the node image is k3d 5.9.0's
    # default k3s, and k3d uses K3D_IMAGE_TOOLS as written for `k3d image import`.
    env:
      K3S_IMAGE: docker.io/rancher/k3s:v1.35.5-k3s1@sha256:2074403abe1bded11ef3dde09d457e13be8e0b64c218b1c4f8269b4565cfbc65
      K3D_IMAGE_TOOLS: ghcr.io/k3d-io/k3d-tools:5.9.0@sha256:c57abce697e66feeb826922718738fe186b47779312d49d4e51e6fb9b8a6f34d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The image builds in the background while the cluster starts and the job installs. The host's network,
      # not Docker's bridge: here the build's downloads crawled (3m49s-4m44s for 48 packages, fifth review E).
      - name: Start the image build
        run: |
          (docker build --network=host -t warden:local . > "$RUNNER_TEMP/build.log" 2>&1; echo $? > "$RUNNER_TEMP/build.rc") &

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          python-version: "3.13"
          activate-environment: true

      # Seconds with uv; pip took 98 s here (measured 2026-10-01).
      - name: Install with the k8s extra (locked)
        run: uv sync --locked --extra dev --extra k8s

      # A pinned release, checked against a pinned SHA-256 (audit A-I-24): the old step piped the
      # install script from k3d's main branch into bash on every push.
      - name: Install k3d (pinned, checksum verified)
        env:
          K3D_VERSION: v5.9.0
          K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
        run: |
          set -euo pipefail
          curl -fsSLo k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  k3d" | sha256sum -c -
          sudo install -m 0755 k3d /usr/local/bin/k3d
          k3d version

      - name: Create cluster
        run: |
          k3d cluster create warden-ci --image "$K3S_IMAGE" --no-lb --wait --timeout 300s
          # k3d reports the cluster before its API server serves: the first kubectl call got ServiceUnavailable
          # (CI on 71790df, 2026-10-01). Wait for /readyz, then fail loudly if it never came.
          for _ in $(seq 1 60); do kubectl get --raw /readyz >/dev/null 2>&1 && break; sleep 2; done
          kubectl get --raw /readyz
          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready node --all --timeout=120s

      # Started now, so its crash loop builds up while the checks below run (the wait took 24 s in line).
      - name: Start the synthetic OOM workload
        run: kubectl apply -f k8s/test/oom-workload.yaml

      - name: Validate manifests against the live API server - including the documented entry point
        run: |
          # Apply the durable parts FIRST: dry-running posture-probe.yaml needs the ServiceAccount
          # to exist, and the second apply -k needs the first to have happened.
          kubectl apply -k k8s/
          # The command the README tells users to run. A broken kustomization.yaml used to ship green.
          kubectl kustomize k8s/ | kubectl apply --dry-run=server -f -
          # The workload and the probe (server dry-run - the Job uses generateName, which
          # `apply` rejects; oom-workload and posture-probe are ordinary named objects).
          kubectl apply --dry-run=server -f k8s/test/oom-workload.yaml -f k8s/test/posture-probe.yaml
          # A Job with generateName cannot be `apply`-ed at all; `create --dry-run` is its check.
          kubectl create --dry-run=server -f k8s/job.yaml >/dev/null || { echo "::error::job.yaml failed server-side validation"; exit 1; }
          echo "job.yaml valid"
          # Idempotent: the second apply -k must change nothing.
          out=$(kubectl apply -k k8s/); echo "$out"
          echo "$out" | grep -qvE 'unchanged' && { echo "::error::second apply -k was not a no-op"; exit 1; } || true

      - name: Pod Security must REJECT a privileged pod in the warden namespace
        run: |
          # A positive test (the Job is admitted) cannot tell 'restricted is enforced' from 'the
          # label is mistyped'. This can.
          if kubectl apply --dry-run=server -f k8s/test/privileged-must-fail.yaml 2>err.txt; then
            echo "::error::a privileged pod was ACCEPTED - Pod Security is not enforced"; exit 1
          fi
          grep -qi "forbidden\|violates PodSecurity" err.txt || { echo "::error::rejected for the wrong reason:"; cat err.txt; exit 1; }
          echo "rejected as expected:"; cat err.txt

      # RBAC from the API server's point of view, BOTH directions, MINIMAL not just read-only.
      - name: RBAC must allow exactly the six reads the code makes
        run: |
          SA=system:serviceaccount:warden:warden
          # An empty answer is a failed request (a settling cluster, CI on 5fdcff4): asked again,
          # its error shown; only yes or no is ever accepted.
          ask() { for _ in 1 2 3; do r=$(kubectl auth can-i "$@" --as=$SA 2>can-i.err || true); [ -n "$r" ] && break; cat can-i.err >&2; sleep 2; done; echo "$r"; }
          allow() { r=$(ask "$@"); echo "$* -> $r"; [ "$r" = "yes" ] || { echo "::error::$* should be allowed"; exit 1; }; }
          allow list pods -n default
          # ⛔ NOT `get pods/log`: in kubectl's grammar TYPE/NAME means "a pod NAMED log", so that
          # form passed under the old over-broad role (which had `get pods`) for the WRONG reason
          # and fails under the minimal one. --subresource is the real question. Found by hand.
          allow get pods --subresource=log -n default
          allow list events -n default
          allow get deployments.apps -n default
          allow list replicasets.apps -n default
          allow list horizontalpodautoscalers.autoscaling -n default

      - name: RBAC must deny writes, unused read verbs, secrets, other namespaces and cluster scope
        run: |
          SA=system:serviceaccount:warden:warden
          ask() { for _ in 1 2 3; do r=$(kubectl auth can-i "$@" --as=$SA 2>can-i.err || true); [ -n "$r" ] && break; cat can-i.err >&2; sleep 2; done; echo "$r"; }
          deny() { r=$(ask "$@"); echo "$* -> $r"; [ "$r" = "no" ] || { echo "::error::$* must be denied"; exit 1; }; }
          # writes
          deny delete pods -n default
          deny create pods -n default
          deny deletecollection pods -n default
          deny create pods/exec -n default
          deny create pods/eviction -n default
          deny patch deployments.apps -n default
          deny update deployments.apps -n default
          deny delete deployments.apps -n default
          deny create secrets -n default
          # the sixth grant is a READ: an autoscaler must not be changeable through it
          deny patch horizontalpodautoscalers.autoscaling -n default
          deny update horizontalpodautoscalers.autoscaling -n default
          deny create horizontalpodautoscalers.autoscaling -n default
          deny delete horizontalpodautoscalers.autoscaling -n default
          # "minimal": reads the code does not make must ALSO be denied
          deny watch pods -n default
          deny get pods -n default
          deny watch events -n default
          deny list deployments.apps -n default
          deny get replicasets.apps -n default
          deny get horizontalpodautoscalers.autoscaling -n default
          deny watch horizontalpodautoscalers.autoscaling -n default
          deny list events.events.k8s.io -n default
          # secrets, other namespaces, cluster scope
          deny get secrets -n default
          deny list secrets -n default
          deny list pods -n kube-system
          deny list horizontalpodautoscalers.autoscaling -n kube-system
          deny list pods -n warden
          deny get nodes
          deny list namespaces

      - name: The WRITE path (live remediation) grants exactly patch+get on deployments, nothing else
        run: |
          # remediation-rbac.yaml is deliberately NOT in the default kustomization - the default deploy
          # stays read-only. Arming live remediation means applying this separately, and this proves
          # its boundary from the API server's own view, both directions.
          kubectl apply -f k8s/remediation-rbac.yaml
          SA=system:serviceaccount:warden:warden-remediator
          # An empty answer is a failed request (a settling cluster, CI on 5fdcff4): asked again,
          # its error shown; only yes or no is ever accepted.
          ask() { for _ in 1 2 3; do r=$(kubectl auth can-i "$@" --as=$SA 2>can-i.err || true); [ -n "$r" ] && break; cat can-i.err >&2; sleep 2; done; echo "$r"; }
          allow() { r=$(ask "$@"); echo "$* -> $r"; [ "$r" = "yes" ] || { echo "::error::$* should be allowed"; exit 1; }; }
          deny()  { r=$(ask "$@"); echo "$* -> $r"; [ "$r" = "no" ]  || { echo "::error::$* must be denied";  exit 1; }; }
          # exactly the two the backend calls
          allow patch deployments.apps -n default
          allow get   deployments.apps -n default
          # everything else is denied - including the destructive verbs, pods, secrets, other namespaces
          deny delete deployments.apps -n default
          deny update deployments.apps -n default
          deny list   deployments.apps -n default
          deny delete pods -n default
          deny create pods -n default
          deny patch  pods -n default
          deny get    secrets -n default
          deny patch  deployments.apps -n kube-system
          deny patch  deployments.apps -n warden

      - name: The OOM workload must be GENUINELY crash-looping
        run: |
          # The scenario is "a pod stuck in CrashLoopBackOff from OOM", not "a pod that died once".
          # One kill gives a fresh pod with thin evidence and the verifier correctly escalates it;
          # the proof of the APPROVED path needs the state an on-call engineer would actually see:
          # repeated OOMKilled, restarts >= 2, and a BackOff event on the record.
          reason=""; restarts=0
          for i in $(seq 1 48); do
            reason=$(kubectl get pod -l app=checkout -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}' 2>/dev/null || true)
            restarts=$(kubectl get pod -l app=checkout -o jsonpath='{.items[0].status.containerStatuses[0].restartCount}' 2>/dev/null || echo 0)
            echo "[$i] lastState.terminated.reason='$reason' restarts=$restarts"
            [ "$reason" = "OOMKilled" ] && [ "${restarts:-0}" -ge 2 ] && break
            sleep 5
          done
          [ "$reason" = "OOMKilled" ] && [ "${restarts:-0}" -ge 2 ] || { echo "::error::pod never reached OOMKilled with >=2 restarts"; kubectl describe pod -l app=checkout; exit 1; }
          kubectl get events -n default --field-selector reason=BackOff 2>/dev/null | grep -q checkout || { echo "::error::no BackOff event recorded for the workload"; exit 1; }
          kubectl get pods -l app=checkout
          # The kubelet's own record above is the proof. The log is shown for the reader, not asserted -
          # a non-interactive shell does not reliably print 'Killed'.
          kubectl logs -l app=checkout --tail=5 --previous 2>/dev/null || kubectl logs -l app=checkout --tail=5 || true

      - name: Integration tests against the live cluster - and they must have RUN, not skipped
        env:
          WARDEN_K8S_INTEGRATION: "1"
          WARDEN_TRACE: "0"
        run: |
          set -o pipefail
          # ⛔ The CLUSTER files by name, not the whole directory. `tests/integration` also holds the
          # database suite, which needs its own service containers and belongs to the `db` job - and
          # the zero-skips assertion below (the thing that stops a cluster test silently vanishing)
          # cannot tell "skipped because it is not this job's lane" from "skipped because the cluster
          # is missing". `tests/test_ci_lanes.py` asserts every integration file is claimed by a job,
          # so adding one here can never be forgotten.
          pytest tests/integration/test_live_cluster.py tests/integration/test_live_remediation.py -q -rs | tee it.txt
          grep -qE '^[0-9]+ passed' it.txt || { echo "::error::no integration test actually passed"; exit 1; }
          grep -qE ' skipped' it.txt && { echo "::error::integration tests skipped with the opt-in set"; exit 1; }
          echo "integration tests ran for real"

      - name: WARDEN from OUTSIDE the cluster - scale_up on an OOM crash loop is ESCALATED by P11
        env:
          WARDEN_BACKEND: k8s
          WARDEN_MOCK: "1"
          WARDEN_TRACE: "0"
        run: |
          out=$(warden run --incident inc-002 --verbose)
          echo "$out"
          echo "$out" | grep -q '"backend": "kubernetes"'   || { echo "::error::evidence did not come from the cluster"; exit 1; }
          echo "$out" | grep -q 'scale_up'                   || { echo "::error::expected scale_up"; exit 1; }
          # The workload is a single pod OOM-killed at startup: every pod is failing, so scaling out
          # cannot help and P11 escalates. Until 2026-09-25 this asserted APPROVED_FOR_HUMAN; the
          # first P11 keyed on pods_ready == 0 and fired here only when the read landed between
          # crashes (ready=1 outside the cluster, ready=0 inside, seconds apart). It now keys on
          # "every pod failing", which a back-off record proves whatever readiness says.
          echo "$out" | grep -q 'VERDICT            : ESCALATED'    || { echo "::error::expected ESCALATED"; exit 1; }
          echo "$out" | grep -q 'P11-ACTION-CONTRADICTS-EVIDENCE'   || { echo "::error::expected P11 to fire"; exit 1; }
          echo "$out" | grep -q '"tool_errors": \[\]'        || { echo "::error::a context tool failed or partially failed"; exit 1; }
          echo "$out" | grep -q 'TOOL-PARTIAL' && { echo "::error::a partial failure leaked into the output"; exit 1; } || true

      - name: Load the image into the cluster
        run: |
          # The build started at the top of the job; collect it.
          for _ in $(seq 1 600); do [ -f "$RUNNER_TEMP/build.rc" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/build.log" || true
          test "$(cat "$RUNNER_TEMP/build.rc" 2>/dev/null)" = 0 || { echo "::error::the image build failed or did not finish"; exit 1; }
          # ⛔ k3d's exit code is not proof. On two runs (d0bb8a4, f8fb972) `k3d image import` logged
          # "ERRO failed to import images in node 'k3d-warden-ci-server-0'", then "Successfully
          # imported" and exit 0 - the step went green with no image in the cluster, and the failure
          # surfaced three steps later as ErrImagePull on the posture probe. So: look in the node's own
          # container runtime, retry, and fail HERE, at the cause, if the image never arrives.
          present() { docker exec k3d-warden-ci-server-0 crictl images | grep -qE 'warden[[:space:]]+local'; }
          for attempt in 1 2 3; do
            k3d image import warden:local -c warden-ci || true
            if present; then echo "warden:local is in the node (attempt $attempt)"; break; fi
            echo "::warning::k3d reported the import but the image is not in the node (attempt $attempt)"
            sleep 3
          done
          present || { echo "::error::warden:local never reached the cluster node"; docker exec k3d-warden-ci-server-0 crictl images; exit 1; }

      - name: Runtime posture probe - what uid does the PROCESS run as, and can it write?
        run: |
          kubectl apply -f k8s/test/posture-probe.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/warden-posture-probe -n warden --timeout=120s || { kubectl describe pod warden-posture-probe -n warden; exit 1; }
          out=$(kubectl logs pod/warden-posture-probe -n warden)
          echo "$out"
          echo "$out" | grep -q '^uid=10001$'      || { echo "::error::process is not uid 10001"; exit 1; }
          echo "$out" | grep -q '^rootfs=READONLY$' || { echo "::error::root filesystem is writable"; exit 1; }

      - name: WARDEN from INSIDE the cluster, under the read-only ServiceAccount
        run: |
          # `create`, not `apply`: the Job uses generateName and is immutable once made.
          job=$(kubectl create -f k8s/job.yaml -o jsonpath='{.metadata.name}')
          echo "created job/$job"
          kubectl wait --for=condition=complete "job/$job" -n warden --timeout=180s || { kubectl describe "job/$job" -n warden; kubectl logs "job/$job" -n warden || true; exit 1; }
          out=$(kubectl logs "job/$job" -n warden)
          echo "$out"
          echo "$out" | grep -q '"backend": "kubernetes"' || { echo "::error::in-cluster run did not use the cluster backend"; exit 1; }
          echo "$out" | grep -q 'scale_up'                 || { echo "::error::in-cluster run did not propose scale_up"; exit 1; }
          echo "$out" | grep -q 'VERDICT            : ESCALATED' || { echo "::error::in-cluster verdict wrong"; exit 1; }
          echo "$out" | grep -q 'P11-ACTION-CONTRADICTS-EVIDENCE' || { echo "::error::in-cluster run: P11 did not fire"; exit 1; }
          echo "$out" | grep -q '"tool_errors": \[\]'      || { echo "::error::in-cluster run had tool errors"; exit 1; }
          # A second diagnosis must be creatable without deleting the first (the immutability finding).
          job2=$(kubectl create -f k8s/job.yaml -o jsonpath='{.metadata.name}')
          [ "$job2" != "$job" ] || { echo "::error::generateName did not mint a new Job"; exit 1; }
          echo "second diagnosis job/$job2 created alongside job/$job"

      # No teardown: the runner and its cluster are thrown away with the job.

  # Real databases, not stubs. Service containers give every push a PostgreSQL, MySQL, Redis,
  # MongoDB and SQL Server to run against, so "it terminates a stuck connection" is proven against the servers'
  # actual grammar and catalog views rather than against a recorded string.
  # Service images by digest (audit A-I-24), read 2026-10-01 from the registries. A tag can be moved to
  # other content; a digest cannot.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: warden
          POSTGRES_DB: warden
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warden" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: warden
          MYSQL_DATABASE: warden
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pwarden" --health-interval 5s
          --health-timeout 5s --health-retries 30
      redis:
        image: redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Warden!Passw0rd1"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        # SQL Server takes ~30s to come up: the health check runs sqlcmd from /opt/mssql-tools18 with a
        # 30s start period and 30 retries, and the tests themselves FAIL (never skip) if it is not
        # answering by then.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Warden!Passw0rd1' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30 --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          python-version: "3.13"
          activate-environment: true

      - name: Install with the database extras (locked)
        run: uv sync --locked --extra dev --extra postgres --extra mysql --extra redis --extra mongo --extra mssql

      # The core package must still import with NO database driver present - the drivers are lazily
      # imported inside each engine adapter, exactly like the provider SDKs.
      - name: Core imports without any database driver
        run: |
          UV_PROJECT_ENVIRONMENT=/tmp/bare-db uv sync --locked
          /tmp/bare-db/bin/python -c "from warden.database import DatabaseBackend; print('core imports clean without drivers')"

      - name: Integration tests against REAL databases - and they must have RUN, not skipped
        env:
          WARDEN_DB_INTEGRATION: "1"
          WARDEN_TEST_PG_DSN: postgresql://warden:warden@127.0.0.1:5432/warden
          WARDEN_TEST_MYSQL_DSN: mysql://root:warden@127.0.0.1:3306/warden
          WARDEN_TEST_REDIS_DSN: redis://127.0.0.1:6379/0
          WARDEN_TEST_MONGO_DSN: mongodb://127.0.0.1:27017/warden
          WARDEN_TEST_MSSQL_DSN: mssql://sa:Warden!Passw0rd1@127.0.0.1:1433/master
          WARDEN_TRACE: "0"
        run: |
          set -o pipefail
          pytest tests/integration/test_live_database.py -q -rs | tee db.txt
          grep -qE '^[0-9]+ passed' db.txt || { echo "::error::no database integration test actually passed"; exit 1; }
          # Every engine's DSN is set, so a skip here means an engine silently dropped out of the run.
          grep -qE ' skipped' db.txt && { echo "::error::an engine skipped despite its DSN being set"; exit 1; }
          echo "database integration tests ran for real, against all five engines"

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.16.4"

      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive

      # -backend=false: validate the configuration without needing AWS credentials or state.
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      # The proving ground is a separate root module, so the validate above never touched it. It
      # went in unvalidated once; a `count` on a resource whose outputs were read unconditionally
      # is exactly the kind of error that only shows up at apply time, on a real account, after
      # fifteen minutes of EKS.
      - name: Validate the proving ground
        run: |
          terraform -chdir=terraform/proving-ground init -backend=false
          terraform -chdir=terraform/proving-ground validate
