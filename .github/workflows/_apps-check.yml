name: "_ apps · check"

# Shared by CI · apps and every Deploy · <env>: lint, tests, every artifact built. No credentials.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # uv, pinned and checksum-verified, installs only what uv.lock lists - every version and hash
      # (audit A-I-9: unpinned pip installs ran while jobs held cloud credentials).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          python-version: "3.12"
          activate-environment: true
      - run: uv sync --locked --only-group apps-check --only-group scan
      - run: ruff check scenarios/fullstack scripts/deploy_fullstack_apps.py tests/test_deploy_fullstack_apps.py
      # What is deployed to AWS, audited and scanned here: the tool CI skips apps-only changes, and its
      # pip-audit reads uv.lock, not these files (fifth review E, 2026-10-01).
      - name: Deployed requirements with known vulnerabilities
        run: |
          for f in scenarios/fullstack/app/requirements.txt scenarios/fullstack/lambdas/*/requirements.txt; do
            echo "== $f"; pip-audit -r "$f" --require-hashes --disable-pip
          done
      - name: Python security lint of the deployed code
        run: bandit -q -r scenarios/fullstack scripts/deploy_fullstack_apps.py -ll
      - run: python -m compileall -q scenarios/fullstack
      # test_fullstack_infra also checks the k8s manifests and the apps' SQL/handlers.
      - run: pytest tests/test_deploy_fullstack_apps.py tests/test_fullstack_infra.py tests/test_supply_chain.py tests/test_k8s_tokens.py tests/test_redis_tls_r8.py tests/test_api_auth_ai13.py -q
      - name: build artifacts (zips + image)
        run: python scripts/deploy_fullstack_apps.py --out "$RUNNER_TEMP/build" build --tag "${GITHUB_SHA::12}"
      - name: render k8s/fullstack
        run: kubectl kustomize k8s/fullstack > /dev/null
