name: "Scan · workflows"

# Every workflow file is scanned on EVERY change. The tool pipeline (ci-tool.yml) is path-filtered so that
# infra and apps changes do not run it - and with it, the workflow scan used to be skipped for exactly
# the pipelines that hold cloud credentials (audit A-I-15).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: scan-workflows-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # uv, pinned and checksum-verified, installs only what uv.lock lists - every version and hash
      # (audit A-I-9: unpinned pip installs ran while jobs held cloud credentials).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          python-version: "3.13"
          activate-environment: true
      - name: Install (locked)
        run: uv sync --locked --extra dev --group scan
      - name: zizmor over every workflow
        run: zizmor --offline .github/workflows
      # The workflows' own structure (one deploy per environment, main only, no region, SHA pins,
      # every integration file run): a change to a deploy or shared workflow triggers only this scan.
      - name: Workflow structure tests
        run: |
          pytest tests/test_ci_lanes.py tests/test_fullstack_infra.py tests/test_supply_chain.py tests/test_terraform_versions.py tests/test_helios_gate_r56.py tests/test_runtime_pipeline_s9.py -q -rs
