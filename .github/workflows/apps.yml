# APPS pipeline for the Wave 4 stack: the code that runs on it (Lambdas, the container image,
# k8s/fullstack). Independent of the infra pipeline: it reads stack.json, never terraform.
#
# push / pull_request: lint, unit tests, build every artifact (zips + image). No credentials.
# workflow_dispatch:   deploy lambdas | ecs | k8s | all through GitHub OIDC - see infra.yml for
#                      the one-time owner setup per environment (role warden-<env>-deploy,
#                      bucket, GitHub Environment <env>). The EKS API must admit the runner:
#                      EKS_PUBLIC_CIDRS and EKS_ADMINS on that GitHub Environment (infra.yml).
# bootstrap-db is NOT here: it logs in as the master user postgres with an IAM token signed by the
# OPERATOR's own identity (rds-db:connect on dbuser:*/postgres), a grant the CI role does not have.
name: apps

on:
  push:
    paths:
      - "scenarios/fullstack/**"
      - "k8s/fullstack/**"
      - "scripts/deploy_fullstack_apps.py"
      - "tests/test_deploy_fullstack_apps.py"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/apps.yml"
  pull_request:
    paths:
      - "scenarios/fullstack/**"
      - "k8s/fullstack/**"
      - "scripts/deploy_fullstack_apps.py"
      - "tests/test_deploy_fullstack_apps.py"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/apps.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "what to deploy"
        type: choice
        options: [lambdas, ecs, k8s, all]
        default: all
      environment:
        description: "which environment (src/warden/data/environments.yaml)"
        type: choice
        options: [dev, staging, qa-staging, pre-prod, qa-prod, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: apps-${{ inputs.environment || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest pyyaml "psycopg[binary]" redis boto3 packaging
      - run: ruff check scenarios/fullstack scripts/deploy_fullstack_apps.py tests/test_deploy_fullstack_apps.py
      - run: python -m compileall -q scenarios/fullstack
      # test_fullstack_infra also checks the k8s manifests and the apps' SQL/handlers.
      - run: pytest tests/test_deploy_fullstack_apps.py tests/test_fullstack_infra.py -q
      - name: build artifacts (zips + image)
        run: python scripts/deploy_fullstack_apps.py --out "$RUNNER_TEMP/build" build --tag "${GITHUB_SHA::12}"
      - name: render k8s/fullstack
        run: kubectl kustomize k8s/fullstack > /dev/null

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ inputs.target }}
      WARDEN_ENV: ${{ inputs.environment }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml "psycopg[binary]" boto3 packaging
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ap-south-2
          mask-aws-account-id: true
      - name: fetch stack.json (published by the infra pipeline)
        run: aws s3 cp "s3://$BUCKET/fullstack/stack.json" "$RUNNER_TEMP/build/stack.json" --only-show-errors
      - name: build and deploy
        run: |
          OUT="$RUNNER_TEMP/build"
          if [ "$TARGET" != "all" ]; then
            python scripts/deploy_fullstack_apps.py --out "$OUT" build --tag "${GITHUB_SHA::12}"
          fi
          python scripts/deploy_fullstack_apps.py --out "$OUT" deploy "$TARGET" --tag "${GITHUB_SHA::12}"
      - name: publish stack.json (deploy ecs adds ecs_baseline_task_definition for the harness)
        if: env.TARGET == 'ecs' || env.TARGET == 'all'
        run: aws s3 cp "$RUNNER_TEMP/build/stack.json" "s3://$BUCKET/fullstack/stack.json" --only-show-errors
