# INFRA pipeline for the full stack (terraform/fullstack). One of three independent pipelines:
# infra (this), apps (apps.yml), and WARDEN's own CI (ci.yml).
#
# push / pull_request: fmt, init -backend=false, validate. No credentials, no AWS call.
# workflow_dispatch:   plan | apply | destroy of ONE environment (dev, staging, ... - the keys of
#                      src/warden/data/environments.yaml), through GitHub OIDC.
#
# ⛔ NO AWS KEYS ARE STORED ANYWHERE (v2 Phase 1.5). Per environment, the owner creates once, in the
# AWS console (docs/OWNER-CONSOLE-STEPS.md):
#   - the role warden-<env>-deploy from iam/<env>/{trust,deploy,boundary}.json. Its trust accepts
#     GitHub's token ONLY from this repository's GitHub environment of the same name;
#   - the SSM parameters /warden/<env>/tf/my_ip_cidr and /warden/<env>/tf/budget_email;
#   - a state bucket warden-<env>-tfstate-<random>.
# and in GitHub a GitHub Environment named <env> with the variables AWS_ROLE_ARN and TF_STATE_BUCKET
# (optional EKS_PUBLIC_CIDRS, EKS_ADMINS), and required reviewers for pre-prod, qa-prod and prod.
# No secrets: nothing personal or secret passes through GitHub.
#
# Aurora is created and destroyed by terraform/fullstack/aurora_express.py, not by terraform (the
# provider cannot create an express cluster): `create` after apply, `destroy` before destroy.
name: infra

on:
  push:
    paths:
      - "terraform/fullstack/**"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "terraform/fullstack/**"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply or destroy the full stack"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      environment:
        description: "which environment (src/warden/data/environments.yaml)"
        type: choice
        options: [dev, staging, qa-staging, pre-prod, qa-prod, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.environment || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      - run: terraform -chdir=terraform/fullstack fmt -check -recursive
      - run: terraform -chdir=terraform/fullstack init -backend=false -input=false
      - run: terraform -chdir=terraform/fullstack validate
      # The tool CI skips infra-only changes, so the infra checks run here: every name carries the
      # prefix, every role its boundary, alarm text names no cause, the policies fit their limits.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: pip install pytest pyyaml
      - run: pytest tests/test_fullstack_infra.py -q

  run:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      WARDEN_ENV: ${{ inputs.environment }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ap-south-2
          mask-aws-account-id: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - run: pip install boto3 # aurora_express.py: stdlib + boto3 only
      - name: optional variables
        env:
          CIDRS: ${{ vars.EKS_PUBLIC_CIDRS }}
          ADMINS: ${{ vars.EKS_ADMINS }}
        run: |
          if [ -n "$CIDRS" ]; then echo "TF_VAR_eks_public_access_cidrs=$CIDRS" >> "$GITHUB_ENV"; fi
          if [ -n "$ADMINS" ]; then echo "TF_VAR_eks_admin_principal_arns=$ADMINS" >> "$GITHUB_ENV"; fi
      - name: init with the S3 backend
        # backend_override.tf exists only on the runner: a local apply keeps local state.
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > terraform/fullstack/backend_override.tf
          terraform -chdir=terraform/fullstack init -input=false \
            -backend-config="bucket=$BUCKET" -backend-config="key=fullstack/terraform.tfstate" \
            -backend-config="region=ap-south-2" -backend-config="use_lockfile=true"
          # The environment IS the workspace; terraform refuses any other (main.tf precondition).
          terraform -chdir=terraform/fullstack workspace select -or-create "$WARDEN_ENV"
      - name: plan
        if: env.ACTION == 'plan'
        run: terraform -chdir=terraform/fullstack plan -input=false -no-color
      - name: apply and publish stack.json
        if: env.ACTION == 'apply'
        run: |
          terraform -chdir=terraform/fullstack apply -input=false -auto-approve -no-color
          # stack.json: every output EXCEPT the sensitive ones.
          terraform -chdir=terraform/fullstack output -json \
            | jq 'with_entries(select(.value.sensitive | not))' > "$RUNNER_TEMP/stack.json"
          # Aurora (express configuration) after the VPC exists; it merges its keys into stack.json.
          python terraform/fullstack/aurora_express.py create --stack "$RUNNER_TEMP/stack.json"
          aws s3 cp "$RUNNER_TEMP/stack.json" "s3://$BUCKET/fullstack/stack.json" --only-show-errors
      - name: destroy
        if: env.ACTION == 'destroy'
        run: |
          # Aurora first: terraform does not know it exists.
          python terraform/fullstack/aurora_express.py destroy
          terraform -chdir=terraform/fullstack destroy -input=false -auto-approve -no-color
          aws s3 rm "s3://$BUCKET/fullstack/stack.json" --only-show-errors || true
          aws resourcegroupstaggingapi get-resources --region ap-south-2 \
            --tag-filters Key=Project,Values=warden "Key=Environment,Values=$WARDEN_ENV" --query 'length(ResourceTagMappingList)'
