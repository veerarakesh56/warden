# INFRA pipeline for the Wave 4 stack (terraform/fullstack). One of three independent pipelines:
# infra (this), apps (apps.yml), and WARDEN's own CI (ci.yml).
#
# push / pull_request: fmt, init -backend=false, validate. No credentials, no AWS call.
# workflow_dispatch:   plan | apply | destroy against the real account, through GitHub OIDC.
#
# ⛔ NO AWS KEYS ARE STORED ANYWHERE. The owner creates, once, with admin credentials:
#   - an IAM OIDC provider for token.actions.githubusercontent.com, and a role named
#     warden-pg-fs-ci (the prefix matters: the boundary scopes IAM to warden-pg-*) that trusts it
#     for THIS repository only (sub = repo:<owner>/<repo>:environment:fullstack), carries the
#     WardenProvingGroundBoundary boundary, and has the WardenFullstackOperator policy
#     (terraform/fullstack/operator-policy-fullstack.json) attached;
#   - an S3 bucket warden-pg-fs-tfstate-<something> in ap-south-2 for state and stack.json;
#   - repository variables WARDEN_FS_DEPLOY_ROLE_ARN, WARDEN_FS_STATE_BUCKET, WARDEN_FS_MY_IP_CIDR,
#     optional WARDEN_FS_EKS_PUBLIC_CIDRS (JSON list) and WARDEN_FS_EKS_ADMINS (JSON list of ARNs);
#   - an environment `fullstack` (add required reviewers there) with the secret
#     WARDEN_FS_BUDGET_EMAIL (where the budget alarms go - a secret because it is personal).
#     There is no database password: Aurora runs in express configuration with IAM authentication
#     only (docs/WAVE4-FULLSTACK.md "Free-plan constraints", 2026-09-26).
#
# Aurora is created and destroyed by terraform/fullstack/aurora_express.py, not by terraform (the
# provider cannot create an express cluster): `create` after apply, `destroy` before destroy.
name: infra

on:
  push:
    paths:
      - "terraform/fullstack/**"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "terraform/fullstack/**"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply or destroy the full stack"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read

concurrency:
  group: infra-fullstack
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform/fullstack fmt -check -recursive
      - run: terraform -chdir=terraform/fullstack init -backend=false -input=false
      - run: terraform -chdir=terraform/fullstack validate
      # The tool CI skips infra-only changes, so the infra checks run here: every name carries the
      # prefix, every role its boundary, alarm text names no cause, the policies fit their limits.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pyyaml
      - run: pytest tests/test_fullstack_infra.py -q

  run:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: fullstack
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      BUCKET: ${{ vars.WARDEN_FS_STATE_BUCKET }}
      TF_VAR_my_ip_cidr: ${{ vars.WARDEN_FS_MY_IP_CIDR }}
      TF_VAR_budget_email: ${{ secrets.WARDEN_FS_BUDGET_EMAIL }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WARDEN_FS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3 # aurora_express.py: stdlib + boto3 only
      - name: optional variables
        env:
          CIDRS: ${{ vars.WARDEN_FS_EKS_PUBLIC_CIDRS }}
          ADMINS: ${{ vars.WARDEN_FS_EKS_ADMINS }}
        run: |
          if [ -n "$CIDRS" ]; then echo "TF_VAR_eks_public_access_cidrs=$CIDRS" >> "$GITHUB_ENV"; fi
          if [ -n "$ADMINS" ]; then echo "TF_VAR_eks_admin_principal_arns=$ADMINS" >> "$GITHUB_ENV"; fi
      - name: init with the S3 backend
        # backend_override.tf exists only on the runner: a local apply keeps local state.
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > terraform/fullstack/backend_override.tf
          terraform -chdir=terraform/fullstack init -input=false \
            -backend-config="bucket=$BUCKET" -backend-config="key=fullstack/terraform.tfstate" \
            -backend-config="region=ap-south-2" -backend-config="use_lockfile=true"
      - name: plan
        if: env.ACTION == 'plan'
        run: terraform -chdir=terraform/fullstack plan -input=false -no-color
      - name: apply and publish stack.json
        if: env.ACTION == 'apply'
        run: |
          terraform -chdir=terraform/fullstack apply -input=false -auto-approve -no-color
          # stack.json: every output EXCEPT the sensitive ones.
          terraform -chdir=terraform/fullstack output -json \
            | jq 'with_entries(select(.value.sensitive | not))' > "$RUNNER_TEMP/stack.json"
          # Aurora (express configuration) after the VPC exists; it merges its keys into stack.json.
          python terraform/fullstack/aurora_express.py create --stack "$RUNNER_TEMP/stack.json"
          aws s3 cp "$RUNNER_TEMP/stack.json" "s3://$BUCKET/fullstack/stack.json" --only-show-errors
      - name: destroy
        if: env.ACTION == 'destroy'
        run: |
          # Aurora first: terraform does not know it exists.
          python terraform/fullstack/aurora_express.py destroy
          terraform -chdir=terraform/fullstack destroy -input=false -auto-approve -no-color
          aws s3 rm "s3://$BUCKET/fullstack/stack.json" --only-show-errors || true
          aws resourcegroupstaggingapi get-resources --region ap-south-2 \
            --tag-filters Key=Project,Values=warden-fullstack --query 'length(ResourceTagMappingList)'
