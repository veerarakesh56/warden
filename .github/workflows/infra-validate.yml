name: "_ infra · validate"

# Shared by CI · infra and every Deploy · <env>: a plan or an apply never runs on Terraform that fails
# these checks. The steps are infra/'s composite action (infra/.github/actions/validate).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/infra/.github/actions/validate
