name: "CI · infra"

# infra/: every stack the deploys apply (fullstack, undo-lab, the runtime and its module), the IAM they run under and
# the scripts that render or check them - fmt, validate and the infra tests on every change - and WARDEN's plan gate
# run for real on Helios built from helios/. The root stack and the proving ground are CI · tool's terraform job. No
# credentials, no AWS call. Changing an environment: Deploy · <env>. The steps are infra/'s composite actions
# (infra/.github/actions/*).
on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/fullstack/**"
      - "infra/terraform/undo-lab/**"
      - "infra/terraform/modules/**"
      - "infra/terraform/runtime/**"
      - "infra/iam/**"
      - "infra/scripts/render_env_iam.py"
      - "infra/scripts/pause_resume.py"
      - "infra/scripts/helios_gate.py"
      - "infra/.github/actions/validate/**"
      - "infra/.github/actions/helios-gate/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/infra-validate.yml"
      # Its jobs install from these: a stale lock must run them (2026-10-01: it did not, so a lock
      # older than pyproject.toml stayed hidden until an apps or infra path changed).
      - "warden/uv.lock"
      - "warden/pyproject.toml"
      # The tests of infra's rules live with WARDEN's (warden/tests); each one the check runs is a trigger here.
      - "warden/tests/test_runtime_pipeline_s9.py"
      - "warden/tests/test_destroy_permissions.py"
      - "warden/tests/test_pause_resume.py"
      - "warden/tests/test_runtime_module_g6.py"
      - "warden/tests/test_fullstack_infra.py"
      - "warden/tests/test_aws_stack.py"
      - "warden/tests/test_docs_honesty.py"
      - "warden/tests/test_supply_chain.py"
      - "warden/tests/test_terraform_versions.py"
      - "warden/tests/test_env_iam.py"
      - "warden/tests/test_runtime_iam_g6.py"
      - "warden/tests/test_actor_use_g6.py"
      - "warden/tests/test_redis_tls_r8.py"
      - "warden/tests/test_api_auth_ai13.py"
      - "warden/tests/test_runtime_network_g6.py"
      - "warden/tests/test_backups.py"
      - "warden/tests/test_iac_hardening_sonar.py"
      - "warden/tests/test_iac_leftovers_sonar.py"
      - "warden/tests/test_stack_paths_s2083.py"
      - "warden/tests/test_helios_gate_r56.py"
      - "warden/tests/test_platform_iam_g6.py"
      - "warden/tests/test_aws_platform_g6.py"
      - "warden/tests/integration/test_helios_gate_live.py"
      - "warden/src/warden/paths.py"  # helios_gate.py and aurora_express.py import it
      - "warden/src/warden/platforms/aws.py"
      - "warden/src/warden/data/environments.yaml"
      # The plan gate runs Helios built from helios/: a change to what the binary is built from runs the gate job.
      - "helios/Cargo.toml"
      - "helios/Cargo.lock"
      - "helios/rust-toolchain.toml"
      - "helios/.cargo/**"
      - "helios/crates/**"
      - "helios/scripts/fetch_z3.py"
  # Pull requests into main only (2026-10-16): dev and prod receive commits main has already checked.
  pull_request:
    # A draft pull request runs no CI (owner, 2026-10-21: the Actions queue was the bottleneck); it runs when it is
    # marked ready for review, and on every push after that.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "infra/terraform/fullstack/**"
      - "infra/terraform/undo-lab/**"
      - "infra/terraform/modules/**"
      - "infra/terraform/runtime/**"
      - "infra/iam/**"
      - "infra/scripts/render_env_iam.py"
      - "infra/scripts/pause_resume.py"
      - "infra/scripts/helios_gate.py"
      - "infra/.github/actions/validate/**"
      - "infra/.github/actions/helios-gate/**"
      - ".github/workflows/infra-ci.yml"
      - ".github/workflows/infra-validate.yml"
      # Its jobs install from these: a stale lock must run them (2026-10-01: it did not, so a lock
      # older than pyproject.toml stayed hidden until an apps or infra path changed).
      - "warden/uv.lock"
      - "warden/pyproject.toml"
      # The tests of infra's rules live with WARDEN's (warden/tests); each one the check runs is a trigger here.
      - "warden/tests/test_runtime_pipeline_s9.py"
      - "warden/tests/test_destroy_permissions.py"
      - "warden/tests/test_pause_resume.py"
      - "warden/tests/test_runtime_module_g6.py"
      - "warden/tests/test_fullstack_infra.py"
      - "warden/tests/test_aws_stack.py"
      - "warden/tests/test_docs_honesty.py"
      - "warden/tests/test_supply_chain.py"
      - "warden/tests/test_terraform_versions.py"
      - "warden/tests/test_env_iam.py"
      - "warden/tests/test_runtime_iam_g6.py"
      - "warden/tests/test_actor_use_g6.py"
      - "warden/tests/test_redis_tls_r8.py"
      - "warden/tests/test_api_auth_ai13.py"
      - "warden/tests/test_runtime_network_g6.py"
      - "warden/tests/test_backups.py"
      - "warden/tests/test_iac_hardening_sonar.py"
      - "warden/tests/test_iac_leftovers_sonar.py"
      - "warden/tests/test_stack_paths_s2083.py"
      - "warden/tests/test_helios_gate_r56.py"
      - "warden/tests/test_platform_iam_g6.py"
      - "warden/tests/test_aws_platform_g6.py"
      - "warden/tests/integration/test_helios_gate_live.py"
      - "warden/src/warden/paths.py"  # helios_gate.py and aurora_express.py import it
      - "warden/src/warden/platforms/aws.py"
      - "warden/src/warden/data/environments.yaml"
      # The plan gate runs Helios built from helios/: a change to what the binary is built from runs the gate job.
      - "helios/Cargo.toml"
      - "helios/Cargo.lock"
      - "helios/rust-toolchain.toml"
      - "helios/.cargo/**"
      - "helios/crates/**"
      - "helios/scripts/fetch_z3.py"

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: $/.github/workflows/infra-validate.yml

  # WARDEN's Helios gate (infra/scripts/helios_gate.py, register R56) against the Helios this repository builds -
  # the binary every deploy builds from helios/ - on real plans: it must allow an unchanged stack and refuse a broken
  # plan. warden/tests/integration/test_helios_gate_live.py runs here only, and must run, not skip.
  helios-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/infra/.github/actions/helios-gate
