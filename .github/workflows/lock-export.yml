name: "Temp · lock export (never merged)"

# Throwaway (cloud session, 2026-10-20): uv lock needs download.pytorch.org, which the cloud sandbox cannot reach. This
# relocks one package on a runner (uv 0.12.21: keeps the lock format, revision 3, that main has) and prints the uv.lock diff into the log; the cloud session applies that diff in a
# normal PR. Read-only token, no secrets, pinned uv with its checksum.
on:
  push:
    branches: [sonar-export]
    paths: [".github/workflows/lock-export.yml"]

permissions:
  contents: read

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: 3df3e2e4e2214378ac3edb94deb3eaac81177a03
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
          checksum: "23f02075b652bb1df64178cfae41b5caf160822e720e2663568f3f5d63bc52c0"
          python-version: "3.13"
      - name: Relock lane DW's 2026-10-21 Dependabot bumps and print the diff
        run: |
          git rev-parse HEAD
          uv lock --upgrade-package google-genai==2.30.1 --upgrade-package hypothesis==6.169.1 --upgrade-package aiohttp==3.14.5
          uv lock --check
          echo "=== LOCK-DIFF-BEGIN"
          git diff --no-color uv.lock | base64 -w 0
          echo
          echo "=== LOCK-DIFF-END"
          git diff --stat
