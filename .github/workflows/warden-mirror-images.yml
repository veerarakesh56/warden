name: "Mirror · base images"

# Copies each base and service image CI and the Dockerfiles use, BY DIGEST, from AWS's public mirror into this
# repository's GitHub Container Registry. Anonymous pulls from public.ecr.aws on GitHub's shared runners failed six
# times with "429 toomanyrequests: Data limit exceeded" (2026-10-10 to 2026-10-15); a package this repository's
# workflow pushes takes the repository's visibility (public), and the pin by digest means the same bytes from either
# registry. Run it by hand when a digest changes; warden/tests/test_base_image_mirror.py holds the list and the
# references equal. The step is warden/'s composite action (warden/.github/actions/mirror-images).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # name:tag@digest - one per line; the target is ghcr.io/<owner>/warden-mirror/<name>:<tag>, digest kept. A name
      # with a "/" is Docker Hub's (rancher/k3s, which AWS's mirror does not carry); the others are Docker's official
      # images from public.ecr.aws.
      IMAGES: |
        python:3.13-slim@sha256:7c61056e61ac89e852de05f3dc6fa51a6dd2181797bceed46aa725dd7cb2cd3b
        postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        redis:7@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
        mongo:7@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
        rancher/k3s:v1.35.5-k3s1@sha256:2074403abe1bded11ef3dde09d457e13be8e0b64c218b1c4f8269b4565cfbc65
      OWNER: ${{ github.repository_owner }}
      ACTOR: ${{ github.actor }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # A runner's checkout is needed only for the step's own file (warden/.github/actions/mirror-images); the
      # token is not kept in it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/warden/.github/actions/mirror-images
