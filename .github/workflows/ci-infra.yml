name: "CI · infra"

# The full stack's Terraform (terraform/fullstack), checked on every change to it: fmt, validate and the
# infra tests. No credentials, no AWS call. Changing an environment: Deploy · <env>.
on:
  push:
    branches: [main]
    paths:
      - "terraform/fullstack/**"
      - "terraform/undo-lab/**"
      - "terraform/modules/**"
      - "terraform/runtime/**"
      - "tests/test_runtime_pipeline_s9.py"
      - "tests/test_destroy_permissions.py"
      - "tests/test_pause_resume.py"
      - "scripts/pause_resume.py"
      - "tests/test_runtime_module_g6.py"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/ci-infra.yml"
      - ".github/workflows/_infra-validate.yml"
      # Its jobs install from these: a stale lock must run them (2026-10-01: it did not, so a lock
      # older than pyproject.toml stayed hidden until an apps or infra path changed).
      - "uv.lock"
      - "pyproject.toml"
      - "tests/test_aws_stack.py"
      - "tests/test_docs_honesty.py"
      - "tests/test_supply_chain.py"
      - "tests/test_terraform_versions.py"
      - "tests/test_env_iam.py"
      - "tests/test_runtime_iam_g6.py"
      - "tests/test_actor_use_g6.py"
      - "tests/test_redis_tls_r8.py"
      - "tests/test_api_auth_ai13.py"
      - "tests/test_runtime_network_g6.py"
      - "tests/test_backups.py"
      - "tests/test_iac_hardening_sonar.py"
      - "tests/test_iac_leftovers_sonar.py"
      - "tests/test_stack_paths_s2083.py"
      - "tests/test_aws_architecture_diagram.py"
      - "docs/diagrams/aws-architecture.*"
      - "tests/test_helios_gate_r56.py"
      - "scripts/helios_gate.py"
      - "src/warden/paths.py"  # helios_gate.py and aurora_express.py import it
      - "tests/test_platform_iam_g6.py"
      - "tests/test_aws_platform_g6.py"
      - "src/warden/platforms/aws.py"
      - "iam/**"
      - "scripts/render_env_iam.py"
      - "src/warden/data/environments.yaml"
  # Pull requests into main only (2026-10-16): dev and prod receive commits main has already checked.
  pull_request:
    # A draft pull request runs no CI (owner, 2026-10-21: the Actions queue was the bottleneck); it runs when it is
    # marked ready for review, and on every push after that.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "terraform/fullstack/**"
      - "terraform/undo-lab/**"
      - "terraform/modules/**"
      - "terraform/runtime/**"
      - "tests/test_runtime_pipeline_s9.py"
      - "tests/test_destroy_permissions.py"
      - "tests/test_pause_resume.py"
      - "scripts/pause_resume.py"
      - "tests/test_runtime_module_g6.py"
      - "tests/test_fullstack_infra.py"
      - ".github/workflows/ci-infra.yml"
      - ".github/workflows/_infra-validate.yml"
      # Its jobs install from these: a stale lock must run them (2026-10-01: it did not, so a lock
      # older than pyproject.toml stayed hidden until an apps or infra path changed).
      - "uv.lock"
      - "pyproject.toml"
      - "tests/test_aws_stack.py"
      - "tests/test_docs_honesty.py"
      - "tests/test_supply_chain.py"
      - "tests/test_terraform_versions.py"
      - "tests/test_env_iam.py"
      - "tests/test_runtime_iam_g6.py"
      - "tests/test_actor_use_g6.py"
      - "tests/test_redis_tls_r8.py"
      - "tests/test_api_auth_ai13.py"
      - "tests/test_runtime_network_g6.py"
      - "tests/test_backups.py"
      - "tests/test_iac_hardening_sonar.py"
      - "tests/test_iac_leftovers_sonar.py"
      - "tests/test_stack_paths_s2083.py"
      - "tests/test_aws_architecture_diagram.py"
      - "docs/diagrams/aws-architecture.*"
      - "tests/test_helios_gate_r56.py"
      - "scripts/helios_gate.py"
      - "src/warden/paths.py"  # helios_gate.py and aurora_express.py import it
      - "tests/test_platform_iam_g6.py"
      - "tests/test_aws_platform_g6.py"
      - "src/warden/platforms/aws.py"
      - "iam/**"
      - "scripts/render_env_iam.py"
      - "src/warden/data/environments.yaml"

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: $/.github/workflows/_infra-validate.yml
