name: "Runtime · ops"

# WARDEN's own runtime (G6): the tool's pipeline, apart from the infra and apps pipelines (owner requirement R13).
# CI first (owner, 2026-10-21): every action - image, plan, apply, restart, pause, resume - runs only after WARDEN's
# own checks and scans (the `ci-check` and `ci-security` jobs, the steps CI · tool runs) pass for this same commit, in this
# same run; nothing is built, signed or deployed otherwise. The steps are warden/'s composite actions
# (warden/.github/actions/*); the guards, the role, the registry login and the attestation stay here (they read the
# environment's secrets, which a composite action cannot).
# By hand, from the branch dev only - environments.yaml `github.runtime_branch` (owner, 2026-10-16: main deploys
# nothing; the runtime runs code that has reached dev, until prod exists) - into the GitHub Environment `ops`
# (deployment branch: dev only; required reviewer; its secrets AWS_ROLE_ARN - the role
# warden-ops-deploy - and RUNTIME_ECR_REPOSITORY - the image repository, immutable tags - and its variables AWS_REGION
# and TF_STATE_BUCKET: docs/SETUP.md). Both hold the account id, so both are secrets: GitHub prints a
# variable unmasked in a step's inputs before any masking runs, in a public repository's logs (2026-10-16).
#   image: build warden/Dockerfile.runtime BEFORE the job holds credentials, push it by the commit's SHA, sign its digest
#          with cosign (keyless: this workflow's own GitHub identity) and attest how it was built (register S9).
#   plan / apply: verify that signature and attestation, then plan or apply infra/terraform/runtime with that digest -
#          an image this workflow did not build and sign is never deployed.
#   restart: a fresh deployment of every zone's service, no image and no plan - after a secret is set or rotated (a
#          worker reads its secrets when it starts).
#   pause / resume (owner update 5, 2026-10-17): pause snapshots the audit database (available before anything else
#          happens), sets SSM tf/paused=true and applies (no compute, no NAT, no alarm intake, no self-pages), then
#          STOPS the database and reports what stays and its cost. resume starts the database (refusing to recreate a
#          deleted one empty while a pause snapshot of it exists), sets tf/paused=false and applies, migrates and checks
#          every zone, as apply does. Nothing is deleted, no snapshot ever.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "image only, or image then plan / apply the runtime; restart: redeploy the zone services; pause / resume (keeps the audit)"
        type: choice
        options: [image, plan, apply, restart, pause, resume]
        default: image

permissions:
  contents: read

concurrency:
  group: runtime-ops
  cancel-in-progress: false

env:
  # WARDEN's own environment: environments.yaml `runtime` (warden/tests/test_no_hardcoding_r17.py holds the two equal, and
  # every `environment:` key below with them). Named once for the steps' shell lines.
  RUNTIME_ENV: ops

jobs:
  # WARDEN's own CI, for this commit, before anything is built or deployed (the same steps as CI · tool's `check`
  # and `security`; named apart so CI · tool's check runs keep names of their own).
  ci-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WARDEN_MOCK: "1"
    steps:
      - name: Runtime deploys run from the runtime branch only
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::the runtime is built and deployed from the branch dev only, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/warden/.github/actions/check
        with:
          cache_suffix: "runtime-check"

  ci-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Runtime deploys run from the runtime branch only
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::the runtime is built and deployed from the branch dev only, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: $/warden/.github/actions/security
        with:
          cache_suffix: "runtime-security"

  image:
    if: inputs.action != 'restart'
    needs: [ci-check, ci-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ops
    permissions:
      contents: read
      id-token: write      # AWS (OIDC) and cosign's keyless signature
      attestations: write  # the build provenance
    outputs:
      # The digest alone: the repository's address holds the account id, which the job masks, and GitHub drops an output
      # holding a masked value - the deploy job rebuilt nothing from an empty image (2026-10-09).
      digest: ${{ steps.publish.outputs.digest }}
    env:
      REPOSITORY: ${{ secrets.RUNTIME_ECR_REPOSITORY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Runtime deploys run from the runtime branch only
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::the runtime is built and deployed from the branch dev only, not $GITHUB_REF"
          exit 1
      - name: The environment names its repository and region
        run: |
          test -n "$REPOSITORY" || { echo "::error::set RUNTIME_ECR_REPOSITORY on the ops environment"; exit 1; }
          test -n "$AWS_REGION" || { echo "::error::set AWS_REGION on the ops environment"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # every branch: the promotion check reads the upstream one
      # As in the deploys (infra-deploy.yml, 2026-10-16): only a commit promoted onto dev from main is built, before
      # the job holds the Hugging Face token or any AWS credential. The plan and apply job builds on this one.
      # Built before the job holds any credential: nothing the build runs can reach AWS. The Hugging Face token (the
      # ops environment's secret HF_TOKEN: the owner's read token for the gated Prompt Guard 2) is a BuildKit secret,
      # mounted for the one step that fetches the tripwire's weights and kept in no layer (register R47).
      - uses: $/warden/.github/actions/runtime-image-build
        with:
          hf_token: ${{ secrets.HF_TOKEN }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - uses: $/warden/.github/actions/runtime-image-publish
        id: publish
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: steps.publish.outputs.existing != 'true' || steps.publish.outputs.signed != 'true'
        with:
          subject-name: ${{ secrets.RUNTIME_ECR_REPOSITORY }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  deploy:
    if: inputs.action != 'image' && inputs.action != 'restart'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ops
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      IMAGE: ${{ secrets.RUNTIME_ECR_REPOSITORY }}@${{ needs.image.outputs.digest }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # The identity that signed it: this workflow, on the runtime branch, in this repository - nothing else is deployed.
      SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/warden-runtime-deploy.yml@refs/heads/dev
      REPO: ${{ github.repository }}
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Runtime deploys run from the runtime branch only
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::the runtime is built and deployed from the branch dev only, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # pause / resume run infra/scripts/pause_resume.py (stdlib + boto3): uv, pinned and checksum-verified, installs only
      # what uv.lock lists, without a cache, before the job holds any credential - as in infra-deploy.yml.
      - uses: $/warden/.github/actions/runtime-tools
        if: env.ACTION == 'pause' || env.ACTION == 'resume'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200  # the role allows 2 h: creating the audit database takes most of one
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - uses: $/warden/.github/actions/runtime-deploy
        with:
          keep_snapshots: ${{ vars.PAUSE_KEEP_SNAPSHOTS || '3' }}

  restart:
    if: inputs.action == 'restart'
    needs: [ci-check, ci-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ops
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Runtime deploys run from the runtime branch only
        if: github.ref != 'refs/heads/dev'
        run: |
          echo "::error::the runtime is built and deployed from the branch dev only, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      # The same task definitions, started again: each worker reads its secrets at start. Fails unless every
      # service is stable again - a worker that cannot start is reported here, not found later.
      - uses: $/warden/.github/actions/runtime-restart
