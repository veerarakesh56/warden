name: "_ apps · deploy"

# Deploy lambdas | ecs | k8s | all to ONE environment through GitHub OIDC. Called only by Deploy · <env>.
# It reads stack.json (published by the infra deploy), never terraform. The EKS API must admit the
# runner: EKS_PUBLIC_CIDRS and EKS_ADMINS on that GitHub Environment. bootstrap-db is NOT here: it logs
# in as the master user with an IAM token signed by the OPERATOR's own identity, a grant this role lacks.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      target:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ inputs.target }}
      WARDEN_ENV: ${{ inputs.environment }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Deploys run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::deploys run from main only (audit A-I-10)"
          exit 1
      - name: A known target
        run: |
          case "$TARGET" in lambdas|ecs|k8s|all) ;; *) echo "::error::unknown target: $TARGET"; exit 1 ;; esac
      - name: The environment names its region
        run: |
          test -n "$AWS_REGION" || { echo "::error::set the variable AWS_REGION on this GitHub Environment"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml "psycopg[binary]" boto3 packaging
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: fetch stack.json (published by the infra deploy)
        run: aws s3 cp "s3://$BUCKET/fullstack/stack.json" "$RUNNER_TEMP/build/stack.json" --only-show-errors
      - name: build and deploy
        run: |
          OUT="$RUNNER_TEMP/build"
          if [ "$TARGET" != "all" ]; then
            python scripts/deploy_fullstack_apps.py --out "$OUT" build --tag "${GITHUB_SHA::12}"
          fi
          python scripts/deploy_fullstack_apps.py --out "$OUT" deploy "$TARGET" --tag "${GITHUB_SHA::12}"
      - name: publish stack.json (deploy ecs adds ecs_baseline_task_definition for the harness)
        if: env.TARGET == 'ecs' || env.TARGET == 'all'
        run: aws s3 cp "$RUNNER_TEMP/build/stack.json" "s3://$BUCKET/fullstack/stack.json" --only-show-errors
