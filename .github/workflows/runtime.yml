name: "Runtime · ops"

# WARDEN's own runtime (G6): the tool's pipeline, apart from the infra and apps pipelines (owner requirement R13).
# By hand, from main only, into the GitHub Environment `ops` (required reviewer; its variables AWS_ROLE_ARN - the
# role warden-ops-deploy - AWS_REGION, TF_STATE_BUCKET and RUNTIME_ECR_REPOSITORY - the image repository, immutable
# tags - which the owner creates once: docs/OWNER-CONSOLE-STEPS.md).
#   image: build Dockerfile.runtime BEFORE the job holds credentials, push it by the commit's SHA, sign its digest
#          with cosign (keyless: this workflow's own GitHub identity) and attest how it was built (register S9).
#   plan / apply: verify that signature and attestation, then plan or apply terraform/runtime with that digest -
#          an image this workflow did not build and sign is never deployed.
#   restart: a fresh deployment of every zone's service, no image and no plan - after a secret is set or rotated (a
#          worker reads its secrets when it starts).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "image only, or image then plan / apply the runtime; restart: redeploy the zone services"
        type: choice
        options: [image, plan, apply, restart]
        default: image

permissions:
  contents: read

concurrency:
  group: runtime-ops
  cancel-in-progress: false

env:
  # WARDEN's own environment: environments.yaml `runtime` (tests/test_no_hardcoding_r17.py holds the two equal, and
  # every `environment:` key below with them). Named once for the steps' shell lines.
  RUNTIME_ENV: ops

jobs:
  image:
    if: inputs.action != 'restart'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ops
    permissions:
      contents: read
      id-token: write      # AWS (OIDC) and cosign's keyless signature
      attestations: write  # the build provenance
    outputs:
      # The digest alone: the repository's address holds the account id, which the job masks, and GitHub drops an output
      # holding a masked value - the deploy job rebuilt nothing from an empty image (2026-10-09).
      digest: ${{ steps.push.outputs.digest }}
    env:
      REPOSITORY: ${{ vars.RUNTIME_ECR_REPOSITORY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Runtime deploys run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::the runtime is built and deployed from main only"
          exit 1
      - name: The environment names its repository and region
        run: |
          test -n "$REPOSITORY" || { echo "::error::set RUNTIME_ECR_REPOSITORY on the ops environment"; exit 1; }
          test -n "$AWS_REGION" || { echo "::error::set AWS_REGION on the ops environment"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Built before the job holds any credential: nothing the build runs can reach AWS. The Hugging Face token (the
      # ops environment's secret HF_TOKEN: the owner's read token for the gated Prompt Guard 2) is a BuildKit secret,
      # mounted for the one step that fetches the tripwire's weights and kept in no layer (register R47).
      - name: Build the runtime image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::set the secret HF_TOKEN on the ops environment"; exit 1; }
          docker build --network=host --secret id=hf_token,env=HF_TOKEN -f Dockerfile.runtime -t "warden-runtime:$GITHUB_SHA" .
          # The image that is deployed carries the detector's weights (register R47).
          docker run --rm --entrypoint /opt/warden/bin/python "warden-runtime:$GITHUB_SHA" -c \
            "import pathlib; assert any(pathlib.Path('/opt/hf').rglob('model.safetensors')), 'no tripwire weights'"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - name: Push it by the commit's SHA and read its digest
        id: push
        # Tags are immutable: a commit an earlier run already pushed (a plan, then an apply) keeps that run's image, and
        # its signature - the deploy job verifies it either way, so an image pushed but never signed is still refused.
        run: |
          if digest=$(aws ecr describe-images --repository-name "${REPOSITORY#*/}" --image-ids imageTag="$GITHUB_SHA" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            docker tag "warden-runtime:$GITHUB_SHA" "$REPOSITORY:$GITHUB_SHA"
            docker push "$REPOSITORY:$GITHUB_SHA"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY:$GITHUB_SHA" | cut -d@ -f2)
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "Runtime image: \`$REPOSITORY@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Did the run that pushed this image also sign and attest it
        id: check
        if: steps.push.outputs.existing == 'true'
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/runtime.yml@refs/heads/main
          GH_TOKEN: ${{ github.token }}
        # A run that pushed and then died before signing (2026-10-12: the signing tool's download answered 504) left
        # its commit undeployable: the tag is immutable, and every later run skipped the signing of an image it found.
        # Such an image is signed and attested by this run; one already signed and attested is left as it is.
        run: |
          if cosign verify "$IMAGE" --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null 2>&1 &&
             gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign the digest (keyless)
        if: steps.push.outputs.existing != 'true' || steps.check.outputs.signed != 'true'
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: cosign sign --yes "$IMAGE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: steps.push.outputs.existing != 'true' || steps.check.outputs.signed != 'true'
        with:
          subject-name: ${{ vars.RUNTIME_ECR_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    if: inputs.action != 'image' && inputs.action != 'restart'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ops
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      IMAGE: ${{ vars.RUNTIME_ECR_REPOSITORY }}@${{ needs.image.outputs.digest }}
      BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      # The identity that signed it: this workflow, on main, in this repository - nothing else is deployed.
      SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/runtime.yml@refs/heads/main
      REPO: ${{ github.repository }}
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Runtime deploys run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::the runtime is built and deployed from main only"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200  # the role allows 2 h: creating the audit database takes most of one
          mask-aws-account-id: true
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: "v3.1.3"
      - name: Verify the signature and the provenance before anything is deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cosign verify "$IMAGE" --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          gh attestation verify "oci://$IMAGE" --repo "$REPO" > /dev/null
          echo "signature and provenance verified: $IMAGE"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: init with the S3 backend
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > terraform/runtime/backend_override.tf
          terraform -chdir=terraform/runtime init -input=false \
            -backend-config="bucket=$BUCKET" -backend-config="key=runtime/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          terraform -chdir=terraform/runtime workspace select -or-create "$RUNTIME_ENV"
      - name: plan
        run: terraform -chdir=terraform/runtime plan -input=false -no-color -var "runtime_image=$IMAGE" -out="$RUNNER_TEMP/tfplan"
      - name: apply the plan just made
        if: env.ACTION == 'apply'
        run: |
          set -o pipefail
          # 2>&1: Terraform writes its errors to stderr - the retry's first real run saw none of them (2026-10-11).
          if terraform -chdir=terraform/runtime apply -input=false -no-color "$RUNNER_TEMP/tfplan" 2>&1 \
              | tee "$RUNNER_TEMP/apply.log"; then
            exit 0
          fi
          # A pause releases the NAT gateway's address right after the gateway. For a moment EC2 still lists the
          # address as associated, and answers the release's disassociate with UnauthorizedOperation, not "not
          # found" (2026-10-09; twice on 2026-10-11) - everything else is already gone. Only when that is the one
          # error: plan what is left and apply it, once.
          if [ "$(grep -c 'Error: ' "$RUNNER_TEMP/apply.log")" != 1 ] \
              || ! grep -q 'Error: disassociating EC2 EIP' "$RUNNER_TEMP/apply.log"; then
            exit 1
          fi
          echo "::notice::the NAT gateway's address was still listed as associated; applying what is left, once"
          terraform -chdir=terraform/runtime plan -input=false -no-color -var "runtime_image=$IMAGE" \
            -out="$RUNNER_TEMP/tfplan-rest"
          terraform -chdir=terraform/runtime apply -input=false -no-color "$RUNNER_TEMP/tfplan-rest"
      # The audit's tables, triggers and writer login, from inside the VPC (migrate.tf). Idempotent.
      - name: the audit's schema and writer login
        if: env.ACTION == 'apply'
        run: |
          # Paused (SSM tf/paused = true) there is no way out of the VPC - the Lambda cannot reach Secrets Manager -
          # and nothing writes to the audit; the schema is checked at the next resume.
          if [ "$(aws ssm get-parameter --name "/warden/$RUNTIME_ENV/tf/paused" --query Parameter.Value --output text 2>/dev/null)" = "true" ]; then
            echo "paused: the audit's schema is checked at the next resume"
            exit 0
          fi
          fn=$(terraform -chdir=terraform/runtime output -json runtime | jq -r .migrate_function)
          aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out --payload '{}' \
            --query FunctionError --output text "$RUNNER_TEMP/migrate.json" > "$RUNNER_TEMP/migrate.err"
          if [ "$(cat "$RUNNER_TEMP/migrate.err")" != "None" ]; then
            echo "::error::the migrate Lambda failed: $(cat "$RUNNER_TEMP/migrate.json")"
            exit 1
          fi
      # A deploy is done when every zone runs the image just built - not when Terraform has asked for it. On
      # 2026-10-15 the apply succeeded, ECS could not start the new tasks (the account's Fargate vCPU limit) and
      # rolled every zone back, and this workflow said success.
      - name: Every zone runs the image just built
        if: env.ACTION == 'apply'
        run: |
          if [ "$(aws ssm get-parameter --name "/warden/$RUNTIME_ENV/tf/paused" --query Parameter.Value --output text 2>/dev/null)" = "true" ]; then
            echo "paused: no zone runs"
            exit 0
          fi
          cluster="warden-$RUNTIME_ENV-runtime"
          services=$(aws ecs list-services --cluster "$cluster" --query 'serviceArns[]' --output text)
          test -n "$services" || { echo "::error::no services in $cluster"; exit 1; }
          # shellcheck disable=SC2086
          aws ecs wait services-stable --cluster "$cluster" --services $services || true
          bad=0
          for svc in $services; do
            # shellcheck disable=SC2086
            read -r name count state td <<< "$(aws ecs describe-services --cluster "$cluster" --services "$svc" \
              --query 'services[0].[serviceName, length(deployments), deployments[0].rolloutState, deployments[0].taskDefinition]' \
              --output text)"
            image=$(aws ecs describe-task-definition --task-definition "$td" \
              --query 'taskDefinition.containerDefinitions[0].image' --output text)
            if [ "$count" != 1 ] || [ "$state" != COMPLETED ] || [ "$image" != "$IMAGE" ]; then
              echo "::error::$name is not on the new image (deployments $count, rollout $state)"
              aws ecs describe-services --cluster "$cluster" --services "$svc" \
                --query 'services[0].events[0:3].message' --output text
              bad=1
            else
              echo "$name runs the new image"
            fi
          done
          exit "$bad"

  restart:
    if: inputs.action == 'restart'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ops
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Runtime deploys run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::the runtime is built and deployed from main only"
          exit 1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      # The same task definitions, started again: each worker reads its secrets at start. Fails unless every
      # service is stable again - a worker that cannot start is reported here, not found later.
      - name: A fresh deployment of every zone's service
        run: |
          cluster="warden-$RUNTIME_ENV-runtime"
          services=$(aws ecs list-services --cluster "$cluster" --query 'serviceArns[]' --output text)
          test -n "$services" || { echo "::error::no services in $cluster: apply first"; exit 1; }
          for svc in $services; do
            aws ecs update-service --cluster "$cluster" --service "$svc" --force-new-deployment \
              --query service.serviceName --output text
          done
          # shellcheck disable=SC2086
          aws ecs wait services-stable --cluster "$cluster" --services $services
          echo "every zone's service is stable"
