# Weekly update PRs (free). Actions are pinned to commit SHAs (2026-09-27); Dependabot keeps the
# pins current instead of letting them go stale. PRs run CI; note ci.yml's paths-ignore skips the
# security job for PRs that touch only infra.yml/apps.yml (audit 2026-09-28 A-I-15, being fixed).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # never propose a release younger than a week: most hijacked releases are caught by then
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # never propose a release younger than a week: most hijacked releases are caught by then
    open-pull-requests-limit: 5
