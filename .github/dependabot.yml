# Weekly update PRs (free). Actions are pinned to commit SHAs (2026-09-27); Dependabot keeps the
# pins current instead of letting them go stale. PRs run CI; the workflow scan (scan-workflows.yml) runs on every
# change, including PRs that touch only the infra or apps pipelines (audit A-I-15).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # never propose a release younger than a week: most hijacked releases are caught by then
  # The package, CI tools and pipeline helpers: one uv.lock, every hash in it (audit A-I-9).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # The demo apps' hashed requirements, compiled from requirements.in.
  - package-ecosystem: pip
    directories:
      - /scenarios/fullstack/app
      - /scenarios/fullstack/lambdas/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # never propose a release younger than a week: most hijacked releases are caught by then
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /
      - /scenarios/fullstack/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
