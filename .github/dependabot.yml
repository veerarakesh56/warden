# Weekly update PRs (free). Actions are pinned to commit SHAs; Dependabot keeps the
# pins current instead of letting them go stale. PRs run CI; the workflow scan (scan-workflows.yml) runs on every
# change, including PRs that touch only the infra or apps pipelines.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # never propose a release younger than a week: most hijacked releases are caught by then
  # The package, CI tools and pipeline helpers: one uv.lock, every hash in it.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  # The demo apps' hashed requirements, compiled from requirements.in.
  - package-ecosystem: pip
    directories:
      - /scenarios/fullstack/app
      - /scenarios/fullstack/lambdas/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7  # never propose a release younger than a week: most hijacked releases are caught by then
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /
      - /scenarios/fullstack/app
      - /.github/base-images  # the base and CI service images (see the file: not built)
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # New digests and patch releases only. A new Python (3.12 -> 3.14) is a deliberate change of its own: the
    # images' Python must match what their hashed requirements were compiled for (the app and the Lambdas: 3.12).
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The CI services and k3s: new digests and patch releases only; a new major is a deliberate change.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: mysql
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
      - dependency-name: mongo
        update-types: ["version-update:semver-major"]
      - dependency-name: rancher/k3s
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
