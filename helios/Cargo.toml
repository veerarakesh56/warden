[workspace]
resolver = "2"
members = [
    "crates/helios-cli",
    "crates/helios-graph",
    "crates/helios-models",
    "crates/helios-engine",
    "crates/helios-aws",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/veerarakesh56/helios"
authors = ["Veera Rakesh Kethari"]

[workspace.dependencies]
# Local crates
helios-graph = { path = "crates/helios-graph" }
helios-models = { path = "crates/helios-models" }
helios-engine = { path = "crates/helios-engine" }
helios-aws = { path = "crates/helios-aws" }

# Serde / JSON / YAML
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI + terminal
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
comfy-table = "7"
indicatif = "0.17"

# Graph
petgraph = { version = "0.6", features = ["serde-1"] }

# Testing
insta = { version = "1", features = ["yaml", "json"] }
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 1
