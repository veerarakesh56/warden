[project]
name = "helios-ai"
version = "0.2.0"
description = "Claude-powered explanation shell for the Helios deterministic infrastructure simulator."
readme = "README.md"
authors = [
    { name = "Veera Rakesh Kethari" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.96.0",
    "pydantic>=2.6",
]

[project.scripts]
helios-ai = "helios_ai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "syrupy>=4.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
