# SonarQube Cloud Automatic Analysis reads this file (not sonar-project.properties) from the root
# of the default branch: https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis
#
# fixtures/ is test DATA, not product code: deliberately weak example infrastructure (public
# IPs, an unencrypted database with no backup retention, a load balancer and a bucket with no policy or logging) that
# Helios's simulator and the Rust/Action tests run against. Each terraform-show.json there is
# generated from its main.tf, and golden outputs in crates/helios-cli/tests/golden/ are pinned to
# them, so "fixing" the infra would change the inputs the tests exist to check.
sonar.exclusions=fixtures/**
