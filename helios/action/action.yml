name: Helios PR analysis
description: >
  Run helios over every scenario (yours, or the standard zone / region / NAT
  set for the plan) against your Terraform plan (and, as
  advisory output only, verify a matching fix file if one is committed),
  upload the resulting `inspect` JSON artifacts, and post a single sticky PR
  comment summarising results.
author: veerarakesh56

branding:
  icon: alert-triangle
  color: orange

inputs:
  terraform-json:
    description: >
      REQUIRED. Path, relative to your repository root, of the
      `terraform show -json` output to simulate (of a saved plan or a state):
      a file, or a directory holding terraform-show.json.
    required: true
  scenarios-glob:
    description: >
      Glob (relative to your repository root) for scenario YAML files. Empty
      (the default): the standard set for your plan, generated by
      `helios scenarios` -- an az-outage per zone, a region-outage per region
      and a single-nat-death per NAT gateway it declares.
    required: false
    default: ""
  fixes-dir:
    description: >
      Directory holding `<scenario-stem>.json` FixProposal files. If a
      matching file exists, helios verify runs after inspect and its report is
      shown as ADVISORY output: a fix file never passes a scenario (it edits
      Helios's in-memory graph, not your Terraform).
    required: false
    default: fixes
  github-token:
    description: >
      Token used to post the PR comment. Needs pull-requests:write. Pass
      secrets.GITHUB_TOKEN (or github.token) from the calling workflow.
    required: true
  artifact-name:
    description: Name of the workflow artifact holding inspect JSONs.
    required: false
    default: helios-inspect
  fail-on:
    description: >
      `never` (default) only reports. `failures` fails the step, after the
      comment and artifacts are posted, when any scenario failed on the real
      plan: its chain has failures, or it is inconclusive (helios exits 3: it
      cannot be evaluated, never a pass). Fix files do not affect the gate.
    required: false
    default: never

outputs:
  comment-body:
    description: The markdown body posted to the PR (also saved to $RUNNER_TEMP/helios-comment.md).
    value: ${{ steps.build-comment.outputs.body-path }}
  artifact-dir:
    description: Local directory containing the per-scenario inspect JSONs.
    value: ${{ steps.run.outputs.artifact-dir }}

runs:
  using: composite
  steps:
    # Helios is built from the action's own checkout (`github.action_path/..`), never from the
    # caller's workspace. hashFiles() only reads the workspace, so the cache key is computed here.
    - name: Helios source key
      id: helios-src
      shell: bash
      env:
        SRC: ${{ github.action_path }}/..
      run: |
        set -euo pipefail
        cd "$SRC"
        key=$(find Cargo.lock Cargo.toml rust-toolchain.toml .cargo scripts/fetch_z3.py crates \
          -type f \( -name '*.rs' -o -name '*.toml' -o -name '*.lock' -o -name '*.py' \) \
          | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-40)
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Cache prebuilt helios binary
      id: helios-bin-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ github.action_path }}/bin
        key: helios-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.helios-src.outputs.key }}

    - name: Build helios (cache miss only)
      if: steps.helios-bin-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SRC: ${{ github.action_path }}/..
        BIN: ${{ github.action_path }}/bin
      run: |
        set -euo pipefail
        cd "$SRC"
        python3 scripts/fetch_z3.py
        cargo build --release --locked --bin helios
        mkdir -p "$BIN"
        cp target/release/helios "$BIN/helios"
        chmod +x "$BIN/helios"

    - name: Standard scenarios for the plan (scenarios-glob empty)
      id: scenarios
      shell: bash
      env:
        HELIOS_BIN: ${{ github.action_path }}/bin/helios
        TERRAFORM_JSON: ${{ inputs.terraform-json }}
        SCENARIOS_GLOB: ${{ inputs.scenarios-glob }}
        OUT: ${{ runner.temp }}/helios-scenarios
      run: |
        set -euo pipefail
        if [[ -z "$TERRAFORM_JSON" ]]; then
          echo "::error::helios: set the terraform-json input to your \`terraform show -json\` output"
          exit 1
        fi
        if [[ -n "$SCENARIOS_GLOB" ]]; then
          echo "glob=$SCENARIOS_GLOB" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        rm -rf "$OUT"
        "$HELIOS_BIN" scenarios "$TERRAFORM_JSON" --out "$OUT"
        echo "glob=$OUT/*.yaml" >> "$GITHUB_OUTPUT"

    - name: Run scenarios
      id: run
      shell: bash
      env:
        HELIOS_BIN: ${{ github.action_path }}/bin/helios
        SCENARIOS_GLOB: ${{ steps.scenarios.outputs.glob }}
        FIXES_DIR: ${{ inputs.fixes-dir }}
        TERRAFORM_JSON: ${{ inputs.terraform-json }}
        ARTIFACT_DIR: ${{ runner.temp }}/helios-artifact
        GATE_FILE: ${{ runner.temp }}/helios-gate.txt
      run: ${{ github.action_path }}/scripts/run-scenarios.sh

    - name: Build PR comment body
      id: build-comment
      shell: bash
      env:
        ARTIFACT_DIR: ${{ steps.run.outputs.artifact-dir }}
        COMMENT_PATH: ${{ runner.temp }}/helios-comment.md
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        RUN_ID: ${{ github.run_id }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
      run: ${{ github.action_path }}/scripts/build-comment.sh

    - name: Upload inspect artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: 14

    - name: Post sticky PR comment
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_PATH: ${{ runner.temp }}/helios-comment.md
      run: ${{ github.action_path }}/scripts/post-sticky.sh

    - name: Gate on failed scenarios (fail-on)
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        GATE_FILE: ${{ runner.temp }}/helios-gate.txt
      run: |
        set -euo pipefail
        case "$FAIL_ON" in
          never) exit 0 ;;
          failures) ;;
          *) echo "::error::fail-on must be 'never' or 'failures', got '$FAIL_ON'"; exit 1 ;;
        esac
        if [[ -s "$GATE_FILE" ]]; then
          echo "::error::helios: failing scenarios: $(paste -sd, "$GATE_FILE")"
          exit 1
        fi
