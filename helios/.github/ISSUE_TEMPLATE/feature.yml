name: Feature request
description: Suggest a new resource type, scenario kind, or capability.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New AWS resource types and scenario kinds are the most welcome
        feature requests. See `docs/ARCHITECTURE.md` for the seams to
        extend.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the failure mode or use case Helios does not yet cover.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Sketch the change. New resource kind? New scenario kind? CLI flag? API change?
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New AWS resource type (helios-models)
        - New scenario kind (helios-engine)
        - CLI / UX change
        - Web viewer
        - GitHub Action
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you did not pick them.
