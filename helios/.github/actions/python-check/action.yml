name: "helios · python-check"
description: >-
  helios-ai: ruff and pytest from its locked venv. Run after the checkout by CI · helios's python-check job, which sets
  PYTHONPATH to helios-ai's source.
runs:
  using: composite
  steps:
    # uv, pinned and checksum-verified, as in every other pipeline of this repository.
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        version: "0.13.1"
        checksum: "eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220"
        python-version: "3.12"
        working-directory: helios/helios-ai
        cache-suffix: "helios-python-check"  # one cache per job: jobs sharing a key raced to save it

    # As in `check`: locked wheels, nothing built. The tools then run from the venv directly
    # (`uv run` would sync again, and build the project).
    - name: Sync dependencies
      shell: bash -e {0}
      working-directory: helios/helios-ai
      run: uv sync --locked --no-build --no-install-project

    - name: ruff check
      shell: bash -e {0}
      working-directory: helios/helios-ai
      run: .venv/bin/ruff check

    - name: pytest
      shell: bash -e {0}
      working-directory: helios/helios-ai
      run: .venv/bin/python -m pytest -v
