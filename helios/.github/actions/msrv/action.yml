name: "helios · msrv"
description: >-
  cargo check on Helios's declared rust-version (1.88). Run after the checkout by CI · helios's msrv job, which sets
  RUSTUP_TOOLCHAIN.
runs:
  using: composite
  steps:
    - name: Install Rust 1.88
      uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88 branch, 2026-10-16
      with:
        toolchain: "1.88"

    - name: Cache cargo registry + target
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: helios

    - name: cargo check on the declared rust-version
      shell: bash -e {0}
      working-directory: helios
      run: cargo check --workspace --all-targets --locked
