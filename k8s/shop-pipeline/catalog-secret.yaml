# catalog-secret, copied from Secrets Manager by the External Secrets Operator (owner item B25; helm/external-secrets).
# The pipeline applies these two; the key itself is never in Git, in a deploy run or on a command line: Terraform makes
# it (terraform/fullstack/secrets_sync.tf) and ESO reads it with its own Pod Identity role.
#
# ⛔ creationPolicy Orphan + refreshPolicy OnChange (owner decision, 2026-10-20): ESO writes the Secret only when this
# ExternalSecret changes - the pipeline changes __KEY_VERSION__ when the key is rotated - and never "heals" an edit
# to the Secret (ESO v2.13.0: Orphan makes isSecretValid true, OnChange skips a refresh of an unchanged spec). Lab
# fault fs-23 removes a key from this Secret and must stay broken until it is reverted, not until ESO's next sync.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: shop
  labels:
    project: warden
spec:
  provider:
    aws:
      service: SecretsManager
      region: "__REGION__"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-secret
  namespace: shop
  labels:
    project: warden
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: catalog-secret
    creationPolicy: Orphan
    template:
      metadata:
        annotations:
          # The Secrets Manager version the Secret holds: a new one (a rotation) changes this spec, so ESO copies it
          # and Reloader restarts catalog-api.
          warden.dev/key-version: "__KEY_VERSION__"
  data:
    - secretKey: CATALOG_SIGNING_KEY
      remoteRef:
        key: "__KEY_SECRET__"
