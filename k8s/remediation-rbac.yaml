# The WRITE path — deliberately separate from the read-only `warden` ServiceAccount in rbac.yaml.
#
# WARDEN is read-only by default. Its one write path is the RemediationWorkflow (decision D16): after a
# signed approval of the exact plan, a worker started with `warden worker --platform k8s` may restart a
# Deployment or scale it up by at most two. This ServiceAccount is the boundary for that: it can `get`
# and `patch` deployments and no other verb or resource.
#
# AUDIT 2026-09-28 (A-I-11): `patch deployments` alone is NOT "restart or scale only" - it could rewrite
# the whole pod template (image, command, serviceAccountName, secret mounts). The ValidatingAdmissionPolicy
# at the end of this file narrows it: for this ServiceAccount, an update may change the replica count by at
# most two (up for a scale, down for its rollback) and the template's restartedAt annotation - nothing
# else. Proven in CI against the real API server (tests/integration/test_live_remediation.py).
#
# Proven from the API server's own view, both sides, in CI:
#   kubectl auth can-i patch  deployments -n default     --as=system:serviceaccount:warden:warden-remediator -> yes
#   kubectl auth can-i get    deployments -n default     --as=system:serviceaccount:warden:warden-remediator -> yes
#   kubectl auth can-i delete pods        -n default     --as=system:serviceaccount:warden:warden-remediator -> no
#   kubectl auth can-i patch  deployments -n kube-system --as=system:serviceaccount:warden:warden-remediator -> no
#   kubectl auth can-i delete deployments -n default     --as=system:serviceaccount:warden:warden-remediator -> no
#
# `get` is needed because a scale reads the current replica count before patching it. Restart and
# scale are both done with a single `patch deployments` (a strategic-merge patch of the template
# annotation, or of spec.replicas) — so one verb covers both and the grant stays minimal.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warden-remediator
  namespace: warden
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: remediation
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: warden-remediator
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: remediation
# The ruler is src/warden/platforms/k8s.py: it calls read_namespaced_deployment (get) and
# patch_namespaced_deployment (patch). Two grants, two callers. Nothing else - not even list; CI runs the
# platform impersonating this ServiceAccount to prove the two are enough.
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
# Granted in the namespace WARDEN may remediate. One RoleBinding per such namespace; never a
# ClusterRoleBinding — that would let it patch deployments cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warden-remediator
  namespace: default
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: remediation
subjects:
  - kind: ServiceAccount
    name: warden-remediator
    namespace: warden
roleRef:
  kind: ClusterRole
  name: warden-remediator
  apiGroup: rbac.authorization.k8s.io
---
# A-I-11: what the remediator's patches may change. Matched only for its own requests; everyone else's
# updates are untouched. Fail closed: if the policy cannot be evaluated, the update is refused.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: warden-remediator-narrow-writes
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: remediation
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: only-the-remediator
      expression: request.userInfo.username == "system:serviceaccount:warden:warden-remediator"
  variables:
    - name: ann
      expression: "has(object.spec.template.metadata.annotations) ? object.spec.template.metadata.annotations : {}"
    - name: oldAnn
      expression: "has(oldObject.spec.template.metadata.annotations) ? oldObject.spec.template.metadata.annotations : {}"
  validations:
    - expression: object.spec.template.spec == oldObject.spec.template.spec
      message: the remediator may not change the pod spec (image, command, service account, volumes)
    - expression: object.spec.selector == oldObject.spec.selector
      message: the remediator may not change the selector
    - expression: >-
        (has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {}) ==
        (has(oldObject.spec.template.metadata.labels) ? oldObject.spec.template.metadata.labels : {})
      message: the remediator may not change the pod labels
    - expression: >-
        variables.ann.all(k, k == "kubectl.kubernetes.io/restartedAt" || (k in variables.oldAnn && variables.oldAnn[k] == variables.ann[k])) &&
        variables.oldAnn.all(k, k == "kubectl.kubernetes.io/restartedAt" || k in variables.ann)
      message: the remediator may change only the restartedAt annotation
    - expression: >-
        has(object.spec.strategy) == has(oldObject.spec.strategy) &&
        (!has(object.spec.strategy) || object.spec.strategy == oldObject.spec.strategy) &&
        (has(object.spec.paused) ? object.spec.paused : false) == (has(oldObject.spec.paused) ? oldObject.spec.paused : false)
      message: the remediator may not change the rollout strategy or pause a rollout
    # The Deployment's own metadata: a dangling ownerReference has the garbage collector delete the Deployment and
    # its pods, a finalizer blocks its deletion (seventh review, 2026-10-01).
    - expression: >-
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) && (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.labels) == has(oldObject.metadata.labels) && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) && (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)
      message: the remediator may not change the Deployment's owners, finalizers, labels or annotations
    - expression: >-
        has(object.spec.minReadySeconds) == has(oldObject.spec.minReadySeconds) && (!has(object.spec.minReadySeconds) || object.spec.minReadySeconds == oldObject.spec.minReadySeconds) &&
        has(object.spec.revisionHistoryLimit) == has(oldObject.spec.revisionHistoryLimit) && (!has(object.spec.revisionHistoryLimit) || object.spec.revisionHistoryLimit == oldObject.spec.revisionHistoryLimit) &&
        has(object.spec.progressDeadlineSeconds) == has(oldObject.spec.progressDeadlineSeconds) && (!has(object.spec.progressDeadlineSeconds) || object.spec.progressDeadlineSeconds == oldObject.spec.progressDeadlineSeconds) &&
        has(object.spec.template.metadata.finalizers) == has(oldObject.spec.template.metadata.finalizers) && (!has(object.spec.template.metadata.finalizers) || object.spec.template.metadata.finalizers == oldObject.spec.template.metadata.finalizers)
      message: the remediator may not change how rollouts are kept or judged, or the pods' finalizers
    # 10 = WARDEN_REMEDIATION_MAX_REPLICAS' default: keep the two in step. Per request only - a policy cannot see
    # the approved plan, so a series of patches can still step down to one replica.
    - expression: >-
        object.spec.replicas >= 1 && object.spec.replicas <= 10 && object.spec.replicas <= oldObject.spec.replicas + 2 &&
        object.spec.replicas >= oldObject.spec.replicas - 2
      message: the remediator may change the replica count by at most two, never below one or above ten
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: warden-remediator-narrow-writes
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/component: remediation
spec:
  policyName: warden-remediator-narrow-writes
  validationActions: ["Deny"]
