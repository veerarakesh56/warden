# The NEGATIVE test for Pod Security. This pod must be REJECTED by the `warden` namespace.
#
# A positive test (the Job is admitted) cannot distinguish "restricted is enforced" from "the
# label is mistyped and nothing is enforced". Applying this and asserting `Forbidden` can. CI runs
# `kubectl apply --dry-run=server -f` on it and fails if the API server ACCEPTS it.
#
# So every IaC linter finding on it is the point (2026-10-16, naming audit item 18): privileged, root,
# and none of the hardening the real workloads carry, because the namespace must refuse exactly that.
# It is never created - a server-side dry run only - so resource limits, probes and a NetworkPolicy
# would mean nothing either. The skips below cover this one object, each with its reason; they are the
# findings checkov 3.3.29 and kube-linter 0.8.3 raised on this file on 2026-10-16. Trivy (0.76.0) has
# no in-file skip for a plain manifest: its inline `trivy:ignore` covers Terraform, CloudFormation,
# Helm and Dockerfiles only (a comment here was tried, and ignored), and a path-scoped
# .trivyignore.yaml is read only when --ignorefile names it. Its KSV findings on this file are expected.
apiVersion: v1
kind: Pod
metadata:
  name: warden-privileged-must-fail
  namespace: warden
  annotations:
    checkov.io/skip1: CKV_K8S_16=negative test - admission must reject a privileged container
    checkov.io/skip2: CKV_K8S_20=negative test - privileged allows escalation, admission must reject it
    checkov.io/skip3: CKV_K8S_23=negative test - admission must reject a root container
    checkov.io/skip4: CKV_K8S_40=negative test - admission must reject UID 0
    checkov.io/skip5: CKV_K8S_28=negative test - privileged holds every capability, admission must reject it
    checkov.io/skip6: CKV_K8S_37=negative test - privileged holds every capability, admission must reject it
    checkov.io/skip7: CKV_K8S_29=negative test - the missing hardening is what admission must reject
    checkov.io/skip8: CKV_K8S_31=negative test - no seccomp profile, admission must reject it
    checkov.io/skip9: CKV_K8S_22=negative test - never created, a server-side dry run only
    checkov.io/skip10: CKV_K8S_8=negative test - never created, a server-side dry run only
    checkov.io/skip11: CKV_K8S_9=negative test - never created, a server-side dry run only
    checkov.io/skip12: CKV_K8S_10=negative test - never created, a server-side dry run only
    checkov.io/skip13: CKV_K8S_11=negative test - never created, a server-side dry run only
    checkov.io/skip14: CKV_K8S_12=negative test - never created, a server-side dry run only
    checkov.io/skip15: CKV_K8S_13=negative test - never created, a server-side dry run only
    checkov.io/skip16: CKV2_K8S_6=negative test - never created, a server-side dry run only
    ignore-check.kube-linter.io/privileged-container: "negative test - admission must reject a privileged container"
    ignore-check.kube-linter.io/privilege-escalation-container: "negative test - admission must reject it"
    ignore-check.kube-linter.io/run-as-non-root: "negative test - admission must reject a root container"
    ignore-check.kube-linter.io/no-read-only-root-fs: "negative test - never created, a server-side dry run only"
    ignore-check.kube-linter.io/unset-cpu-requirements: "negative test - never created, a server-side dry run only"
    ignore-check.kube-linter.io/unset-memory-requirements: "negative test - never created, a server-side dry run only"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: bad
      image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command: ["sh", "-c", "id"]
      securityContext:
        privileged: true          # restricted PSS forbids this
        runAsUser: 0              # and this
