# fs-22 writes an invalid value into catalog-config; fs-23 removes a key from catalog-secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: shop
  labels:
    project: warden-fullstack
data:
  REDIS_HOST: "__REDIS_HOST__"
  DB_HOST: "__DB_READER_HOST__"
  DB_NAME: "__DB_NAME__"
  DB_USER: "catalog" # IAM database login (Pod Identity), read-only
  AWS_REGION: "__REGION__"
  CATALOG_PAGE_SIZE: "20"
  CATALOG_CACHE_TTL_S: "60"
  CART_WORKER_INTERVAL_S: "5"
---
# ⛔ A TEMPLATE. No real value is ever written here; the deploy tool generates the signing key at
# apply time (over stdin). No database password: catalog-api logs in with an IAM token.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secret
  namespace: shop
  labels:
    project: warden-fullstack
type: Opaque
stringData:
  CATALOG_SIGNING_KEY: "__CATALOG_SIGNING_KEY__"
