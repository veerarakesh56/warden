# fs-22 writes an invalid value into catalog-config; fs-23 removes a key from catalog-secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: shop
  labels:
    project: warden
data:
  REDIS_HOST: "__REDIS_HOST__"
  DB_HOST: "__DB_READER_HOST__"
  DB_NAME: "__DB_NAME__"
  DB_USER: "__DB_USER_CATALOG__" # IAM database login (Pod Identity), read-only; named for the environment
  AWS_REGION: "__REGION__"
  CATALOG_PAGE_SIZE: "20"
  CATALOG_CACHE_TTL_S: "60"
  CART_WORKER_INTERVAL_S: "5"
---
# OpenTelemetry for the shop's pods (the image has it off): traces, metrics and logs to the collector in the
# observability namespace, which sends the same data to X-Ray, Grafana and Datadog (owner, 2026-10-14: "use all 3").
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: shop
  labels:
    project: warden
data:
  OTEL_SDK_DISABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=__ENVIRONMENT__"
---
# ⛔ A TEMPLATE. No real value is ever written here; the deploy tool generates the signing key at
# apply time (over stdin). No database password: catalog-api logs in with an IAM token.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secret
  namespace: shop
  labels:
    project: warden
type: Opaque
stringData:
  CATALOG_SIGNING_KEY: "__CATALOG_SIGNING_KEY__"
